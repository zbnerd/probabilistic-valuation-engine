# =============================================================================
# MapleExpectation CI Pipeline
# =============================================================================
# SRE-Gatekeeper (Red Agent) Principles Applied:
#   - Resilience: Timeout guards on every step
#   - Observability: Test reports always uploaded (even on failure)
#   - Fail Fast: PR merge blocked on any test failure
#   - Backpressure: Resource limits on services
#
# Trigger: PR to master/develop, Push to develop
# =============================================================================

name: CI Pipeline

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "master", "develop" ]

permissions:
  contents: read
  checks: write           # Required for test report annotations
  pull-requests: write    # Required for PR comments

# Concurrency: Cancel in-progress runs for same PR (save resources)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '21'  # #262: Virtual Thread 지원을 위해 21로 업그레이드
  GRADLE_OPTS: '-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true'

jobs:
  # ==========================================================================
  # JOB 1: Build & Test (Gate)
  # ==========================================================================
  test:
    name: Build & Test (Unit Only)
    runs-on: ubuntu-latest
    timeout-minutes: 10  # Unit tests only - 10분이면 충분

    # V5 Migration (Issue #589, #590, #591): No external services needed
    # PostgreSQL is provided via Testcontainers

    steps:
      # ------------------------------------------------------------------
      # Step 1: Checkout
      # ------------------------------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for accurate diff

      # ------------------------------------------------------------------
      # Step 2: Setup Java 21
      # ------------------------------------------------------------------
      - name: Setup JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      # ------------------------------------------------------------------
      # Step 3: Setup Gradle
      # ------------------------------------------------------------------
      # Temporarily disable Gradle build cache to ensure clean rebuild
      - name: Setup Gradle
        run: echo "GRADLE_OPTS=-Dorg.gradle.caching=false" >> $GITHUB_ENV

      # ------------------------------------------------------------------
      # Step 4: Grant Execute Permission
      # ------------------------------------------------------------------
      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      # ------------------------------------------------------------------
      # Step 4.5: Apply Code Formatting (Spotless)
      # ------------------------------------------------------------------
      # CI에서 자동으로 포맷 적용 - 포맷 위반으로 인한 실패 방지
      - name: Apply Spotless Formatting
        run: ./gradlew spotlessApply --no-daemon

      # ------------------------------------------------------------------
      # Step 5: Run Tests (Gate - Must Pass)
      # ------------------------------------------------------------------
      # PR/Push: -PfastTest (slow, sentinel, quarantine, nightmare, flaky 제외 → 3-5분)
      # Nightly: 전체 테스트 (별도 워크플로우)
      - name: Run Tests
        id: test
        run: |
          echo "🚀 Running fast tests (CI Gate)"
          ./gradlew clean test -PfastTest --no-daemon --stacktrace
        env:
          SPRING_PROFILES_ACTIVE: test
        continue-on-error: false  # CRITICAL: Block merge on failure

      # ------------------------------------------------------------------
      # Step 6: Upload Test Reports (Always - Even on Failure)
      # ------------------------------------------------------------------
      - name: Upload Test Reports
        if: always()  # Upload even if tests fail
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/reports/tests/
            build/test-results/
          retention-days: 7

      # ------------------------------------------------------------------
      # Step 6.1: Upload Flaky Logs (Issue #210)
      # ------------------------------------------------------------------
      - name: Upload Flaky Logs
        if: always()  # 실패해도 업로드 (P0)
        uses: actions/upload-artifact@v4
        with:
          name: flaky-logs-${{ github.run_id }}
          path: build/flaky/
          retention-days: 30
          if-no-files-found: ignore

      # ------------------------------------------------------------------
      # Step 7: Publish Test Results (PR Annotations)
      # Step 7 REMOVED: dorny/test-reporter 삭제 - XML 리포트 경로 문제로 PR annotation 불필요
      # ------------------------------------------------------------------

      # ------------------------------------------------------------------
      # Step 8: Build JAR (Only if tests pass)
      # ------------------------------------------------------------------
      - name: Build Application
        if: success()
        run: ./gradlew build -x test --no-daemon

      # ------------------------------------------------------------------
      # Step 9: Upload Build Artifact
      # ------------------------------------------------------------------
      - name: Upload Build Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: application-jar
          path: build/libs/*.jar
          retention-days: 1


  # ==========================================================================
  # JOB 3: Security Scan (Optional - SAST)
  # ==========================================================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request'
    timeout-minutes: 10
    continue-on-error: true  # Non-blocking for now

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'

      # Dependency vulnerability check
      - name: Dependency Check
        run: |
          ./gradlew dependencies --configuration runtimeClasspath > dependencies.txt
          echo "Dependencies exported for review"

      - name: Upload Dependency Report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-report
          path: dependencies.txt
          retention-days: 7


  # ==========================================================================
  # JOB 4: MinIO SA-scope IT (Ephemeral)
  # ==========================================================================
  # Plan: docs/superpowers/plans/2026-06-15-minio-operations.md (Task 13)
  # Spins up an ephemeral MinIO service container and generates per-job random
  # SA keys via openssl — no long-lived secrets in GitHub.
  minio-it:
    name: MinIO SA scope IT (ephemeral)
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15

    services:
      minio:
        image: minio/minio:latest
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports:
          - 9000:9000
        options: >-
          --health-cmd "mc ready local"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      INTEGRATION_MINIO: "true"
      MINIO_ENDPOINT: http://localhost:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      # Per-job random SA keys are set by `gen-keys` step (id) and exposed
      # via step-level `env:` on bootstrap/Run IT — job-level env cannot
      # reference steps.* (GH Actions context scoping rule).

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      # Per-job random SA keys. Never stored in GitHub Secrets.
      - name: Generate ephemeral SA keys
        id: gen-keys
        run: |
          SA_EXT_API_SECRET_KEY=$(openssl rand -hex 16)
          SA_CALCULATOR_SECRET_KEY=$(openssl rand -hex 16)
          SA_SYNCHRONIZER_SECRET_KEY=$(openssl rand -hex 16)
          SA_CLEANUP_SECRET_KEY=$(openssl rand -hex 16)
          echo "SA_EXT_API_SECRET_KEY=$SA_EXT_API_SECRET_KEY" >> "$GITHUB_OUTPUT"
          echo "SA_CALCULATOR_SECRET_KEY=$SA_CALCULATOR_SECRET_KEY" >> "$GITHUB_OUTPUT"
          echo "SA_SYNCHRONIZER_SECRET_KEY=$SA_SYNCHRONIZER_SECRET_KEY" >> "$GITHUB_OUTPUT"
          echo "SA_CLEANUP_SECRET_KEY=$SA_CLEANUP_SECRET_KEY" >> "$GITHUB_OUTPUT"

      # Bootstrap: create bucket, ILM, 4 SAs, 4 policies.
      # Uses --network host so the bootstrap container can reach the service
      # container's MinIO on localhost:9000.
      - name: Run bootstrap
        env:
          SA_EXT_API_SECRET_KEY: ${{ steps.gen-keys.outputs.SA_EXT_API_SECRET_KEY }}
          SA_CALCULATOR_SECRET_KEY: ${{ steps.gen-keys.outputs.SA_CALCULATOR_SECRET_KEY }}
          SA_SYNCHRONIZER_SECRET_KEY: ${{ steps.gen-keys.outputs.SA_SYNCHRONIZER_SECRET_KEY }}
          SA_CLEANUP_SECRET_KEY: ${{ steps.gen-keys.outputs.SA_CLEANUP_SECRET_KEY }}
        run: |
          docker run --rm \
            --network host \
            -e MINIO_ENDPOINT=http://localhost:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            -e "SA_EXT_API_SECRET_KEY=${SA_EXT_API_SECRET_KEY}" \
            -e "SA_CALCULATOR_SECRET_KEY=${SA_CALCULATOR_SECRET_KEY}" \
            -e "SA_SYNCHRONIZER_SECRET_KEY=${SA_SYNCHRONIZER_SECRET_KEY}" \
            -e "SA_CLEANUP_SECRET_KEY=${SA_CLEANUP_SECRET_KEY}" \
            -v "${{ github.workspace }}/docker/minio:/scripts:ro" \
            minio/mc:latest \
            /bin/sh /scripts/bootstrap.sh

      - name: Verify SAs and ILM
        run: |
          set -euo pipefail
          SAs=$(docker run --rm --network host \
            -e MINIO_ENDPOINT=http://localhost:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/mc:latest admin user list local 2>/dev/null)
          echo "Users returned by MinIO:"
          echo "$SAs"
          for sa in ext-api calculator synchronizer cleanup; do
            if ! echo "$SAs" | grep -q "^$sa$"; then
              echo "ERROR: expected SA '$sa' missing from MinIO user list"
              exit 1
            fi
          done
          echo "All 4 SAs verified."

      - name: Run IT (boot smoke + scope + structural)
        env:
          INTEGRATION_MINIO: "true"
          SA_EXT_API_SECRET_KEY: ${{ steps.gen-keys.outputs.SA_EXT_API_SECRET_KEY }}
          SA_CALCULATOR_SECRET_KEY: ${{ steps.gen-keys.outputs.SA_CALCULATOR_SECRET_KEY }}
          SA_SYNCHRONIZER_SECRET_KEY: ${{ steps.gen-keys.outputs.SA_SYNCHRONIZER_SECRET_KEY }}
          SA_CLEANUP_SECRET_KEY: ${{ steps.gen-keys.outputs.SA_CLEANUP_SECRET_KEY }}
        run: |
          ./gradlew :module-infra:test \
            --tests "*BootSmokeIT*" \
            --tests "*MinioPolicyScopeIT*" \
            --tests "*MinioPolicyJsonTest*" \
            -PintegrationTest \
            -DINTEGRATION_MINIO=true \
            --rerun-tasks \
            --no-daemon \
            --stacktrace
