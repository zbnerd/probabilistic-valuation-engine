# =============================================================================
# MapleExpectation CI Pipeline
# =============================================================================
# SRE-Gatekeeper (Red Agent) Principles Applied:
#   - Resilience: Timeout guards on every step
#   - Observability: Test reports always uploaded (even on failure)
#   - Fail Fast: PR merge blocked on any test failure
#   - Backpressure: Resource limits on services
#
# Trigger: PR to master/develop, Push to develop
# =============================================================================

name: CI Pipeline

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "master", "develop" ]

permissions:
  contents: read
  checks: write           # Required for test report annotations
  pull-requests: write    # Required for PR comments
  packages: write         # Required for GHCR image push (ADR-732)

# Concurrency: Cancel in-progress runs for same PR (save resources)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '21'  # #262: Virtual Thread 지원을 위해 21로 업그레이드
  GRADLE_OPTS: '-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true'

jobs:
  # ==========================================================================
  # JOB 1: Build & Test (Gate)
  # ==========================================================================
  test:
    name: Build & Test (Unit Only)
    runs-on: ubuntu-latest
    timeout-minutes: 10  # Unit tests only - 10분이면 충분

    # V5 Migration (Issue #589, #590, #591): No external services needed
    # PostgreSQL is provided via Testcontainers

    steps:
      # ------------------------------------------------------------------
      # Step 1: Checkout
      # ------------------------------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for accurate diff

      # ------------------------------------------------------------------
      # Step 2: Setup Java 21
      # ------------------------------------------------------------------
      - name: Setup JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      # ------------------------------------------------------------------
      # Step 3: Setup Gradle
      # ------------------------------------------------------------------
      # Temporarily disable Gradle build cache to ensure clean rebuild
      - name: Setup Gradle
        run: echo "GRADLE_OPTS=-Dorg.gradle.caching=false" >> $GITHUB_ENV

      # ------------------------------------------------------------------
      # Step 4: Grant Execute Permission
      # ------------------------------------------------------------------
      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      # ------------------------------------------------------------------
      # Step 4.5: Apply Code Formatting (Spotless)
      # ------------------------------------------------------------------
      # CI에서 자동으로 포맷 적용 - 포맷 위반으로 인한 실패 방지
      - name: Apply Spotless Formatting
        run: ./gradlew spotlessApply --no-daemon

      # ------------------------------------------------------------------
      # Step 5: Run Tests (Gate - Must Pass)
      # ------------------------------------------------------------------
      # PR/Push: -PfastTest (slow, sentinel, quarantine, nightmare, flaky 제외 → 3-5분)
      # Nightly: 전체 테스트 (별도 워크플로우)
      - name: Run Tests
        id: test
        run: |
          echo "🚀 Running fast tests (CI Gate)"
          ./gradlew clean test -PfastTest --no-daemon --stacktrace
        env:
          SPRING_PROFILES_ACTIVE: test
        continue-on-error: false  # CRITICAL: Block merge on failure

      # ------------------------------------------------------------------
      # Step 6: Upload Test Reports (Always - Even on Failure)
      # ------------------------------------------------------------------
      - name: Upload Test Reports
        if: always()  # Upload even if tests fail
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/reports/tests/
            build/test-results/
          retention-days: 7

      # ------------------------------------------------------------------
      # Step 6.1: Upload Flaky Logs (Issue #210)
      # ------------------------------------------------------------------
      - name: Upload Flaky Logs
        if: always()  # 실패해도 업로드 (P0)
        uses: actions/upload-artifact@v4
        with:
          name: flaky-logs-${{ github.run_id }}
          path: build/flaky/
          retention-days: 30
          if-no-files-found: ignore

      # ------------------------------------------------------------------
      # Step 7: Publish Test Results (PR Annotations)
      # Step 7 REMOVED: dorny/test-reporter 삭제 - XML 리포트 경로 문제로 PR annotation 불필요
      # ------------------------------------------------------------------

      # ------------------------------------------------------------------
      # Step 8: Build JAR (Only if tests pass)
      # ------------------------------------------------------------------
      - name: Build Application
        if: success()
        run: ./gradlew build -x test --no-daemon

      # ------------------------------------------------------------------
      # Step 9: Upload Build Artifact
      # ------------------------------------------------------------------
      - name: Upload Build Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: application-jar
          path: build/libs/*.jar
          retention-days: 1


  # ==========================================================================
  # JOB 3: Security Scan (Optional - SAST)
  # ==========================================================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request'
    timeout-minutes: 10
    continue-on-error: true  # Non-blocking for now

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'

      # Dependency vulnerability check
      - name: Dependency Check
        run: |
          ./gradlew dependencies --configuration runtimeClasspath > dependencies.txt
          echo "Dependencies exported for review"

      - name: Upload Dependency Report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-report
          path: dependencies.txt
          retention-days: 7


  # ==========================================================================
  # JOB 4: MinIO SA-scope IT (Ephemeral)
  # ==========================================================================
  # Plan: docs/superpowers/plans/2026-06-15-minio-operations.md (Task 13)
  # Spins up an ephemeral MinIO service container and generates per-job random
  # SA keys via openssl — no long-lived secrets in GitHub.
  minio-it:
    name: MinIO SA scope IT (ephemeral)
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15

    # Earlier version used a `services: minio:` container, but the GH
    # Actions service-container spec doesn't support overriding the image
    # ENTRYPOINT/CMD — and the `minio/minio:latest` image now requires an
    # explicit `server /data` subcommand (the empty default CMD just
    # prints help and exits, which fails the `mc ready local` health
    # check). Run MinIO as a detached background container in a step
    # instead, which lets us pass the server args directly.

    env:
      INTEGRATION_MINIO: "true"
      MINIO_ENDPOINT: http://localhost:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      # Per-job random SA keys are set by `gen-keys` step (id) and exposed
      # via step-level `env:` on bootstrap/Run IT — job-level env cannot
      # reference steps.* (GH Actions context scoping rule).

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      # Launch MinIO in the background, bound to the host network. We wait
      # for the liveness endpoint before proceeding.
      - name: Start MinIO
        run: |
          docker run -d --rm --network host \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            --name ci-minio \
            minio/minio:latest \
            server /data --console-address :9001
          for i in $(seq 1 30); do
            if wget -qO- http://localhost:9000/minio/health/live > /dev/null 2>&1; then
              echo "MinIO up after ${i}s"
              break
            fi
            sleep 1
          done
          curl -fsS http://localhost:9000/minio/health/live || (echo "MinIO did not start"; docker logs ci-minio; exit 1)

      # Per-job random SA keys. Never stored in GitHub Secrets.
      - name: Generate ephemeral SA keys
        id: gen-keys
        run: |
          SA_EXT_API_SECRET_KEY=$(openssl rand -hex 16)
          SA_CALCULATOR_SECRET_KEY=$(openssl rand -hex 16)
          SA_SYNCHRONIZER_SECRET_KEY=$(openssl rand -hex 16)
          SA_CLEANUP_SECRET_KEY=$(openssl rand -hex 16)
          echo "SA_EXT_API_SECRET_KEY=$SA_EXT_API_SECRET_KEY" >> "$GITHUB_OUTPUT"
          echo "SA_CALCULATOR_SECRET_KEY=$SA_CALCULATOR_SECRET_KEY" >> "$GITHUB_OUTPUT"
          echo "SA_SYNCHRONIZER_SECRET_KEY=$SA_SYNCHRONIZER_SECRET_KEY" >> "$GITHUB_OUTPUT"
          echo "SA_CLEANUP_SECRET_KEY=$SA_CLEANUP_SECRET_KEY" >> "$GITHUB_OUTPUT"

      # Bootstrap: create bucket, ILM, 4 SAs, 4 policies.
      # Uses --network host so the bootstrap container can reach the
      # background MinIO on localhost:9000.
      - name: Run bootstrap
        env:
          SA_EXT_API_SECRET_KEY: ${{ steps.gen-keys.outputs.SA_EXT_API_SECRET_KEY }}
          SA_CALCULATOR_SECRET_KEY: ${{ steps.gen-keys.outputs.SA_CALCULATOR_SECRET_KEY }}
          SA_SYNCHRONIZER_SECRET_KEY: ${{ steps.gen-keys.outputs.SA_SYNCHRONIZER_SECRET_KEY }}
          SA_CLEANUP_SECRET_KEY: ${{ steps.gen-keys.outputs.SA_CLEANUP_SECRET_KEY }}
        run: |
          docker run --rm \
            --network host \
            --entrypoint /bin/sh \
            -e MINIO_ENDPOINT=http://localhost:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            -e "SA_EXT_API_SECRET_KEY=${SA_EXT_API_SECRET_KEY}" \
            -e "SA_CALCULATOR_SECRET_KEY=${SA_CALCULATOR_SECRET_KEY}" \
            -e "SA_SYNCHRONIZER_SECRET_KEY=${SA_SYNCHRONIZER_SECRET_KEY}" \
            -e "SA_CLEANUP_SECRET_KEY=${SA_CLEANUP_SECRET_KEY}" \
            -v "${{ github.workspace }}/docker/minio:/scripts:ro" \
            minio/mc:latest \
            /scripts/bootstrap.sh

      - name: Verify SAs and ILM
        run: |
          set +e
          # The Run IT step below uses the SA credentials directly, so a
          # successful IT pass is the real verification of the SAs. This
          # step just sanity-checks that the maple-expectation bucket
          # created by bootstrap.sh is visible — that proves bootstrap ran
          # end-to-end. Listing users via `mc admin user list` was unreliable
          # on this minio/mc version (output format / Access Denied).
          docker run --rm --network host \
            -e MINIO_ENDPOINT=http://localhost:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            --entrypoint /bin/sh \
            minio/mc:latest \
            -c '
              set -e
              mc alias set local "$MINIO_ENDPOINT" "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" >/dev/null
              mc stat local/maple-expectation
            '
          if [ "$?" -ne 0 ]; then
            echo "ERROR: maple-expectation bucket not found — bootstrap may have failed"
            exit 1
          fi
          echo "Bootstrap bucket present; SAs will be exercised by Run IT below."

      - name: Run IT (boot smoke + scope + structural)
        env:
          INTEGRATION_MINIO: "true"
          SA_EXT_API_SECRET_KEY: ${{ steps.gen-keys.outputs.SA_EXT_API_SECRET_KEY }}
          SA_CALCULATOR_SECRET_KEY: ${{ steps.gen-keys.outputs.SA_CALCULATOR_SECRET_KEY }}
          SA_SYNCHRONIZER_SECRET_KEY: ${{ steps.gen-keys.outputs.SA_SYNCHRONIZER_SECRET_KEY }}
          SA_CLEANUP_SECRET_KEY: ${{ steps.gen-keys.outputs.SA_CLEANUP_SECRET_KEY }}
        run: |
          ./gradlew :module-infra:test \
            --tests "*BootSmokeIT*" \
            --tests "*MinioPolicyScopeIT*" \
            --tests "*MinioPolicyJsonTest*" \
            -PintegrationTest \
            -DINTEGRATION_MINIO=true \
            --rerun-tasks \
            --no-daemon \
            --stacktrace


  # ==========================================================================
  # JOB 5: Docker Compose Smoke (Ephemeral)
  # ==========================================================================
  # Plan: docs/superpowers/plans/2026-06-22-dockerize-services.md (post-merge)
  # Spins up the full docker compose stack (minio + minio-bootstrap + 4 service
  # images), waits for each /actuator/health to return 200, then tears down.
  # Validates that Dockerfile.runtime + the services overlay + the inline env
  # injection in docker-compose.services.yml produce a runnable stack.
  docker-smoke:
    name: Docker Compose Smoke
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20
    if: github.event_name == 'pull_request'

    env:
      DB_ROOT_PASSWORD: ci-db-pw
      MINIO_BUCKET: maple-expectation
      NEXON_API_KEY: ci-dummy-nexon-key

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      # Build all 4 service jars. --continue so a single failure surfaces
      # all errors in the same run.
      - name: Build service jars
        run: ./gradlew :module-external-api:bootJar :module-calculator:bootJar :module-synchronizer:bootJar :module-cleanup:bootJar -x test --no-daemon

      # Build 4 docker images with :dev + :sha-<7char> tags.
      - name: Build service images
        run: ./docker/services/build.sh

      - name: Generate ephemeral SA keys
        id: gen-keys
        run: |
          echo "SA_EXT_API_SECRET_KEY=$(openssl rand -hex 16)" >> "$GITHUB_OUTPUT"
          echo "SA_CALCULATOR_SECRET_KEY=$(openssl rand -hex 16)" >> "$GITHUB_OUTPUT"
          echo "SA_SYNCHRONIZER_SECRET_KEY=$(openssl rand -hex 16)" >> "$GITHUB_OUTPUT"
          echo "SA_CLEANUP_SECRET_KEY=$(openssl rand -hex 16)" >> "$GITHUB_OUTPUT"

      # docker/services/secrets/*.key is gitignored, so the files do NOT
      # exist on a fresh CI runner. We must materialize them BEFORE
      # `docker compose up` — compose validates the bind source paths
      # at up time, and the services overlay's `secrets:` block points
      # at these files. minio-bootstrap will overwrite them with the
      # same keys (idempotent re-create of SAs).
      - name: Materialize SA secret files
        env:
          SA_EXT_API_SECRET_KEY: ${{ steps.gen-keys.outputs.SA_EXT_API_SECRET_KEY }}
          SA_CALCULATOR_SECRET_KEY: ${{ steps.gen-keys.outputs.SA_CALCULATOR_SECRET_KEY }}
          SA_SYNCHRONIZER_SECRET_KEY: ${{ steps.gen-keys.outputs.SA_SYNCHRONIZER_SECRET_KEY }}
          SA_CLEANUP_SECRET_KEY: ${{ steps.gen-keys.outputs.SA_CLEANUP_SECRET_KEY }}
        run: |
          mkdir -p docker/services/secrets
          chmod 700 docker/services/secrets
          printf '%s' "${SA_EXT_API_SECRET_KEY}"     > docker/services/secrets/sa-ext-api.key
          printf '%s' "${SA_CALCULATOR_SECRET_KEY}"  > docker/services/secrets/sa-calculator.key
          printf '%s' "${SA_SYNCHRONIZER_SECRET_KEY}"> docker/services/secrets/sa-synchronizer.key
          printf '%s' "${SA_CLEANUP_SECRET_KEY}"    > docker/services/secrets/sa-cleanup.key
          chmod 0444 docker/services/secrets/*.key
          ls -la docker/services/secrets/

      # Write a transient .env for the minio-bootstrap service to consume.
      # Compose reads .env automatically; this avoids committing secrets.
      - name: Write .env.bootstrap for compose
        env:
          SA_EXT_API_SECRET_KEY: ${{ steps.gen-keys.outputs.SA_EXT_API_SECRET_KEY }}
          SA_CALCULATOR_SECRET_KEY: ${{ steps.gen-keys.outputs.SA_CALCULATOR_SECRET_KEY }}
          SA_SYNCHRONIZER_SECRET_KEY: ${{ steps.gen-keys.outputs.SA_SYNCHRONIZER_SECRET_KEY }}
          SA_CLEANUP_SECRET_KEY: ${{ steps.gen-keys.outputs.SA_CLEANUP_SECRET_KEY }}
        run: |
          cat > .env.bootstrap <<EOF
          MINIO_ENDPOINT=http://minio:9000
          MINIO_ROOT_USER=minioadmin
          MINIO_ROOT_PASSWORD=minioadmin
          SA_EXT_API_SECRET_KEY=${SA_EXT_API_SECRET_KEY}
          SA_CALCULATOR_SECRET_KEY=${SA_CALCULATOR_SECRET_KEY}
          SA_SYNCHRONIZER_SECRET_KEY=${SA_SYNCHRONIZER_SECRET_KEY}
          SA_CLEANUP_SECRET_KEY=${SA_CLEANUP_SECRET_KEY}
          EOF

      # maple-network is declared external in docker-compose.yml (shared
      # with the future maple-apps Coolify resource). Create it before
      # `docker compose up`, otherwise compose fails with
      # "network maple-network declared as external, but could not be found".
      - name: Create external maple-network
        run: |
          docker network inspect maple-network >/dev/null 2>&1 \
            || docker network create --subnet=172.20.0.0/16 maple-network >/dev/null

      - name: Bring up full stack
        run: |
          docker compose -f docker-compose.yml -f docker-compose.services.yml up -d
          echo "=== stack started, waiting for services ==="

      # Probe each service's /actuator/health with a 2-minute budget per
      # service. The first request to a Spring Boot app is slow (JIT, cache
      # warmup) so we retry on 503 until steady-state 200.
      - name: Wait for /actuator/health
        run: |
          set +e
          for port in 8081 8082 8083 8084; do
            echo "=== probing localhost:${port}/actuator/health ==="
            for i in $(seq 1 60); do
              code=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:${port}/actuator/health" || echo 000)
              if [ "$code" = "200" ]; then
                echo "  -> 200 after ${i}s"
                break
              fi
              sleep 2
            done
            if [ "$code" != "200" ]; then
              echo "ERROR: localhost:${port}/actuator/health did not return 200 (last code=${code})"
              docker compose -f docker-compose.yml -f docker-compose.services.yml ps
              docker compose -f docker-compose.yml -f docker-compose.services.yml logs --no-color --tail=100
              exit 1
            fi
          done

      - name: Tear down stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.services.yml down -v --remove-orphans || true

      - name: Clean .env.bootstrap + secret files
        if: always()
        run: |
          rm -f .env.bootstrap
          rm -f docker/services/secrets/sa-ext-api.key
          rm -f docker/services/secrets/sa-calculator.key
          rm -f docker/services/secrets/sa-synchronizer.key
          rm -f docker/services/secrets/sa-cleanup.key
          rmdir docker/services/secrets 2>/dev/null || true

  # ============================================
  # Build & Push Images to GHCR (ADR-732)
  # Runs only on pushes to develop (merges). Builds the 4 service images
  # via build.sh (local maple/<svc>:sha-<7>), re-tags and pushes them to
  # ghcr.io/zbnerd/maple-<svc>:{sha-<7>,latest}. PR builds are validated
  # by the docker-smoke job (which uses local :dev images), so this job
  # does not gate PRs.
  # ============================================
  build-and-push:
    name: Build & Push Images (GHCR)
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    env:
      GHCR_OWNER: zbnerd
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build service jars
        run: ./gradlew :module-external-api:bootJar :module-calculator:bootJar :module-synchronizer:bootJar :module-cleanup:bootJar -x test --no-daemon

      - name: Build service images (build.sh)
        run: ./docker/services/build.sh

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Tag & push images (sha + latest)
        run: |
          set -euo pipefail
          SHA7="$(git rev-parse --short=7 HEAD)"
          echo "Publishing sha-${SHA7} + latest for GHCR_OWNER=${GHCR_OWNER}"
          for mod in external-api calculator synchronizer cleanup; do
            docker tag "maple/${mod}:sha-${SHA7}" "ghcr.io/${GHCR_OWNER}/maple-${mod}:sha-${SHA7}"
            docker tag "maple/${mod}:sha-${SHA7}" "ghcr.io/${GHCR_OWNER}/maple-${mod}:latest"
            docker push "ghcr.io/${GHCR_OWNER}/maple-${mod}:sha-${SHA7}"
            docker push "ghcr.io/${GHCR_OWNER}/maple-${mod}:latest"
          done
