# =============================================================================
# MapleExpectation CI Pipeline
# =============================================================================
# SRE-Gatekeeper (Red Agent) Principles Applied:
#   - Resilience: Timeout guards on every step
#   - Observability: Test reports always uploaded (even on failure)
#   - Fail Fast: PR merge blocked on any test failure
#   - Backpressure: Resource limits on services
#
# Trigger: PR to master/develop, Push to develop
# =============================================================================

name: CI Pipeline

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "master", "develop" ]

permissions:
  contents: read
  checks: write           # Required for test report annotations
  pull-requests: write    # Required for PR comments

# Concurrency: Cancel in-progress runs for same PR (save resources)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '21'  # #262: Virtual Thread 지원을 위해 21로 업그레이드
  GRADLE_OPTS: '-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true'

jobs:
  # ==========================================================================
  # JOB 1: Build & Test (Gate)
  # ==========================================================================
  test:
    name: Build & Test (Unit Only)
    runs-on: ubuntu-latest
    timeout-minutes: 10  # Unit tests only - 10분이면 충분

    # V5 Migration (Issue #589, #590, #591): No external services needed
    # PostgreSQL is provided via Testcontainers

    steps:
      # ------------------------------------------------------------------
      # Step 1: Checkout
      # ------------------------------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for accurate diff

      # ------------------------------------------------------------------
      # Step 2: Setup Java 21
      # ------------------------------------------------------------------
      - name: Setup JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      # ------------------------------------------------------------------
      # Step 3: Setup Gradle
      # ------------------------------------------------------------------
      # Temporarily disable Gradle build cache to ensure clean rebuild
      - name: Setup Gradle
        run: echo "GRADLE_OPTS=-Dorg.gradle.caching=false" >> $GITHUB_ENV

      # ------------------------------------------------------------------
      # Step 4: Grant Execute Permission
      # ------------------------------------------------------------------
      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      # ------------------------------------------------------------------
      # Step 4.5: Apply Code Formatting (Spotless)
      # ------------------------------------------------------------------
      # CI에서 자동으로 포맷 적용 - 포맷 위반으로 인한 실패 방지
      - name: Apply Spotless Formatting
        run: ./gradlew spotlessApply --no-daemon

      # ------------------------------------------------------------------
      # Step 5: Run Tests (Gate - Must Pass)
      # ------------------------------------------------------------------
      # PR/Push: -PfastTest (slow, sentinel, quarantine, nightmare, flaky 제외 → 3-5분)
      # Nightly: 전체 테스트 (별도 워크플로우)
      - name: Run Tests
        id: test
        run: |
          echo "🚀 Running fast tests (CI Gate)"
          ./gradlew clean test -PfastTest --no-daemon --stacktrace
        env:
          SPRING_PROFILES_ACTIVE: test
        continue-on-error: false  # CRITICAL: Block merge on failure

      # ------------------------------------------------------------------
      # Step 6: Upload Test Reports (Always - Even on Failure)
      # ------------------------------------------------------------------
      - name: Upload Test Reports
        if: always()  # Upload even if tests fail
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/reports/tests/
            build/test-results/
          retention-days: 7

      # ------------------------------------------------------------------
      # Step 6.1: Upload Flaky Logs (Issue #210)
      # ------------------------------------------------------------------
      - name: Upload Flaky Logs
        if: always()  # 실패해도 업로드 (P0)
        uses: actions/upload-artifact@v4
        with:
          name: flaky-logs-${{ github.run_id }}
          path: build/flaky/
          retention-days: 30
          if-no-files-found: ignore

      # ------------------------------------------------------------------
      # Step 7: Publish Test Results (PR Annotations)
      # Step 7 REMOVED: dorny/test-reporter 삭제 - XML 리포트 경로 문제로 PR annotation 불필요
      # ------------------------------------------------------------------

      # ------------------------------------------------------------------
      # Step 8: Build JAR (Only if tests pass)
      # ------------------------------------------------------------------
      - name: Build Application
        if: success()
        run: ./gradlew build -x test --no-daemon

      # ------------------------------------------------------------------
      # Step 9: Upload Build Artifact
      # ------------------------------------------------------------------
      - name: Upload Build Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: application-jar
          path: build/libs/*.jar
          retention-days: 1

  # ==========================================================================
  # JOB 2: Smoke Test with Locust (Disabled - CI 환경 설정 복잡도로 인해 비활성화)
  # ==========================================================================
  smoke-test:
    name: Smoke Test (Locust)
    runs-on: ubuntu-latest
    needs: test
    if: false  # Disabled: CI 환경에서 Application 시작 설정이 복잡함
    timeout-minutes: 10

    # V5 Migration (Issue #589, #590, #591): PostgreSQL via Testcontainers

    steps:
      # ------------------------------------------------------------------
      # Step 1: Checkout
      # ------------------------------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------------
      # Step 2: Setup Java
      # ------------------------------------------------------------------
      - name: Setup JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'

      # ------------------------------------------------------------------
      # Step 3: Download Build Artifact
      # ------------------------------------------------------------------
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: application-jar
          path: ./build/libs

      # ------------------------------------------------------------------
      # Step 4: Setup Python for Locust
      # ------------------------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'locust/requirements.txt'

      # ------------------------------------------------------------------
      # Step 5: Install Locust
      # ------------------------------------------------------------------
      - name: Install Locust
        run: pip install -r locust/requirements.txt

      # ------------------------------------------------------------------
      # Step 6: Start Application (Background)
      # ------------------------------------------------------------------
      - name: Start Application
        run: |
          echo "Starting Spring Boot application..."
          java -jar build/libs/*.jar \
            --spring.profiles.active=ci \
            --server.port=8080 \
            > app.log 2>&1 &

          # Wait for application to be ready (max 120 seconds)
          echo "Waiting for application to start..."
          for i in {1..60}; do
            if curl -s http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "Application is ready!"
              exit 0
            fi
            echo "Attempt $i/60 - waiting..."
            sleep 2
          done

          echo "Application failed to start within timeout"
          cat app.log
          exit 1
        env:
          SPRING_PROFILES_ACTIVE: ci
          NEXON_API_KEY: ${{ secrets.CI_NEXON_API_KEY }}
          JWT_SECRET: ${{ secrets.CI_JWT_SECRET }}
          FINGERPRINT_SECRET: ${{ secrets.CI_FINGERPRINT_SECRET }}
          DB_SCHEMA_NAME: ${{ secrets.CI_MYSQL_DATABASE }}
          DB_ROOT_PASSWORD: ${{ secrets.CI_MYSQL_ROOT_PASSWORD }}
          DISCORD_WEBHOOK_URL: ${{ secrets.CI_DISCORD_WEBHOOK_URL }}

      # ------------------------------------------------------------------
      # Step 7: Run Locust Smoke Test
      # ------------------------------------------------------------------
      - name: Run Locust Smoke Test
        id: locust
        run: |
          echo "Running Locust smoke test (20 users, 30 seconds)..."
          locust -f locust/locustfile.py \
            --host http://localhost:8080 \
            --users 20 \
            --spawn-rate 5 \
            --run-time 30s \
            --headless \
            --tags v3 \
            --csv locust_results \
            --html locust_report.html \
            --only-summary

          # Check for failures
          FAILURES=$(tail -1 locust_results_stats.csv | cut -d',' -f4)
          echo "Total failures: $FAILURES"

          if [ "$FAILURES" != "0" ] && [ -n "$FAILURES" ]; then
            echo "::error::Locust smoke test detected $FAILURES failures"
            exit 1
          fi

          echo "Smoke test passed with 0 failures"

      # ------------------------------------------------------------------
      # Step 8: Upload Locust Report
      # ------------------------------------------------------------------
      - name: Upload Locust Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: locust-report
          path: |
            locust_results_*.csv
            locust_report.html
          retention-days: 7

      # ------------------------------------------------------------------
      # Step 9: Display Application Logs on Failure
      # ------------------------------------------------------------------
      - name: Display Application Logs
        if: failure()
        run: |
          echo "=== Application Logs ==="
          cat app.log || echo "No logs available"

  # ==========================================================================
  # JOB 3: Security Scan (Optional - SAST)
  # ==========================================================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request'
    timeout-minutes: 10
    continue-on-error: true  # Non-blocking for now

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'

      # Dependency vulnerability check
      - name: Dependency Check
        run: |
          ./gradlew dependencies --configuration runtimeClasspath > dependencies.txt
          echo "Dependencies exported for review"

      - name: Upload Dependency Report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-report
          path: dependencies.txt
          retention-days: 7
