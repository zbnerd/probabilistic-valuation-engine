name: Java CI/CD with Gradle

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

# SRE: Cancel in-progress runs for same PR (save resources)
concurrency:
  group: gradle-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ==========================================
  # 🔨 JOB 1: 빌드 및 테스트 (CI)
  # ==========================================
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10  # Unit tests only - 10분이면 충분

    # V5 Migration (Issue #589, #590, #591): PostgreSQL via Testcontainers

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21  # #262: Virtual Thread 지원
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # PR/Push: -PfastTest (slow, nightmare 제외 → 3-5분)
      # Nightly: 전체 테스트 (별도 워크플로우)
      - name: Test with Gradle
        run: |
          echo "🚀 Running fast tests (CI Gate)"
          ./gradlew test -PfastTest --stacktrace

      - name: Build JAR
        run: ./gradlew clean :module-app:bootJar -x test

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: maple-app
          path: module-app/build/libs/*.jar
          retention-days: 1

  # ==========================================
  # 🚀 JOB 2: 서버 배포 (CD)
  # ==========================================
  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10  # SRE: Prevent zombie deploy jobs

    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: maple-app
          path: ./build-artifact

      # -----------------------------------------------------------
      # [추가] 1. 기존 프로세스 강제 종료 (포트 점유 해제)
      # 파일을 복사하기 전에 실행 중인 프로세스를 죽여야 "Text file busy"를 피할 수 있습니다.
      # -----------------------------------------------------------
      - name: Stop Existing Process
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            echo "Stopping existing process on port 8080..."
            # 8080 포트를 사용하는 프로세스를 찾아 종료 (없어도 에러내지 않음)
            sudo fuser -k -n tcp 8080 || true
            sleep 2

      # 2. 파일 전송 (이제 파일이 사용 중이 아니므로 안전하게 덮어씁니다)
      - name: Copy JAR to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "./build-artifact/*.jar"
          target: "/home/${{ secrets.EC2_USERNAME }}"
          strip_components: 1

      # 3. 배포 스크립트 실행 (새로운 프로세스 시작)
      - name: Execute Deploy Script
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            # 환경변수 주입
            export DB_USER="${{ secrets.DB_USER }}"
            export DB_PASSWORD="${{ secrets.DB_PASSWORD }}"
            export JWT_SECRET="${{ secrets.JWT_SECRET }}"
            export FINGERPRINT_SECRET="${{ secrets.FINGERPRINT_SECRET }}"
            export NEXON_API_KEY="${{ secrets.NEXON_API_KEY }}"
            export DISCORD_WEBHOOK_URL="${{ secrets.DISCORD_WEBHOOK_URL }}"
            export CORS_ALLOWED_ORIGINS="${{ secrets.CORS_ALLOWED_ORIGINS }}"

            # 실행 권한 부여 및 스크립트 실행
            chmod +x /home/${{ secrets.EC2_USERNAME }}/deploy.sh
            /home/${{ secrets.EC2_USERNAME }}/deploy.sh