// ========================================
// MapleExpectation Multi-Module Root Project
// ADR-014/ADR-017: Gradle 멀티모듈 구조
// ========================================

plugins {
	id 'java'
	alias(libs.plugins.kotlin.jvm)
	alias(libs.plugins.kotlin.spring) apply false
	alias(libs.plugins.kotlin.jpa) apply false
	alias(libs.plugins.dependency.management)
	id 'jacoco'
	alias(libs.plugins.test.retry)
	alias(libs.plugins.spotbugs)
	alias(libs.plugins.spotless)
	id 'idea'
}

group = 'maple'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

// All projects: 공통 설정
allprojects {
	apply plugin: 'java'
	apply plugin: 'org.jetbrains.kotlin.jvm'
	apply plugin: 'io.spring.dependency-management'
	apply plugin: 'com.diffplug.spotless'

	group = 'maple'
	version = '0.0.1-SNAPSHOT'

	repositories {
		mavenCentral()
	}

	dependencyManagement {
	    imports {
	        mavenBom "org.springframework.boot:spring-boot-dependencies:${libs.versions.spring.boot.get()}"
	        mavenBom "io.github.resilience4j:resilience4j-bom:${libs.versions.resilience4j.get()}"
	        mavenBom "org.testcontainers:testcontainers-bom:${libs.versions.testcontainers.get()}"
	        mavenBom "software.amazon.awssdk:bom:${libs.versions.aws.sdk.get()}"
	    }
	}

	spotless {
		java {
			googleJavaFormat()
			formatAnnotations()
			importOrder()
			removeUnusedImports()
			trimTrailingWhitespace()
			endWithNewline()
		}
		kotlin {
			ktlint('1.5.0')
				.editorConfigOverride([
					'ktlint_code_style'                   : 'intellij_idea',
					'indent_size'                         : '4',
					'continuation_indent_size'            : '4',
					'insert_final_newline'                : 'true',
					// Disable rules that conflict with existing code style
					'ktlint_standard_annotation'          : 'disable',
					'ktlint_standard_filename'            : 'disable',
					'ktlint_standard_max-line-length'     : 'disable',
					// Disable no-wildcard-imports to allow JPA annotations
					'ktlint_standard_no-wildcard-imports' : 'disabled',
					// Disable property-naming to allow SCREAMING_SNAKE_CASE constants
					'ktlint_standard_property-naming'     : 'disabled',
					// Disable value-parameter-comment to allow inline comments
					'ktlint_standard_value-parameter-comment': 'disabled',
				])
			trimTrailingWhitespace()
			endWithNewline()
			// Exclude files that don't conform to ktlint rules
			targetExclude(
				'**/package-info.kt',
				// Cube decorator files with ktlint processing issues
				'**/BlackCubeDecorator.kt',
				'**/RedCubeDecorator.kt',
				'**/AdditionalCubeDecorator.kt',
				'**/BlackCubeDecoratorV4.kt',
				'**/RedCubeDecoratorV4.kt',
				'**/AdditionalCubeDecoratorV4.kt'
			)
		}
	}
}

// Subprojects: 모듈별 공통 설정
subprojects {
	apply plugin: 'jacoco'
	apply plugin: 'org.gradle.test-retry'

	java {
		toolchain {
			languageVersion = JavaLanguageVersion.of(21)
		}
	}

	// Kotlin compilation must run before Java compilation
	tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
		kotlinOptions {
			jvmTarget = "21"
			freeCompilerArgs += ["-Xjsr305=strict"]
		}
	}

	// Ensure Java compilation depends on Kotlin compilation
	tasks.named('compileJava').configure {
		dependsOn(tasks.named('compileKotlin'))
	}

	// Show ALL compilation errors at once (not just first 100)
	tasks.withType(JavaCompile).configureEach {
		options.compilerArgs += ['-Xmaxerrs', '1000', '-Xmaxwarns', '1000', '-parameters']
		options.fork = true
		options.forkOptions.jvmArgs += ['-Xmx2g']
	}

	// 공통 의존성
	dependencies {
		compileOnly(libs.lombok)
		annotationProcessor(libs.lombok)
		testCompileOnly(libs.lombok)
		testAnnotationProcessor(libs.lombok)

		testImplementation(libs.spring.boot.starter.test) {
			exclude group: 'org.junit.vintage', module: 'junit-vintage-engine'
		}

		testImplementation(libs.testcontainers)
		testImplementation(libs.testcontainers.junit.jupiter)
		testRuntimeOnly(libs.junit.platform.launcher)

		// ArchUnit
		testImplementation(libs.archunit)

		// Awaitility
		testImplementation(libs.awaitility)
	}

	// 테스트 설정
	boolean isCiServer = System.getenv().containsKey("CI")
	boolean isArtifactEvidence = project.hasProperty('artifactEvidence')

	test {
		jvmArgs = isArtifactEvidence ? [
			'-Xms1g',
			'-Xmx1g',
			'-XX:+UseG1GC',
			'-XX:MaxMetaspaceSize=512m'
		] : [
			'-Xms512m',
			'-Xmx2048m',
			'-XX:+UseG1GC',
			'-XX:MaxMetaspaceSize=512m'
		]

		// 테스트 실행 시간 표시 (시작/종료 후 출력)
		beforeTest { desc ->
			def className = desc.className.split('\\.').last()
			println "[START] ${className} > ${desc.name}"
		}
		afterTest { desc, result ->
			def duration = result.endTime - result.startTime
			def className = desc.className.split('\\.').last()
			println "[Test] ${className} > ${desc.name} : ${result.resultType} (${duration}ms)"
		}

		useJUnitPlatform {
			if (project.hasProperty('fastTest')) {
				excludeTags 'sentinel', 'slow', 'quarantine', 'chaos', 'nightmare', 'integration', 'flaky', 'smoke', 'pgmq', 'architecture'
			} else if (project.hasProperty('integrationTest')) {
				includeTags 'integration'
			} else if (project.hasProperty('chaosTest')) {
				includeTags 'chaos'
			} else if (project.hasProperty('nightmareTest')) {
				includeTags 'nightmare'
			} else {
				excludeTags 'sentinel', 'quarantine', 'flaky', 'integration', 'pgmq'
			}
		}

		// JUnit 5 @Tag는 상속되지 않으므로, 통합 테스트 base class를 상속한
		// 테스트를 태그 필터만으로 제외할 수 없음. 패키지 기반 필터로 보완.
		if (project.hasProperty('fastTest')) {
			filter {
				excludeTestsMatching 'maple.expectation.integration.*'
				excludeTestsMatching 'maple.expectation.smoke.*'
				excludeTestsMatching 'maple.expectation.testinfra.*'
				excludeTestsMatching 'maple.expectation.test.*'
			}
		}

		retry {
			if (isCiServer) {
				maxRetries = 1
				maxFailures = 5
				failOnPassedAfterRetry = false
			}
		}

		systemProperty 'flaky.logging.enabled', 'true'
		systemProperty 'flaky.log.dir', "${buildDir}/flaky"

		maxParallelForks = 1
		environment "DOCKER_HOST", "unix:///var/run/docker.sock"

		finalizedBy jacocoTestReport

		testLogging {
			events "passed", "skipped", "failed"
			exceptionFormat "full"
		}

		reports {
			junitXml.required = true
			html.required = true
		}
	}

	jacoco {
		toolVersion = libs.versions.jacoco.get()
	}

	jacocoTestReport {
		dependsOn test
		reports {
			xml.required = true
			html.required = true
		}
	}
}

// SpotBugs (루트 프로젝트에서만)
spotbugs {
	ignoreFailures = false
	showStackTraces = true
}

spotbugsMain {
	enabled = false
}

spotbugsTest {
	enabled = false
}

/* VSCode Lombok fix: ensure annotation processing available in all subprojects */
subprojects {
    plugins.withId('java') {
        dependencies {
            compileOnly(libs.lombok)
            annotationProcessor(libs.lombok)
            testCompileOnly(libs.lombok)
            testAnnotationProcessor(libs.lombok)
        }
    }
}

// ========================================
// Load Testing Tasks
// K6 performance testing scenarios
// ========================================

// Create results directory for load test outputs
tasks.register('createResultsDir') {
    doLast {
        def resultsDir = file('load-test/results')
        if (!resultsDir.exists()) {
            resultsDir.mkdirs()
        }
    }
}

// Main load test task with configurable scenario
tasks.register('loadTest', Exec) {
    group = 'verification'
    description = 'Run K6 load test with specified scenario (default: patch-day)'

    workingDir project.rootDir
    def resultsDir = file('load-test/results')

    dependsOn 'createResultsDir'

    def scenario = project.findProperty('scenario') ?: 'patch-day'

    environment 'SCENARIO', scenario
    commandLine 'k6', 'run', 'load-test/k6/main.js'

    doFirst {
        if (!file('load-test/k6/main.js').exists()) {
            throw new GradleException('K6 test file not found: load-test/k6/main.js')
        }
    }
}

// Generate comparison report between two test runs
tasks.register('loadTestReport', Exec) {
    group = 'verification'
    description = 'Generate comparison report from two test result files'

    workingDir project.rootDir

    def beforeFile = project.findProperty('beforeFile')
    def afterFile = project.findProperty('afterFile')

    doFirst {
        if (!beforeFile || !afterFile) {
            throw new GradleException('Both beforeFile and afterFile properties are required. Usage: ./gradlew loadTestReport -PbeforeFile=<path> -PafterFile=<path>')
        }
        if (!file(beforeFile).exists()) {
            throw new GradleException("Before file not found: ${beforeFile}")
        }
        if (!file(afterFile).exists()) {
            throw new GradleException("After file not found: ${afterFile}")
        }
    }

    commandLine './load-test/scripts/generate-report.sh', beforeFile, afterFile
}

// Quick smoke test for CI validation
tasks.register('loadTestQuick', Exec) {
    group = 'verification'
    description = 'Quick load test validation (30s, 10 VUs for CI smoke testing)'

    workingDir project.rootDir

    dependsOn 'createResultsDir'

    environment 'DURATION', '30s'
    environment 'VUS', '10'
    environment 'SCENARIO', 'quick'

    commandLine 'k6', 'run', 'load-test/k6/main.js'

    doFirst {
        if (!file('load-test/k6/main.js').exists()) {
            throw new GradleException('K6 test file not found: load-test/k6/main.js')
        }
    }
}

def activeEtlProjectPaths = [
	':module-external-api',
	':module-calculator',
	':module-synchronizer',
	':module-cleanup',
]

tasks.register('verifyActiveEtlInfraIsolation') {
	group = 'verification'
	description = 'Rejects module-infra source and runtime dependencies in active ETL workers.'

	doLast {
		def violations = []
		activeEtlProjectPaths.each { projectPath ->
			def worker = project(projectPath)
			worker.fileTree('src/main') {
				include '**/*.kt', '**/*.java'
			}.each { source ->
				if (source.getText('UTF-8').contains('maple.expectation.infrastructure')) {
					violations << "${projectPath}:source:${worker.relativePath(source)}"
				}
			}

			worker.configurations.runtimeClasspath.incoming.resolutionResult.allComponents.each { component ->
				def id = component.id
				if (id instanceof org.gradle.api.artifacts.component.ProjectComponentIdentifier &&
					id.projectPath == ':module-infra') {
					violations << "${projectPath}:runtimeClasspath:${component.id.displayName}"
				}
			}
		}

		if (!violations.isEmpty()) {
			throw new GradleException("Active ETL module-infra isolation violations:\n" + violations.sort().join('\n'))
		}
	}
}

tasks.named('check') {
	dependsOn(tasks.named('verifyActiveEtlInfraIsolation'))
}
