version: '3.8'

services:
  airflow-db:
    image: postgres:17-alpine
    container_name: maple-airflow-db
    # Disable parallel query: airflow-db is metadata-only (tiny tables) and
    # postgres parallel workers leak here (orphaned live workers spin ~700%
    # CPU, recur after restart, not in pg_stat_activity). max_parallel_workers=0
    # prevents spawns → leak source removed. Survives container/volume recreate
    # (ALTER SYSTEM in postgresql.auto.conf does not). See project_airflow_db_parallel_leak.
    command: >
      postgres
      -c max_parallel_workers=0
      -c max_parallel_workers_per_gather=0
    labels:
      autoheal: "true"
    restart: always
    # No host publish: airflow reaches airflow-db:5432 on the maple-network
    # bridge (ADR-744). Operator via `docker exec maple-airflow-db psql ...`.
    environment:
      POSTGRES_USER: airflow
      # No weak default: if AIRFLOW_DB_PASSWORD is unset, startup fails loudly
      # rather than silently using the brute-forceable "airflow" default.
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:?AIRFLOW_DB_PASSWORD required}
      POSTGRES_DB: airflow
    volumes:
      - airflow_db_data:/var/lib/postgresql/data
    networks:
      - maple-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  airflow-webserver:
    image: apache/airflow:2.10.5-python3.12
    container_name: maple-airflow-webserver
    labels:
      autoheal: "true"
    restart: unless-stopped
    # On the maple-network bridge: reaches airflow-db/kafka/modules by service
    # name. UI bound to 127.0.0.1 for operator SSH-tunnel access (ADR-744).
    networks:
      - maple-network
    ports:
      - "127.0.0.1:8180:8180"
    user: "0:0"
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@airflow-db:5432/airflow
      AIRFLOW__WEBSERVER__WEB_SERVER_PORT: "8180"
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: 'false'
      AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: "30"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
    volumes:
      - ./docker/airflow/dags:/opt/airflow/dags:ro
    command: webserver
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8180/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      airflow-db:
        condition: service_healthy

  airflow-scheduler:
    image: apache/airflow:2.10.5-python3.12
    container_name: maple-airflow-scheduler
    labels:
      autoheal: "true"
    restart: unless-stopped
    # On the maple-network bridge: reaches airflow-db/kafka/modules by service
    # name (ADR-744).
    networks:
      - maple-network
    user: "0:0"
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@airflow-db:5432/airflow
      AIRFLOW__WEBSERVER__WEB_SERVER_PORT: "8180"
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: 'false'
      AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: "30"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
    volumes:
      - ./docker/airflow/dags:/opt/airflow/dags:ro
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname $$(hostname -f)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    depends_on:
      airflow-db:
        condition: service_healthy

networks:
  maple-network:
    external: true
    name: probabilistic-valuation-engine_maple-network

volumes:
  airflow_db_data:
