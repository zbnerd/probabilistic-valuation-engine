# docker-compose.services.yml
# Overlay for the 4 Spring Boot services. Use with docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.services.yml up -d
#
# Configuration sources (single source of truth):
#   - MinIO SA secret: docker/services/secrets/sa-<module>.key, mounted at
#     /run/secrets/sa-<module>. StorageConfig reads it directly via
#     MINIO_SECRET_KEY_FILE — no env var, no env_file.
#   - DB_URL: container-internal JDBC URL below. Set in environment: so the
#     nohup path (which sources .env's DB_URL=localhost URL) stays decoupled.
#   - NEXON_API_KEY: interpolated from operator's root .env at compose time.
#     Required only by external-api.
#   - KAFKA_BOOTSTRAP_SERVERS / SPRING_PROFILES_ACTIVE: compose-internal.

services:
  external-api:
    image: ${IMAGE_EXTERNAL_API:-maple/external-api:dev}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:$${SERVER_PORT}/actuator/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    labels:
      autoheal: "true"
    container_name: maple-external-api
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "10"
    # No host publish: prometheus + airflow reach external-api:8081 on the
    # maple-network bridge (ADR-744).
    environment:
      JAVA_OPTS: "-Xms512m -Xmx2g"
      SERVER_PORT: 8081
      DB_URL: "jdbc:postgresql://postgres:5432/maple_expectation?user=maple&password=${DB_ROOT_PASSWORD}"
      NEXON_API_KEY: ${NEXON_API_KEY}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_PROFILES_ACTIVE: local
      MINIO_ENDPOINT: http://minio:9000
      MINIO_BUCKET: ${MINIO_BUCKET:-maple-expectation}
      MINIO_REGION: us-east-1
      STORAGE_BACKEND: minio
      MINIO_ACCESS_KEY: ext-api
      MINIO_SECRET_KEY_FILE: /run/secrets/sa-ext-api
    secrets:
      - sa-ext-api
    networks: [maple-network]
    depends_on:
      minio:    {condition: service_healthy}
      postgres: {condition: service_healthy}
      kafka:    {condition: service_started}

  calculator:
    image: ${IMAGE_CALCULATOR:-maple/calculator:dev}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:$${SERVER_PORT}/actuator/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    labels:
      autoheal: "true"
    container_name: maple-calculator
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "10"
    # No host publish: prometheus + airflow reach calculator:8082 (ADR-744).
    environment:
      JAVA_OPTS: "-Xms512m -Xmx1g"
      SERVER_PORT: 8082
      DB_URL: "jdbc:postgresql://postgres:5432/maple_expectation?user=maple&password=${DB_ROOT_PASSWORD}"
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_PROFILES_ACTIVE: local
      MINIO_ENDPOINT: http://minio:9000
      MINIO_BUCKET: ${MINIO_BUCKET:-maple-expectation}
      MINIO_REGION: us-east-1
      STORAGE_BACKEND: minio
      MINIO_ACCESS_KEY: calculator
      MINIO_SECRET_KEY_FILE: /run/secrets/sa-calculator
    secrets:
      - sa-calculator
    networks: [maple-network]
    depends_on:
      postgres: {condition: service_healthy}
      kafka:    {condition: service_started}
      minio:    {condition: service_healthy}

  synchronizer:
    image: ${IMAGE_SYNCHRONIZER:-maple/synchronizer:dev}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:$${SERVER_PORT}/actuator/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    labels:
      autoheal: "true"
    container_name: maple-synchronizer
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "10"
    # No host publish: prometheus + airflow reach synchronizer:8083 (ADR-744).
    environment:
      JAVA_OPTS: "-Xms512m -Xmx1g"
      SERVER_PORT: 8083
      DB_URL: "jdbc:postgresql://postgres:5432/maple_expectation?user=maple&password=${DB_ROOT_PASSWORD}"
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_PROFILES_ACTIVE: local
      MINIO_ENDPOINT: http://minio:9000
      MINIO_BUCKET: ${MINIO_BUCKET:-maple-expectation}
      MINIO_REGION: us-east-1
      STORAGE_BACKEND: minio
      MINIO_ACCESS_KEY: synchronizer
      MINIO_SECRET_KEY_FILE: /run/secrets/sa-synchronizer
      REDIS_HOST: redis
      REDIS_PORT: 6379
    secrets:
      - sa-synchronizer
    networks: [maple-network]
    depends_on:
      postgres: {condition: service_healthy}
      kafka:    {condition: service_started}
      minio:    {condition: service_healthy}
      redis:    {condition: service_started}

  cleanup:
    image: ${IMAGE_CLEANUP:-maple/cleanup:dev}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:$${SERVER_PORT}/actuator/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    labels:
      autoheal: "true"
    container_name: maple-cleanup
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "10"
    # No host publish: prometheus + airflow reach cleanup:8084 (ADR-744).
    environment:
      JAVA_OPTS: "-Xms512m -Xmx1g"
      SERVER_PORT: 8084
      DB_URL: "jdbc:postgresql://postgres:5432/maple_expectation?user=maple&password=${DB_ROOT_PASSWORD}"
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_PROFILES_ACTIVE: local
      MINIO_ENDPOINT: http://minio:9000
      MINIO_BUCKET: ${MINIO_BUCKET:-maple-expectation}
      MINIO_REGION: us-east-1
      STORAGE_BACKEND: minio
      MINIO_ACCESS_KEY: cleanup
      MINIO_SECRET_KEY_FILE: /run/secrets/sa-cleanup
    secrets:
      - sa-cleanup
    networks: [maple-network]
    depends_on:
      minio:       {condition: service_healthy}
      postgres:    {condition: service_started}
      kafka:       {condition: service_started}
      synchronizer: {condition: service_started}

secrets:
  sa-ext-api:
    file: ${SECRETS_DIR_HOST:-docker/services/secrets}/sa-ext-api.key
  sa-calculator:
    file: ${SECRETS_DIR_HOST:-docker/services/secrets}/sa-calculator.key
  sa-synchronizer:
    file: ${SECRETS_DIR_HOST:-docker/services/secrets}/sa-synchronizer.key
  sa-cleanup:
    file: ${SECRETS_DIR_HOST:-docker/services/secrets}/sa-cleanup.key