version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: maple-mysql
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_SCHEMA_NAME}
      TZ: ${TZ}
    command:
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
    volumes:
      - ./mysql_data:/var/lib/mysql
      - ./docker/mysql/conf.d:/etc/mysql/conf.d:ro
      - ./docker/logs/mysql:/var/log/mysql
    networks:
      - maple-network

  # Redis HA: Master Node
  redis-master:
    image: redis:7.0
    container_name: redis-master
    restart: always
    ports:
      - "6379:6379"
    command: >
      redis-server
      --save 60 1
      --loglevel warning
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - ./redis_data/master:/data
    networks:
      maple-network:
        ipv4_address: 172.20.0.10
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 30

  # Redis HA: Slave Node
  redis-slave:
    image: redis:7.0
    container_name: redis-slave
    restart: always
    ports:
      - "6380:6379"
    command: >
      redis-server
      --slaveof redis-master 6379
      --save 60 1
      --loglevel warning
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - ./redis_data/slave:/data
    networks:
      maple-network:
        aliases:
          - redis-slave
    depends_on:
      redis-master:
        condition: service_healthy

  # Redis Sentinel 1 (Quorum 2/3)
  redis-sentinel-1:
    image: redis:7.0
    container_name: maple-sentinel-1
    restart: always
    ports:
      - "26379:26379"
    command: redis-sentinel /etc/redis/sentinel.conf
    volumes:
      - ./sentinel/sentinel-1.conf:/etc/redis/sentinel.conf
    networks:
      - maple-network
    depends_on:
      redis-master:
        condition: service_healthy
      redis-slave:
        condition: service_started

  # Redis Sentinel 2 (Quorum 2/3)
  redis-sentinel-2:
    image: redis:7.0
    container_name: maple-sentinel-2
    restart: always
    ports:
      - "26380:26379"
    command: redis-sentinel /etc/redis/sentinel.conf
    volumes:
      - ./sentinel/sentinel-2.conf:/etc/redis/sentinel.conf
    networks:
      - maple-network
    depends_on:
      redis-master:
        condition: service_healthy
      redis-slave:
        condition: service_started

  # Redis Sentinel 3 (Quorum 2/3)
  redis-sentinel-3:
    image: redis:7.0
    container_name: maple-sentinel-3
    restart: always
    ports:
      - "26381:26379"
    command: redis-sentinel /etc/redis/sentinel.conf
    volumes:
      - ./sentinel/sentinel-3.conf:/etc/redis/sentinel.conf
    networks:
      - maple-network
    depends_on:
      redis-master:
        condition: service_healthy
      redis-slave:
        condition: service_started

  # Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: maple-prometheus
    restart: always
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - maple-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # MongoDB for V5 CQRS Read Side
  mongodb:
    image: mongo:7.0
    container_name: maple-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: maple_expectation
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - maple-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PostgreSQL + PGMQ (Replacing MySQL + MongoDB + Redis Queue)
  postgres:
    image: postgres:16
    container_name: maple-postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: maple
      POSTGRES_PASSWORD: ${DB_ROOT_PASSWORD}
      POSTGRES_DB: maple_expectation
      TZ: ${TZ}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - maple-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maple -d maple_expectation"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: maple-grafana
    restart: always
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - maple-network
    depends_on:
      - prometheus

networks:
  maple-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  mysql_data:
  redis_data:
  mongodb_data:
  mongodb_config:
  prometheus_data:
  grafana_data:
  postgres_data: