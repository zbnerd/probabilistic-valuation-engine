version: '3.8'

services:
  # Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:latest
    labels:
      autoheal: "true"
    container_name: maple-prometheus
    restart: always
    # On the maple-network bridge: scrapes modules by service name
    # (external-api:8081, cadvisor:8080, …). UI bound to 127.0.0.1 for operator
    # SSH-tunnel access — not internet-facing. See ADR-744.
    networks:
      - maple-network
    ports:
      - "127.0.0.1:9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # cAdvisor — per-container metrics for restart-rate alerting (ADR-733).
  # Exposes container_start_time_seconds (a gauge that jumps on each restart);
  # prometheus evaluates ContainerRestartThrashing via changes() on it.
  # Host port 8086 (container internal 8080) to avoid app-port conflicts.
  # No healthcheck (observability infra; crash recovery = restart:always).
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: maple-cadvisor
    restart: always
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg
    # No host publish: prometheus scrapes cadvisor:8080 on the bridge (ADR-744).
    labels:
      logging: "promtail"
    networks:
      - maple-network

  # PostgreSQL + PGMQ (Primary Database - Issue #589, #590, #591)
  # Replaced: MySQL, MongoDB, Redis Queue
  postgres:
    image: jumski/postgres-17-pgmq:latest
    labels:
      autoheal: "true"
    container_name: maple-postgres
    restart: always
    # No host publish: app modules reach postgres:5432 on the bridge (ADR-744).
    # Operator psql via `docker exec maple-postgres psql -U maple ...`.
    environment:
      POSTGRES_USER: maple
      POSTGRES_PASSWORD: ${DB_ROOT_PASSWORD}
      POSTGRES_DB: maple_expectation
      TZ: ${TZ}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - maple-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maple -d maple_expectation"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    labels:
      autoheal: "true"
    container_name: maple-grafana
    restart: always
    # Operator UI: 127.0.0.1 only (SSH tunnel), not internet-facing (ADR-744).
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - maple-network
    depends_on:
      - prometheus
      - loki
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Kafka (Message Queue)
  kafka:
    image: confluentinc/cp-kafka:7.7.0
    # autoheal disabled: kafka's cold boot (KRaft election + creating 50
    # __consumer_offsets partitions) exceeds the healthcheck start_period, and
    # autoheal's `docker restart` (SIGTERM → controlled shutdown) kept killing it
    # before it stabilized. Re-enable once cold-boot time is bounded (ADR-744).
    container_name: maple-kafka
    restart: always
    # HOST listener (advertised localhost:9092) bound to loopback only — not
    # internet-facing. Bridge consumers use kafka:29092.
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,HOST://localhost:9092
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,HOST://0.0.0.0:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # CLUSTER_ID (un-prefixed) is what the confluent entrypoint reads for
      # `kafka-storage format --cluster-id=$CLUSTER_ID`. The old KAFKA_CLUSTER_ID
      # (prefixed) never populated it → empty cluster id on cold boot → broker
      # self-initiated controlled shutdown ~30s after start. Pre-existing bug
      # exposed by the ADR-744 cold restart. Valid base64 KRaft uuid.
      CLUSTER_ID: LWHgQhf5RlGm9OYjHzHkxQ
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Retention settings to prevent disk fill
      KAFKA_LOG_RETENTION_HOURS: 48
      KAFKA_LOG_RETENTION_BYTES: 5368709120   # 5GB
      KAFKA_LOG_SEGMENT_BYTES: 1073741824     # 1GB segments
      KAFKA_LOG_CLEANUP_POLICY: delete
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - maple-network
    depends_on:
      - postgres
    healthcheck:
      # TCP-port probe via bash /dev/tcp — `kafka-broker-api-versions` consistently
      # exceeds 10s timeout on this box (verified 2026-07-03, 13 consecutive
      # timeouts while kafka was actually serving). Port-accept = listener up.
      test: ["CMD-SHELL", "timeout 3 bash -c '</dev/tcp/localhost/9092' >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  # Redis (Cache)
  redis:
    image: redis:7-alpine
    labels:
      autoheal: "true"
    container_name: maple-redis
    restart: always
    # No host publish: synchronizer reaches redis:6379 on the bridge (ADR-744).
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - maple-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  # Loki — log storage (single-binary, filesystem backend)
  loki:
    image: grafana/loki:2.9.0
    labels:
      autoheal: "true"
    container_name: maple-loki
    restart: always
    # No host publish: grafana reaches loki:3100 on the bridge (ADR-744).
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./docker/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki
    networks:
      - maple-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3100/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Promtail — log shipper, tail module logs → push to Loki
  promtail:
    image: grafana/promtail:2.9.0
    labels:
      autoheal: "true"
    container_name: maple-promtail
    restart: always
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./docker/promtail/config.yml:/etc/promtail/config.yml:ro
      - .:/var/log/app:ro
      - ./data:/var/log/data:ro
      # Docker socket for docker_sd_configs container-stdout discovery (ADR-733).
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - maple-network
    depends_on:
      loki:
        condition: service_healthy
    healthcheck:
      # promtail image (Debian) ships no wget/curl/nc; bash /dev/tcp probes
      # the readiness port directly. CMD-SHELL uses dash (no /dev/tcp), so
      # invoke bash explicitly.
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/9080' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # MinIO object storage (V1 / issue #1216)
  minio:
    image: minio/minio:latest
    labels:
      autoheal: "true"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    networks:
      - maple-network
    # S3 API (9000) is bridge-only: app modules use minio:9000 (ADR-744).
    # Console (9001) bound to 127.0.0.1 for operator SSH-tunnel access.
    ports:
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s

  # autoheal — watches Docker health_status events and restarts any
  # container carrying the `autoheal=true` label that goes unhealthy.
  # Closes the soft-failure gap (process alive, /health DOWN) that the
  # restart: always policy and Coolify Sentinel cannot cover. See ADR-731.
  autoheal:
    image: willfarrell/autoheal:latest
    container_name: maple-autoheal
    restart: always
    labels:
      logging: "promtail"
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: 5
      AUTOHEAL_DEFAULT_STOP_TIMEOUT: 30
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      # autoheal can't restart itself (excluded from its own label), but a
      # socket-presence probe surfaces its liveness in the Coolify UI. Crash
      # recovery is restart: always.
      test: ["CMD-SHELL", "ls /var/run/docker.sock >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - maple-network

  minio-bootstrap:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - maple-network
    env_file:
      - .env.bootstrap
    environment:
      # Override .env.bootstrap MINIO_ENDPOINT for in-container DNS.
      # .env.bootstrap keeps localhost:9000 so host-side tooling works.
      MINIO_ENDPOINT: http://minio:9000
      # SA key output path (ADR-732). Coolify sets this to /opt/maple/secrets;
      # local dev leaves it unset → bootstrap defaults to /workspace/docker/services/secrets.
      SECRETS_DIR: ${SECRETS_DIR:-/workspace/docker/services/secrets}
    volumes:
      - ./docker/minio:/scripts:ro
      # /workspace = repo root (local dev). bootstrap's REPO_ROOT fallback
      # and host-side tooling read SA keys here when SECRETS_DIR is unset.
      - ./:/workspace:rw
      # SA secrets output dir (ADR-732). When SECRETS_DIR_HOST is set
      # (Coolify: /opt/maple/secrets), mount that host path read-write so
      # bootstrap writes keys there and the maple-apps resource reads them.
      # Local dev: defaults to the repo dir under the /workspace mount above
      # (redundant but harmless bind).
      - ${SECRETS_DIR_HOST:-./docker/services/secrets}:${SECRETS_DIR:-/workspace/docker/services/secrets}:rw
    entrypoint: /bin/sh /scripts/bootstrap.sh
    restart: "no"

networks:
  maple-network:
    # External so both the maple-infra and the future maple-apps Coolify
    # resources share it. Created once before first deploy:
    #   docker network create --subnet=172.20.0.0/16 maple-network
    external: true
    name: maple-network

volumes:
  prometheus_data:
  grafana_data:
  minio_data:
  postgres_data:
  kafka_data:
  redis_data:
  loki_data:
