version: '3.8'

services:
  # Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:latest
    labels:
      autoheal: "true"
    container_name: maple-prometheus
    restart: always
    # network_mode: host — prometheus reaches Spring Boot modules on the
    # host via `localhost:PORT`. Without this, the container's localhost
    # resolves to the container itself (no services on 8081/8082/8083/8084)
    # and `host-gateway` resolves to the docker0 bridge IP which doesn't
    # route host-bound ports. Same pattern as maple-airflow-* in
    # docker-compose.airflow.yml. Verified 2026-06-19.
    network_mode: host
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # PostgreSQL + PGMQ (Primary Database - Issue #589, #590, #591)
  # Replaced: MySQL, MongoDB, Redis Queue
  postgres:
    image: jumski/postgres-17-pgmq:latest
    labels:
      autoheal: "true"
    container_name: maple-postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: maple
      POSTGRES_PASSWORD: ${DB_ROOT_PASSWORD}
      POSTGRES_DB: maple_expectation
      TZ: ${TZ}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - maple-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maple -d maple_expectation"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    labels:
      autoheal: "true"
    container_name: maple-grafana
    restart: always
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - maple-network
    depends_on:
      - prometheus
      - loki
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Kafka (Message Queue)
  kafka:
    image: confluentinc/cp-kafka:latest
    labels:
      autoheal: "true"
    container_name: maple-kafka
    restart: always
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,HOST://localhost:9092
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,HOST://0.0.0.0:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CLUSTER_ID: maple-kafka-cluster
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Retention settings to prevent disk fill
      KAFKA_LOG_RETENTION_HOURS: 48
      KAFKA_LOG_RETENTION_BYTES: 5368709120   # 5GB
      KAFKA_LOG_SEGMENT_BYTES: 1073741824     # 1GB segments
      KAFKA_LOG_CLEANUP_POLICY: delete
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - maple-network
    depends_on:
      - postgres
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Redis (Cache)
  redis:
    image: redis:7-alpine
    labels:
      autoheal: "true"
    container_name: maple-redis
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - maple-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  # Loki — log storage (single-binary, filesystem backend)
  loki:
    image: grafana/loki:2.9.0
    labels:
      autoheal: "true"
    container_name: maple-loki
    restart: always
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./docker/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki
    networks:
      - maple-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3100/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Promtail — log shipper, tail module logs → push to Loki
  promtail:
    image: grafana/promtail:2.9.0
    labels:
      autoheal: "true"
    container_name: maple-promtail
    restart: always
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./docker/promtail/config.yml:/etc/promtail/config.yml:ro
      - .:/var/log/app:ro
      - ./data:/var/log/data:ro
    networks:
      - maple-network
    depends_on:
      loki:
        condition: service_healthy
    healthcheck:
      # promtail image (Debian) ships no wget/curl/nc; bash /dev/tcp probes
      # the readiness port directly. CMD-SHELL uses dash (no /dev/tcp), so
      # invoke bash explicitly.
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/9080' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # MinIO object storage (V1 / issue #1216)
  minio:
    image: minio/minio:latest
    labels:
      autoheal: "true"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    networks:
      - maple-network
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s

  # autoheal — watches Docker health_status events and restarts any
  # container carrying the `autoheal=true` label that goes unhealthy.
  # Closes the soft-failure gap (process alive, /health DOWN) that the
  # restart: always policy and Coolify Sentinel cannot cover. See ADR-731.
  autoheal:
    image: willfarrell/autoheal:latest
    container_name: maple-autoheal
    restart: always
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: 5
      AUTOHEAL_DEFAULT_STOP_TIMEOUT: 30
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      # autoheal can't restart itself (excluded from its own label), but a
      # socket-presence probe surfaces its liveness in the Coolify UI. Crash
      # recovery is restart: always.
      test: ["CMD-SHELL", "ls /var/run/docker.sock >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - maple-network

  minio-bootstrap:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - maple-network
    env_file:
      - .env.bootstrap
    environment:
      # Override .env.bootstrap MINIO_ENDPOINT for in-container DNS.
      # .env.bootstrap keeps localhost:9000 so host-side tooling works.
      MINIO_ENDPOINT: http://minio:9000
    volumes:
      - ./docker/minio:/scripts:ro
      # /workspace = repo root, writable so bootstrap.sh can persist SA secrets
      # to docker/services/secrets/ and .env.<module>. See plan task 8.
      - ./:/workspace:rw
    entrypoint: /bin/sh /scripts/bootstrap.sh
    restart: "no"

networks:
  maple-network:
    # External so both the maple-infra and the future maple-apps Coolify
    # resources share it. Created once before first deploy:
    #   docker network create --subnet=172.20.0.0/16 maple-network
    external: true
    name: maple-network

volumes:
  prometheus_data:
  grafana_data:
  minio_data:
  postgres_data:
  kafka_data:
  redis_data:
  loki_data:
