global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'maple-expectation'

rule_files:
  - "rules/alert_rules.yml"
  - "rules/lock-alerts.yml"
  - "rules/load-test-rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

scrape_configs:
  # ============================================
  # Spring Boot Modules
  # ============================================
  - job_name: 'external-api'
    scrape_interval: 5s
    scrape_timeout: 3s
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['external-api:8081']
        labels:
          application: 'external-api'
      - targets: ['host.docker.internal:8081']
        labels:
          application: 'external-api'

  - job_name: 'calculator'
    scrape_interval: 5s
    scrape_timeout: 3s
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['calculator:8082']
        labels:
          application: 'calculator'
      - targets: ['host.docker.internal:8082']
        labels:
          application: 'calculator'

  - job_name: 'synchronizer'
    scrape_interval: 5s
    scrape_timeout: 3s
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['synchronizer:8083']
        labels:
          application: 'synchronizer'
      - targets: ['host.docker.internal:8083']
        labels:
          application: 'synchronizer'

  - job_name: 'rest-controller'
    scrape_interval: 5s
    scrape_timeout: 3s
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['rest-controller:8084']
        labels:
          application: 'rest-controller'
      - targets: ['host.docker.internal:8084']
        labels:
          application: 'rest-controller'

  # ============================================
  # Node Exporter - System Metrics
  # ============================================
  - job_name: 'node-exporter'
    scrape_interval: 15s
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          component: 'system'
