global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'maple-expectation'

rule_files:
  - "rules/alert_rules.yml"
  - "rules/lock-alerts.yml"
  - "rules/load-test-rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

scrape_configs:
  # ============================================
  # Spring Boot Modules — reached by service name on the maple-network bridge
  # (prometheus is bridge-attached; modules are containers in
  # docker-compose.services.yml). See ADR-744.
  # ============================================
  - job_name: 'external-api'
    scrape_interval: 5s
    scrape_timeout: 3s
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['external-api:8081']
        labels:
          application: 'external-api'

  - job_name: 'calculator'
    scrape_interval: 5s
    scrape_timeout: 3s
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['calculator:8082']
        labels:
          application: 'calculator'

  - job_name: 'synchronizer'
    scrape_interval: 5s
    scrape_timeout: 3s
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['synchronizer:8083']
        labels:
          application: 'synchronizer'

  - job_name: 'cleanup'
    scrape_interval: 5s
    scrape_timeout: 3s
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['cleanup:8084']
        labels:
          application: 'cleanup'

  # ============================================
  # Node Exporter - System Metrics (runs in Docker, resolves via maple-network)
  # ============================================
  - job_name: 'node-exporter'
    scrape_interval: 15s
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          component: 'system'

  # ============================================
  # cAdvisor - per-container metrics (restart-rate alerting, ADR-733)
  # Reached by service name on the bridge (prometheus bridge-attached, ADR-744).
  # ============================================
  - job_name: 'cadvisor'
    scrape_interval: 15s
    scrape_timeout: 10s
    metrics_path: '/metrics'
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          component: 'containers'
