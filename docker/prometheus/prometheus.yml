global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'maple-expectation'

rule_files:
  - "rules/alert_rules.yml"
  - "rules/lock-alerts.yml"
  - "rules/load-test-rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

scrape_configs:
  # ============================================
  # Spring Boot Modules
  # Spring Boot modules run on the Docker host (not in containers), so we
  # reach them via `localhost:PORT`. The corresponding
  # `extra_hosts: localhost:host-gateway` mapping is set in
  # docker-compose.yml so Docker Linux resolves `localhost` to
  # the host's gateway IP. Verified 2026-06-19: bare `localhost` resolves
  # to the prometheus container itself, not the host, so all 5 module
  # targets were health=down until this fix.
  # ============================================
  - job_name: 'external-api'
    scrape_interval: 5s
    scrape_timeout: 3s
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['localhost:8081']
        labels:
          application: 'external-api'

  - job_name: 'calculator'
    scrape_interval: 5s
    scrape_timeout: 3s
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['localhost:8082']
        labels:
          application: 'calculator'

  - job_name: 'synchronizer'
    scrape_interval: 5s
    scrape_timeout: 3s
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['localhost:8083']
        labels:
          application: 'synchronizer'

  - job_name: 'cleanup'
    scrape_interval: 5s
    scrape_timeout: 3s
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['localhost:8084']
        labels:
          application: 'cleanup'

  # ============================================
  # Node Exporter - System Metrics (runs in Docker, resolves via maple-network)
  # ============================================
  - job_name: 'node-exporter'
    scrape_interval: 15s
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          component: 'system'

  # ============================================
  # cAdvisor - per-container metrics (restart-rate alerting, ADR-733)
  # Reached via the host port (prometheus uses network_mode: host).
  # ============================================
  - job_name: 'cadvisor'
    scrape_interval: 15s
    scrape_timeout: 10s
    metrics_path: '/metrics'
    static_configs:
      - targets: ['localhost:8086']
        labels:
          component: 'containers'
