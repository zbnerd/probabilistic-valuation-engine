groups:
  - name: maple-expectation-alerts
    interval: 15s
    rules:
      # ============================================
      # High CPU Usage Alert
      # ============================================
      - alert: HighCpuUsage
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 5m
        labels:
          severity: critical
          category: system
        annotations:
          summary: "High CPU usage on {{ $labels.instance }}"
          description: "CPU usage is at {{ $value }}% for more than 5 minutes"

      # ============================================
      # High Memory Usage Alert
      # ============================================
      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 90
        for: 5m
        labels:
          severity: critical
          category: system
        annotations:
          summary: "High memory usage on {{ $labels.instance }}"
          description: "Memory usage is at {{ $value }}% for more than 5 minutes"

      # ============================================
      # High Disk Usage Alert
      # ============================================
      - alert: HighDiskUsage
        expr: (1 - (node_filesystem_avail_bytes / node_filesystem_size_bytes)) * 100 > 90
        for: 5m
        labels:
          severity: warning
          category: system
        annotations:
          summary: "High disk usage on {{ $labels.instance }}"
          description: "Disk usage is at {{ $value }}% for more than 5 minutes"

      # ============================================
      # Application Error Rate Alert
      # ============================================
      - alert: HighErrorRate
        expr: rate(http_server_requests_seconds_count{status=~"5.."}[5m]) / rate(http_server_requests_seconds_count[5m]) * 100 > 5
        for: 2m
        labels:
          severity: critical
          category: application
        annotations:
          summary: "High error rate on {{ $labels.instance }}"
          description: "Error rate is {{ $value }}% for more than 2 minutes"

      # ============================================
      # High Response Time Alert
      # ============================================
      - alert: HighResponseTime
        expr: histogram_quantile(0.95, rate(http_server_requests_seconds_bucket[5m])) > 1
        for: 5m
        labels:
          severity: warning
          category: application
        annotations:
          summary: "High response time on {{ $labels.instance }}"
          description: "95th percentile response time is {{ $value }}s for more than 5 minutes"

      # ============================================
      # JVM Memory Alert
      # ============================================
      - alert: HighJvmMemoryUsage
        expr: (1 - (jvm_memory_used_bytes{jarea="heap"} / jvm_memory_max_bytes{jarea="heap"})) * 100 > 85
        for: 5m
        labels:
          severity: warning
          category: jvm
        annotations:
          summary: "High JVM memory usage on {{ $labels.instance }}"
          description: "JVM heap memory usage is {{ $value }}% for more than 5 minutes"

      # ============================================
      # Circuit Breaker Open Alert
      # ============================================
      - alert: CircuitBreakerOpen
        expr: resilience4j_circuitbreaker_state_total{state="open"} > 0
        for: 1m
        labels:
          severity: critical
          category: circuit-breaker
        annotations:
          summary: "Circuit breaker is open on {{ $labels.instance }}"
          description: "Circuit breaker {{ $labels.name }} is open for more than 1 minute"

      # ============================================
      # Database Connection Pool Alerts (ADR-088)
      # ============================================
      # Critical: Pool exhausted (> 90%)
      - alert: DatabaseConnectionPoolExhausted
        expr: hikaricp_connections_active / hikaricp_connections_max * 100 > 90
        for: 2m
        labels:
          severity: critical
          category: database
        annotations:
          summary: "Database connection pool exhausted on {{ $labels.instance }}"
          description: "Connection pool usage is {{ $value }}% for more than 2 minutes"

      # Warning: High utilization (> 70%)
      - alert: DatabaseConnectionPoolHighUtilization
        expr: hikaricp_connections_active / hikaricp_connections_max * 100 > 70
        for: 5m
        labels:
          severity: warning
          category: database
        annotations:
          summary: "Database connection pool high utilization on {{ $labels.instance }}"
          description: "Connection pool usage is {{ $value }}% for more than 5 minutes"

      # Critical: Connection timeouts
      - alert: DatabaseConnectionTimeout
        expr: rate(hikaricp_connections_timeout_total[5m]) > 0.1
        for: 1m
        labels:
          severity: critical
          category: database
        annotations:
          summary: "Database connection timeout on {{ $labels.instance }}"
          description: "Connection timeout rate is {{ $value }}/sec for more than 1 minute"

      # Warning: High pending threads (pool exhaustion imminent)
      - alert: DatabaseConnectionPoolPending
        expr: hikaricp_connections_pending > 10
        for: 1m
        labels:
          severity: warning
          category: database
        annotations:
          summary: "Database connection pool high pending on {{ $labels.instance }}"
          description: "{{ $value }} threads waiting for database connection"

      # Warning: High connection acquire time (> 100ms P99)
      - alert: DatabaseConnectionAcquireSlow
        expr: histogram_quantile(0.99, rate(hikaricp_connections_acquire_seconds_bucket[5m])) > 0.1
        for: 5m
        labels:
          severity: warning
          category: database
        annotations:
          summary: "Database connection acquire slow on {{ $labels.instance }}"
          description: "P99 connection acquire time is {{ $value }}s for more than 5 minutes"

      # Warning: Idle connections critically low (pool thrashing / connection leak detection)
      - alert: HikariCPIdleConnectionsLow
        expr: hikaricp_connections_idle < 2
        for: 5m
        labels:
          severity: warning
          category: database
        annotations:
          summary: "HikariCP idle connections critically low"
          description: "Only {{ $value }} idle connections in pool {{ $labels.pool }}"

      # ============================================
      # PostgreSQL Advisory Lock Alert (V5 Migration)
      # ============================================
      - alert: PostgresAdvisoryLockContention
        expr: rate(postgres_advisory_lock_wait_seconds_total[5m]) > 0.1
        for: 2m
        labels:
          severity: warning
          category: database
        annotations:
          summary: "PostgreSQL advisory lock contention on {{ $labels.instance }}"
          description: "Lock wait time is {{ $value }}s for more than 2 minutes"

      # ============================================
      # PGMQ Queue Depth Alert (V5 Migration)
      # ============================================
      - alert: PgmqQueueDepthHigh
        expr: pgmq_queue_depth{queue_name=~"calculation|donation"} > 1000
        for: 5m
        labels:
          severity: warning
          category: queue
        annotations:
          summary: "PGMQ queue depth high: {{ $labels.queue_name }}"
          description: "Queue depth is {{ $value }} messages for more than 5 minutes"

      # ============================================
      # Chaos Test Alert
      # ============================================
      - alert: ChaosTestFailure
        expr: chaos_test_failures_total > 10
        for: 1m
        labels:
          severity: warning
          category: chaos-test
        annotations:
          summary: "Chaos test failures on {{ $labels.instance }}"
          description: "Chaos test has {{ $value }} failures"

  - name: maple-expectation-business-alerts
    interval: 30s
    rules:
      # ============================================
      # Nexon API Error Rate Alert
      # ============================================
      - alert: NexonApiHighErrorRate
        expr: rate(nexon_api_requests_total{status=~"5.."}[5m]) / rate(nexon_api_requests_total[5m]) * 100 > 10
        for: 5m
        labels:
          severity: critical
          category: external-service
        annotations:
          summary: "High Nexon API error rate"
          description: "Nexon API error rate is {{ $value }}% for more than 5 minutes"

      # ============================================
      # Cache Hit Rate Alert
      # ============================================
      - alert: LowCacheHitRate
        expr: rate(maple_cache_hits_total[10m]) / (rate(maple_cache_hits_total[10m]) + rate(maple_cache_misses_total[10m])) * 100 < 70
        for: 10m
        labels:
          severity: warning
          category: cache
        annotations:
          summary: "Low cache hit rate"
          description: "Cache hit rate is {{ $value }}% for more than 10 minutes"

      # ============================================
      # Sync Queue Size Alert
      # ============================================
      - alert: LargeSyncQueue
        expr: maple_sync_queue_size > 1000
        for: 5m
        labels:
          severity: warning
          category: sync
        annotations:
          summary: "Large sync queue size"
          description: "Sync queue size is {{ $value }} for more than 5 minutes"

      # ============================================
      # Container Restart Thrashing (ADR-733)
      # cAdvisor's container_start_time_seconds jumps on each container
      # restart; changes() counts those jumps over the window.
      # ============================================
      - alert: ContainerRestartThrashing
        expr: changes(container_start_time_seconds{container!="",container!="POD"}[5m]) > 2
        for: 1m
        labels:
          severity: warning
          category: system
        annotations:
          summary: "Container {{ $labels.name }} is restarting repeatedly"
          description: "{{ $labels.name }} restarted {{ $value }} times in the last 5m"