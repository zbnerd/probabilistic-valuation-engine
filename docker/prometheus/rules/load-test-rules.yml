groups:
  - name: maple-expectation-load-test-alerts
    interval: 15s
    rules:
      # ============================================
      # Load Test P99 Latency Alert
      # ============================================
      - alert: LoadTestP99LatencyExceeded
        expr: histogram_quantile(0.99, rate(http_server_requests_seconds_bucket[1m])) > 0.2
        for: 1m
        labels:
          severity: critical
          category: load-test
        annotations:
          summary: "P99 latency exceeded during load test on {{ $labels.instance }}"
          description: "P99 latency is {{ $value }}s for more than 1 minute (threshold: 0.2s)"

      # ============================================
      # Load Test Error Rate Alert
      # ============================================
      - alert: LoadTestErrorRateHigh
        expr: rate(http_server_requests_seconds_count{status=~"5.."}[30s]) / rate(http_server_requests_seconds_count[30s]) * 100 > 1
        for: 30s
        labels:
          severity: critical
          category: load-test
        annotations:
          summary: "High error rate during load test on {{ $labels.instance }}"
          description: "Error rate is {{ $value }}% for more than 30 seconds (threshold: 1%)"

      # ============================================
      # Load Test Cache Hit Rate Alert
      # ============================================
      - alert: LoadTestCacheHitRateLow
        expr: rate(maple_cache_hits_total[2m]) / (rate(maple_cache_hits_total[2m]) + rate(maple_cache_misses_total[2m])) * 100 < 70
        for: 2m
        labels:
          severity: warning
          category: load-test
        annotations:
          summary: "Low cache hit rate during load test"
          description: "Cache hit rate is {{ $value }}% for more than 2 minutes (threshold: 70%)"

      # ============================================
      # Load Test Database Pool Exhausted Alert
      # ============================================
      - alert: LoadTestDBPoolExhausted
        expr: hikaricp_connections_active / hikaricp_connections_max * 100 > 90
        for: 1m
        labels:
          severity: critical
          category: load-test
        annotations:
          summary: "Database connection pool exhausted during load test on {{ $labels.instance }}"
          description: "Connection pool usage is {{ $value }}% for more than 1 minute (threshold: 90%)"

      # ============================================
      # Load Test High Memory Usage Alert
      # ============================================
      - alert: LoadTestHighMemoryUsage
        expr: (1 - (jvm_memory_used_bytes{jarea="heap"} / jvm_memory_max_bytes{jarea="heap"})) * 100 > 85
        for: 2m
        labels:
          severity: warning
          category: load-test
        annotations:
          summary: "High JVM memory usage during load test on {{ $labels.instance }}"
          description: "JVM heap memory usage is {{ $value }}% for more than 2 minutes (threshold: 85%)"
