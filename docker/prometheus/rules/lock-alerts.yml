# P0 Issues Resolution - Lock Health Alert Rules
# Related: #221 (N02), #227 (N07), #228 (N09)
# 5-Agent Council Approved: 2026-01-20
# V5 Migration (Issue #589, #590, #591): PostgreSQL-only mode

groups:
  - name: lock-health
    rules:
      # ============================================
      # N09: Lock Order Violation Detection
      # ============================================
      - alert: LockOrderViolationDetected
        expr: rate(lock_order_violation_total[5m]) > 0
        for: 1m
        labels:
          severity: warning
          team: backend
          nightmare: N09
        annotations:
          summary: "Lock ordering violation detected - potential deadlock risk"
          description: "Lock order violation rate: {{ $value }}/s. Check application logs for details."

      # ============================================
      # N02/N09: Distributed Lock Failure
      # ============================================
      - alert: DistributedLockFailureHigh
        expr: rate(lock_acquisition_total{status="failed"}[5m]) > 10
        for: 2m
        labels:
          severity: warning
          team: backend
          nightmare: N02
        annotations:
          summary: "Distributed lock acquisition failure rate increasing"
          description: "Lock failure rate: {{ $value }}/s. Check PostgreSQL connectivity."

      # ============================================
      # PostgreSQL Lock Wait
      # ============================================
      - alert: PostgreSQLLockWaitHigh
        expr: pg_locks_waiting > 10
        for: 2m
        labels:
          severity: warning
          team: dba
        annotations:
          summary: "PostgreSQL lock wait count increasing"
          description: "Locks waiting: {{ $value }}. Check for long-running transactions."

      # ============================================
      # Lock Pool Exhaustion Risk
      # ============================================
      - alert: LockPoolExhaustionRisk
        expr: hikaricp_connections_active{pool="PostgresLockPool"} / hikaricp_connections_max{pool="PostgresLockPool"} > 0.8
        for: 2m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "PostgreSQL Lock Pool nearing exhaustion (>80%)"
          description: "Active connections: {{ $value * 100 }}%. Consider scaling lock pool or investigating lock contention."

      # ============================================
      # Lock Held Too Long
      # ============================================
      - alert: LockHeldTooLong
        expr: lock_held_current > 0 and (time() - lock_held_start_time) > 30
        for: 1m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "Lock held for more than 30 seconds"
          description: "A lock has been held for over 30 seconds. This may indicate a hung thread or deadlock."

  - name: circuit-breaker
    rules:
      # ============================================
      # Circuit Breaker State Monitoring
      # ============================================
      - alert: CircuitBreakerOpen
        expr: resilience4j_circuitbreaker_state{name="postgresLock", state="open"} == 1
        for: 1m
        labels:
          severity: critical
          team: sre
        annotations:
          summary: "PostgreSQL Lock Circuit Breaker is OPEN"
          description: "Circuit breaker for PostgreSQL lock is open. Check database health."

      - alert: CircuitBreakerHalfOpen
        expr: resilience4j_circuitbreaker_state{name="postgresLock", state="half_open"} == 1
        for: 5m
        labels:
          severity: warning
          team: sre
        annotations:
          summary: "PostgreSQL Lock Circuit Breaker stuck in HALF_OPEN"
          description: "Circuit breaker has been in half-open state for 5+ minutes. Investigate PostgreSQL recovery."
