// ========================================
// Module-App: Spring Boot 실행, Controller, Config
// ADR-017: Application Layer
// ========================================

plugins {
	alias(libs.plugins.kotlin.jvm)
	alias(libs.plugins.kotlin.spring)
	alias(libs.plugins.kotlin.jpa)
	alias(libs.plugins.spring.boot)
}

// Integration Test Source Set Configuration
sourceSets {
	integrationTest {
		java.srcDir file('src/integrationTest/java')
		resources.srcDir file('src/integrationTest/resources')
		compileClasspath += sourceSets.main.output + configurations.testRuntimeClasspath
		runtimeClasspath += output + compileClasspath
	}
}

configurations {
	integrationTestImplementation.extendsFrom testImplementation
	integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
	integrationTestAnnotationProcessor.extendsFrom testAnnotationProcessor
}

// IntelliJ IDEA Integration
idea {
	module {
		testSourceDirs += sourceSets.integrationTest.java.srcDirs
		testResourceDirs += sourceSets.integrationTest.resources.srcDirs
	}
}

dependencies {
	// Kotlin stdlib (required for Kotlin + Java mixed compilation)
	implementation(libs.kotlin.stdlib)
	implementation(libs.kotlin.reflect)

	// Lombok for main and test sources
	compileOnly(libs.lombok)
	annotationProcessor(libs.lombok)
	testCompileOnly(libs.lombok)
	testAnnotationProcessor(libs.lombok)

	// Lombok for integration tests
	integrationTestCompileOnly(libs.lombok)
	integrationTestAnnotationProcessor(libs.lombok)

	implementation project(':module-core')
	implementation project(':module-infra')
	implementation project(':module-common')
	implementation project(':module-web')

	// Spring Web
	implementation(libs.spring.boot.starter.web)
	implementation(libs.spring.boot.starter.webflux)
	implementation(libs.spring.boot.starter.validation)
	implementation(libs.spring.boot.starter.thymeleaf)

	// Spring Security
	implementation(libs.spring.boot.starter.security)
	testImplementation(libs.spring.security.test)

	// JWT
	implementation(libs.jjwt.api)
	runtimeOnly(libs.jjwt.impl)
	runtimeOnly(libs.jjwt.jackson)

	// Actuator & Observability
	implementation(libs.spring.boot.starter.actuator)
	implementation(libs.micrometer.observation)
	implementation(libs.micrometer.registry.prometheus)
	implementation(libs.micrometer.tracing.bridge.otel)
	implementation(libs.opentelemetry.exporter.otlp)
	implementation(libs.opentelemetry.samplers)

	// SpringDoc OpenAPI
	implementation(libs.springdoc.openapi.starter.webmvc.ui)

	// Loki Appender
	implementation(libs.loki.logback.appender)

	// AI SRE (LangChain4j)
	implementation(libs.langchain4j.spring.boot.starter)
	implementation(libs.langchain4j.open.ai.spring.boot.starter)

	// Spring Batch
	implementation(libs.spring.boot.starter.batch)

	// Cache
	implementation(libs.spring.boot.starter.cache)
	implementation(libs.caffeine)

	// Spring Data JPA
	implementation(libs.spring.boot.starter.data.jpa)
	runtimeOnly(libs.postgresql)
	runtimeOnly(libs.h2)

	// Resilience4j
	implementation(libs.resilience4j.spring.boot3)

	// Guava
	implementation(libs.guava)

	// Bucket4j
	implementation(libs.bucket4j.core)

	// Jackson CSV
	implementation(libs.jackson.dataformat.csv)

	// Env
	implementation(libs.spring.dotenv)

	testImplementation(libs.spring.boot.starter.test)
	testImplementation("org.springframework.boot:spring-boot-testcontainers")

	// DevTools for hot reload during development
	developmentOnly("org.springframework.boot:spring-boot-devtools")
	testImplementation(libs.testcontainers)
	testImplementation(libs.testcontainers.junit.jupiter)
	testImplementation(libs.testcontainers.postgresql)
	testImplementation(libs.testcontainers.toxiproxy)
	testImplementation(libs.mockito.core)
	testImplementation(libs.mockito.junit.jupiter)

	// Jackson Kotlin module for testing Kotlin data classes deserialization
	testImplementation(libs.jackson.module.kotlin)
}

// Enable plain jar for inter-module dependencies (chaos-test module needs it)
// bootJar remains for execution
tasks.named("jar") {
	enabled = true
	archiveClassifier = "plain"  // Plain jar without dependencies (don't override bootJar)
}

bootRun {
	jvmArgs = [
		'-Xms1g',
		'-Xmx2g',
		'-XX:+UseG1GC',
		'-Dspring.devtools.restart.enabled=true',
		"-Dspring.profiles.active=${project.findProperty('springProfile') ?: 'local'}"
	]
}

// test-legacy는 빌드에서 제외
tasks.named('test') {
	exclude '**/test-legacy/**'
	// Integration tests run separately via 'integrationTest' task
	// Infra-verification tests run separately via 'testInfraVerification' task
	useJUnitPlatform {
		excludeTags 'integration', 'infra-verification'
	}
}

// Integration Test Task - uses test source set (Issue #563)
tasks.register('integrationTest', Test) {
	description = 'Runs integration tests (Testcontainers, PostgreSQL).'
	group = 'verification'

	// Use test source set instead of integrationTest source set
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath

	shouldRunAfter tasks.test

	// JUnit configuration for integration tests
	useJUnitPlatform {
		includeTags 'integration'
	}

	// Exclude tests using old H2 profile (not yet migrated to pgtest)
	// These tests use @ActiveProfiles("test") with H2 database
	exclude '**/test/service/**'
	exclude '**/test/usecase/**'
	exclude '**/alert/**'
	exclude '**/infrastructure/jdbc/JdbcBatchUpsertRepositoryIntegrationTest.class'
	exclude '**/service/v4/EquipmentExpectationServiceV4SingleflightTest.class'
	exclude '**/ExpectationApplicationTests.class' // Context sanity check - not a real integration test
	// CharacterEquipment tests blocked by pre-existing bugs:
	// - JPA @Lob + BYTEA incompatibility with PostgreSQL
	// - JDBC uses MySQL ON DUPLICATE KEY syntax
	exclude '**/integration/repository/CharacterEquipmentRepositoryIntegrationTest.class'
	// LikeSyncWorker requires PGMQ extension which is not available in test container
	exclude '**/integration/worker/LikeSyncWorkerIntegrationTest.class'

	// JVM settings for integration tests
	jvmArgs = [
		'-Xms512m',
		'-Xmx2048m',
		'-XX:+UseG1GC',
		'-XX:MaxMetaspaceSize=512m'
	]

	// Docker socket for Testcontainers - environment variable AND system property
	environment "DOCKER_HOST", "unix:///var/run/docker.sock"
	systemProperty "DOCKER_HOST", "unix:///var/run/docker.sock"

	// Disable Ryuk container for simpler setup (optional, remove if needed)
	environment "TESTCONTAINERS_RYUK_DISABLED", "true"

	// Testcontainers reuse for faster tests
	systemProperty "testcontainers.reuse.enable", "true"

	// Test logging
	testLogging {
		events "passed", "skipped", "failed"
		exceptionFormat "full"
	}

	// Retry flaky tests
	retry {
		maxRetries = 1
		maxFailures = 5
		failOnPassedAfterRetry = false
	}

	// Execute tests sequentially to avoid connection pool exhaustion
	// Each test creates Spring context with 4 DB connections (main + lock pool)
	maxParallelForks = 1
	systemProperty 'junit.jupiter.execution.parallel.enabled', 'false'
}

// 통합 테스트 인프라 자체의 성능과 정확성 검증
tasks.register('testInfraVerification', Test) {
	group = 'verification'
	description = '통합 테스트 인프라 자체의 성능과 정확성 검증'

	useJUnitPlatform {
		includeTags 'infra-verification'
	}

	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath

	// Docker socket for Testcontainers
	environment "DOCKER_HOST", "unix:///var/run/docker.sock"
	systemProperty "DOCKER_HOST", "unix:///var/run/docker.sock"
	systemProperty "testcontainers.reuse.enable", "true"

	testLogging {
		events "passed", "skipped", "failed"
		exceptionFormat "full"
	}
}

// Fix duplicate resources issue
tasks.withType(ProcessResources).configureEach {
	duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

// Ensure Java compilation depends on Kotlin compilation (Kotlin-Java interop)
tasks.named('compileJava') {
	dependsOn tasks.named('compileKotlin')
	options.annotationProcessorPath = configurations.annotationProcessor
}

// Lombok annotation processor for integration tests
// Note: integrationTestAnnotationProcessor extends testAnnotationProcessor, so Lombok is included
tasks.named('compileIntegrationTestJava') {
	options.annotationProcessorPath = configurations.integrationTestAnnotationProcessor
}

// allOpen configuration for JPA entities (required for proxy generation)
allOpen {
	annotation('jakarta.persistence.Entity')
	annotation('jakarta.persistence.MappedSuperclass')
	annotation('jakarta.persistence.Embeddable')
}
