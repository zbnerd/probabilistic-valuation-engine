# ========================================
# Chaos Test Profile Configuration
# ========================================
spring:
  config:
    activate:
      on-profile: chaos

  # Disable MySQL-specific connection init SQL for H2
  datasource:
    connection-init-sql: null

  # P2-24: N+1 Query Prevention for Chaos Testing
  jpa:
    open-in-view: false  # 명시적 비활성화 - 트랜잭션 경계 외부에서 지연 로딩 방지, N+1 쿼리 감지
    properties:
      hibernate:
        default_batch_fetch_size: 100
        jdbc:
          batch_size: 100
        order_inserts: true
        order_updates: true
