spring:
  config:
    activate:
      on-profile: ci

  datasource:
    url: ${DB_URL}
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: 200  # P2 Unit 7: Match default Tomcat threads (200)
      minimum-idle: 10
      # P2 Unit 5: Connection leak detection - log warning if connection held > 60s
      leak-detection-threshold: 60000
      # P2 Unit 7: JMX monitoring for HikariCP metrics
      register-mbeans: true

  jpa:
    open-in-view: false  # P2-24: 명시적 비활성화 - 트랜잭션 경계 외부에서 지연 로딩 방지, N+1 쿼리 감지
    hibernate:
      ddl-auto: create-drop  # CI에서는 매번 새로 생성
    properties:
      hibernate:
        default_batch_fetch_size: 100
        jdbc:
          batch_size: 100
        order_inserts: true
        order_updates: true

  # Redis/MongoDB removed in Issue #589, #590

alert:
  discord:
    webhook-url: ${ALERT_DISCORD_WEBHOOK_URL:}

# DP 엔진 테이블 검증 설정
cube:
  table-mass:
    policy: LENIENT  # CI 환경: 확률 테이블 정규화 허용

# CORS 설정 (CI 환경)
cors:
  allowed-origins:
    - "http://localhost:8080"

# ADR-0345: Resilience4j Configuration for Stateless Alert System
resilience4j:
  circuitbreaker:
    instances:
      discordWebhook:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        minimumNumberOfCalls: 5
        registerHealthIndicator: true
  retry:
    instances:
      discordWebhook:
        maxAttempts: 3
        waitDuration: 500ms
        exponentialBackoffMultiplier: 2.0
        retryExceptions:
          - org.springframework.web.reactive.function.client.WebClientRequestException
          - io.netty.channel.ConnectTimeoutException
  timelimiter:
    instances:
      discordWebhook:
        timeoutDuration: 5s
