server:
  tomcat:
    threads:
      max: 100  # Match HikariCP local maximum-pool-size
    max-http-post-size: 2MB

spring:
  config:
    activate:
      on-profile: local

  datasource:
    # MySQL Configuration (Current/Default)
    url: jdbc:mysql://localhost:3306/maple_expectation?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&rewriteBatchedStatements=true
    username: root
    password: ${DB_ROOT_PASSWORD}

    # PostgreSQL Configuration (Alternative - for future migration)
    # To use PostgreSQL instead of MySQL, use profile: pglocal
    # url: jdbc:postgresql://localhost:5432/maple_expectation?serverTimezone=Asia/Seoul
    # username: maple
    # password: ${DB_ROOT_PASSWORD}
    # driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: 100
      minimum-idle: 50
      # P2 Unit 5: Connection leak detection - log warning if connection held > 60s
      leak-detection-threshold: 60000
      # P2 Unit 7: JMX monitoring for HikariCP metrics (connections, pending, latency)
      register-mbeans: true
      # [P0-N07 Fix] MDL Freeze 방지 - 로컬 환경도 동일 설정
      connection-init-sql: "SET SESSION lock_wait_timeout = 10"

  jpa:
    open-in-view: false  # P2-24: 명시적 비활성화 - 트랜잭션 경계 외부에서 지연 로딩 방지, N+1 쿼리 감지
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_batch_fetch_size: 100
        jdbc:
          batch_size: 100
        order_inserts: true
        order_updates: true

  # Redis Standalone 설정 (Sentinel 장애 시 폴백)
  data:
    redis:
      host: localhost
      port: 6379
      # Redisson 기본 설정 사용 (커스텀 설정 제거 - 오버헤드 테스트)

  # Auth configuration
  auth:
    jwt:
      secret: ${JWT_SECRET}
      expiration: 900
    refresh-token:
      expiration: 604800
    fingerprint:
      secret: ${FINGERPRINT_SECRET}
    admin:
      allowlist: ${ADMIN_FINGERPRINTS:}
    session:
      ttl: 1800

  # Discord Alert Configuration
  alert:
    discord:
      webhook-url: ${ALERT_DISCORD_WEBHOOK_URL:}

# MongoDB Configuration (V5 CQRS)
# P1-10: Eventual Consistency Settings
# Local: Single node - use primary for consistency
spring:
  data:
    mongodb:
      host: localhost
      port: 27017
      database: maple_expectation_v5
      auto-index-creation: true
      # P1-10: Read Preference - primary for local dev (single node)
      # read-preference: primary
      # P1-10: Read Concern - local for low latency (single node)
      # read-concern: local
      # Connection pool settings for optimal performance
      # connect-timeout: 10000
      # socket-timeout: 30000
      # max-connection-per-host: 50
      # max-connection-idle-time: 60000
      # max-connection-life-time: 120000

# DP 엔진 테이블 검증 설정
cube:
  table-mass:
    policy: LENIENT  # 로컬 환경: 확률 테이블 정규화 허용 (Σp ≈ 1.0)

# Issue #555: Caffeine-only 캐시 모드 (로컬 개발용 예시)
# Redis 없이 Caffeine L1만 사용하려면 아래 설정 활성화
# cache:
#   l2:
#     enabled: false  # L2 비활성화 → Caffeine-only 모드

# Rate Limiting 비활성화 (부하 테스트용)
ratelimit:
  enabled: false

# CORS 설정 (Issue #172: 로컬 개발 환경)
cors:
  allowed-origins:
    - "http://localhost:3000"
    - "http://localhost:3001"
    - "http://localhost:5173"
    - "http://127.0.0.1:3000"
    - "http://127.0.0.1:3001"
    - "http://127.0.0.1:5173"

# Issue #283 P0-2: 로컬 환경에서만 In-Memory 버퍼 사용
# prod/default에서는 Redis 버퍼가 기본 활성화 (Scale-out 지원)
# Issue #300: ACL Phase 2 - Nexon Data Collection Scheduler
app:
  buffer:
    redis:
      enabled: true  # ACL Phase 2: Enable Redis buffer for queue
  event-publisher:
    type: redis  # Use Redis (default)
  aop:
    trace:
      enabled: true  # TraceAspect 활성화 (V5 로그 분석용)
  v5:
    worker-pool-size: 4
    shutdown-timeout-seconds: 30
    high-priority-worker-ratio: 0.5
    enabled: true
    query-side-enabled: true

# ACL Phase 2: Scheduler Configuration
scheduler:
  nexon-data-collection:
    enabled: false  # 로컬 개발에서 비활성화
    rate: 600000  # 10 minutes (default)
    initial-delay: 30000  # 30 seconds

# Disable other schedulers to prevent MySQLLockPool exhaustion during ACL testing
  like-sync:
    enabled: false
  expectation-sync:
    enabled: false
  popular-character-warmup:
    enabled: false

# Disable outbox schedulers to prevent connection pool exhaustion
outbox:
  scheduler:
    nexon-api-outbox:
      enabled: false

# Z.ai LangChain4j Configuration (Issue #251)
langchain4j:
  glm-4:
    chat-model:
      enabled: false  # 로컬 개발에서 비활성화
      base-url: https://api.z.ai/api/paas/v4
      model-name: glm-4.7
      timeout: 60s

# ADR-0345: Resilience4j Configuration for Stateless Alert System
resilience4j:
  circuitbreaker:
    instances:
      discordWebhook:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        minimumNumberOfCalls: 5
        registerHealthIndicator: true
  retry:
    instances:
      discordWebhook:
        maxAttempts: 3
        waitDuration: 500ms
        exponentialBackoffMultiplier: 2.0
        retryExceptions:
          - org.springframework.web.reactive.function.client.WebClientRequestException
          - io.netty.channel.ConnectTimeoutException
  timelimiter:
    instances:
      discordWebhook:
        timeoutDuration: 5s
