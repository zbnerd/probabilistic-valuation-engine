server:
  tomcat:
    threads:
      max: 100  # Match HikariCP local maximum-pool-size
    max-http-post-size: 2MB

spring:
  config:
    activate:
      on-profile: local

  datasource:
    # PostgreSQL Configuration (Issue #591: MySQL migration complete)
    url: jdbc:postgresql://localhost:5432/maple_expectation
    username: maple
    password: ${DB_ROOT_PASSWORD}
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: 100
      minimum-idle: 50
      # P2 Unit 5: Connection leak detection - log warning if connection held > 60s
      leak-detection-threshold: 60000
      # P2 Unit 7: JMX monitoring for HikariCP metrics (connections, pending, latency)
      register-mbeans: true
      # PostgreSQL: no lock_wait_timeout needed

  jpa:
    open-in-view: false  # P2-24: 명시적 비활성화 - 트랜잭션 경계 외부에서 지연 로딩 방지, N+1 쿼리 감지
    hibernate:
      ddl-auto: none  # Disable DDL auto-management for local dev
    properties:
      hibernate:
        default_batch_fetch_size: 100
        jdbc:
          batch_size: 100
        order_inserts: true
        order_updates: true

  # Redis/MongoDB removed in Issue #589, #590

  # Auth configuration
  auth:
    jwt:
      secret: ${JWT_SECRET}
      expiration: 900
    refresh-token:
      expiration: 604800
    fingerprint:
      secret: ${FINGERPRINT_SECRET}
    admin:
      allowlist: ${ADMIN_FINGERPRINTS:}
    session:
      ttl: 1800

  # Discord Alert Configuration
  alert:
    discord:
      webhook-url: ${ALERT_DISCORD_WEBHOOK_URL:}

# MongoDB Configuration (V5 CQRS) - REMOVED in Issue #590
# All V5 data now stored in PostgreSQL

# DP 엔진 테이블 검증 설정
cube:
  table-mass:
    policy: LENIENT  # 로컬 환경: 확률 테이블 정규화 허용 (Σp ≈ 1.0)

# Issue #555: Caffeine-only 캐시 모드 (로컬 개발용 예시)
# Redis 없이 Caffeine L1만 사용하려면 아래 설정 활성화
# cache:
#   l2:
#     enabled: false  # L2 비활성화 → Caffeine-only 모드

# Rate Limiting 비활성화 (부하 테스트용)
ratelimit:
  enabled: false

# CORS 설정 (Issue #172: 로컬 개발 환경)
cors:
  allowed-origins:
    - "http://localhost:3000"
    - "http://localhost:3001"
    - "http://localhost:5173"
    - "http://127.0.0.1:3000"
    - "http://127.0.0.1:3001"
    - "http://127.0.0.1:5173"

# Issue #283 P0-2: 로컬 환경 In-Memory 버퍼 사용
# V5 Migration (Issue #589): Redis buffer removed, use PostgreSQL
# Issue #300: ACL Phase 2 - Nexon Data Collection Scheduler
app:
  buffer:
    redis:
      enabled: false  # V5 Migration: Redis removed
    postgres:
      enabled: true   # PostgreSQL buffer
  event-publisher:
    type: pgmq  # Use PGMQ (PostgreSQL)
  aop:
    trace:
      enabled: true  # TraceAspect 활성화 (V5 로그 분석용)
  v5:
    worker-pool-size: 4
    shutdown-timeout-seconds: 30
    high-priority-worker-ratio: 0.5
    enabled: true
    query-side-enabled: true

# ACL Phase 2: Scheduler Configuration
scheduler:
  nexon-data-collection:
    enabled: false  # 로컬 개발에서 비활성화
    rate: 600000  # 10 minutes (default)
    initial-delay: 30000  # 30 seconds

# Disable other schedulers during local development
  like-sync:
    enabled: false
  expectation-sync:
    enabled: false
  popular-character-warmup:
    enabled: false

# Disable outbox schedulers to prevent connection pool exhaustion
outbox:
  scheduler:
    nexon-api-outbox:
      enabled: false

# Z.ai LangChain4j Configuration (Issue #251)
langchain4j:
  glm-4:
    chat-model:
      enabled: false  # 로컬 개발에서 비활성화
      base-url: https://api.z.ai/api/paas/v4
      model-name: glm-4.7
      timeout: 60s

# ADR-0345: Resilience4j Configuration for Stateless Alert System
resilience4j:
  circuitbreaker:
    instances:
      discordWebhook:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        minimumNumberOfCalls: 5
        registerHealthIndicator: true
  retry:
    instances:
      discordWebhook:
        maxAttempts: 3
        waitDuration: 500ms
        exponentialBackoffMultiplier: 2.0
        retryExceptions:
          - org.springframework.web.reactive.function.client.WebClientRequestException
          - io.netty.channel.ConnectTimeoutException
  timelimiter:
    instances:
      discordWebhook:
        timeoutDuration: 5s
