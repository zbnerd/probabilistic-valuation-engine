server:
  tomcat:
    threads:
      max: 100  # Match HikariCP local maximum-pool-size
    max-http-post-size: 2MB

spring:
  config:
    activate:
      on-profile: local

  datasource:
    url: ${DB_URL}
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: 15
      minimum-idle: 5
      # P2 Unit 5: Connection leak detection - log warning if connection held > 60s
      leak-detection-threshold: 60000
      # P2 Unit 7: JMX monitoring for HikariCP metrics (connections, pending, latency)
      register-mbeans: true
      # PostgreSQL: no lock_wait_timeout needed

  jpa:
    open-in-view: false  # P2-24: 명시적 비활성화 - 트랜잭션 경계 외부에서 지연 로딩 방지, N+1 쿼리 감지
    hibernate:
      ddl-auto: update  # Clean DB: let Hibernate create tables from JPA entities
    properties:
      hibernate:
        default_batch_fetch_size: 100
        jdbc:
          batch_size: 100
        order_inserts: true
        order_updates: true

  # Redis/MongoDB removed in Issue #589, #590

  # Auth configuration
  auth:
    jwt:
      secret: ${JWT_SECRET}
      expiration: 900
    refresh-token:
      expiration: 604800
    fingerprint:
      secret: ${FINGERPRINT_SECRET}
    admin:
      allowlist: ${ADMIN_FINGERPRINTS:}
    session:
      ttl: 1800

  # Discord Alert Configuration
  alert:
    discord:
      webhook-url: ${ALERT_DISCORD_WEBHOOK_URL:}

  # 🔥 P1 FIX #2: Reduced thread pool sizing to prevent context switching overhead
  # Recommendation: Set to availableProcessors * 2 for optimal performance
  task:
    execution:
      pool:
        core-size: 32       # 🔥 P1 FIX #2: Reduced from 200 (was causing excessive context switching)
        max-size: 64        # 🔥 P1 FIX #2: Reduced from 400 (2x core-size is typical)
        queue-capacity: 1000  # 🔥 P1 FIX #1: Reduced from 2000 to prevent timeout storm
      thread-name-prefix: "async-"

# MongoDB Configuration (V5 CQRS) - REMOVED in Issue #590
# All V5 data now stored in PostgreSQL

# DP 엔진 테이블 검증 설정
cube:
  table-mass:
    policy: LENIENT  # 로컬 환경: 확률 테이블 정규화 허용 (Σp ≈ 1.0)

# L2 캐시 비활성화 → Caffeine L1만 사용
cache:
  l2:
    enabled: false

# Supabase pooler 호환: Lock pool 축소
lock:
  datasource:
    pool-size: 20

# Rate Limiting 비활성화 (부하 테스트용)
ratelimit:
  enabled: false

nexon:
  api:
    equipment-cache-single-flight-enabled: false

# Retry Budget 비활성화 (Bulk Loading용)
# Issue #611: 300k 캐릭터 로딩 시 API 호출이 많아 예산 소진 방지
resilience:
  retry-budget:
    enabled: false  # Bulk Loading 시 재시도 예산 제한 해제

# CORS 설정 (Issue #172: 로컬 개발 환경)
cors:
  allowed-origins:
    - "http://localhost:3000"
    - "http://localhost:3001"
    - "http://localhost:5173"
    - "http://127.0.0.1:3000"
    - "http://127.0.0.1:3001"
    - "http://127.0.0.1:5173"

# Issue #283 P0-2: 로컬 환경 In-Memory 버퍼 사용
# V5 Migration (Issue #589): Redis buffer removed, use PostgreSQL
# Issue #300: ACL Phase 2 - Nexon Data Collection Scheduler
app:
  buffer:
    redis:
      enabled: false  # V5 Migration: Redis removed
    postgres:
      enabled: true   # PostgreSQL buffer
  event-publisher:
    type: pgmq  # Use PGMQ (PostgreSQL)
  aop:
    trace:
      enabled: true  # TraceAspect 활성화 (V5 로그 분석용)
  v5:
    worker-pool-size: 4
    shutdown-timeout-seconds: 30
    high-priority-worker-ratio: 0.5
    enabled: true
    query-side-enabled: true
  queue:
    expectation:
      high-priority-capacity: 10000

# ACL Phase 2: Scheduler Configuration
scheduler:
  nexon-data-collection:
    enabled: false  # 로컬 개발에서 비활성화
    rate: 600000  # 10 minutes (default)
    initial-delay: 30000  # 30 seconds

# Disable other schedulers during local development
  like-sync:
    enabled: false
  expectation-sync:
    enabled: false
  popular-character-warmup:
    enabled: false

# Z.ai LangChain4j Configuration (Issue #251)
langchain4j:
  glm-4:
    chat-model:
      enabled: false  # 로컬 개발에서 비활성화
      base-url: https://api.z.ai/api/paas/v4
      model-name: glm-4.7
      timeout: 60s

# ADR-0345: Resilience4j Configuration for Stateless Alert System
resilience4j:
  circuitbreaker:
    instances:
      discordWebhook:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        minimumNumberOfCalls: 5
        registerHealthIndicator: true
  retry:
    instances:
      discordWebhook:
        maxAttempts: 3
        waitDuration: 500ms
        exponentialBackoffMultiplier: 2.0
        retryExceptions:
          - org.springframework.web.reactive.function.client.WebClientRequestException
          - io.netty.channel.ConnectTimeoutException
  timelimiter:
    instances:
      discordWebhook:
        timeoutDuration: 5s

# Admission Control (throughput tuning)
admission-control:
  max-in-flight: 100
  max-queue-size: 2000

# PGMQ Worker Configuration
pgmq:
  worker:
    common:
      worker-pool-size: 24  # V5 cold-miss throughput sweet spot from load-test runs
      sequential-batch-ms: 500  # Buffer 500ms for batch dedup (90% compute reduction)
      # Only affects workers with supportsTwoPhase=true (expectation-calc).
      # donation/nexon-fanout have supportsTwoPhase=false → sequential mode ignored.
      visibility-timeout-sec: 300  # 120→300: sequential batch may take longer than parallel
    expectation-calc-high:
      enabled: false  # bypassed: Controller dispatches directly to external_api_queue
    expectation-calc-low:
      enabled: true
    external-api:
      enabled: true

# Bulk Loading Configuration (Issue #611)
bulk:
  enabled: true
  csv-path: classpath:data/userIgn_List.csv
  checkpoint-path: ./checkpoint.json
  failed-path: ./failed.csv
  semaphore:
    permits: 10  # Reduced from 150 - Nexon API rate limiting
  batch:
    initial-size: 100
    min-size: 10
    max-size: 200
  delay:
    initial-ms: 100  # Increased delay between requests
    min-ms: 50
    max-ms: 1000

snapshot:
  store:
    local:
      base-path: ./snapshots
