# PostgreSQL Production Configuration
# Enables PGMQ workers for Like and Donation systems

pgmq:
  worker:
    donation:
      enabled: true
      polling-interval-ms: 1000
      batch-size: 10
      max-retries: 3
    expectation-calc-high:
      enabled: true
      polling-interval-ms: 100
      batch-size: 10
      max-retries: 3
    expectation-calc-low:
      enabled: true
      polling-interval-ms: 500
      batch-size: 50
      max-retries: 3

# PostgreSQL connection pool for scale-out
spring:
  datasource:
    hikari:
      maximum-pool-size: 20

# Lock implementation: PostgreSQL Advisory Locks
maple:
  infra:
    lock:
      impl: postgres
    singleflight:
      impl: postgres
