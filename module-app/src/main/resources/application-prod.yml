# application-prod.yml

server:
  tomcat:
    threads:
      max: 25  # t3.small (2 vCPUs): 10-12 threads per vCPU for I/O-bound workloads
    max-http-post-size: 262144  # 256KB (#266 P1-4: JSON DoS 방어)

spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${DB_URL}

    hikari:
      maximum-pool-size: 25  # Match Tomcat threads (prevent connection starvation)
      minimum-idle: 5  # Allow dynamic scaling (save ~50-100MB RAM during low traffic)
      leak-detection-threshold: 60000  # P2 Unit 7: Log warning if connection held > 60s
      # P2 Unit 7: JMX monitoring for HikariCP metrics (connections, pending, latency)
      register-mbeans: true
      # P2 Unit 7: Pool sizing formula: (CPU cores × 2) + effective_disk_count
      # t3.small (2 vCPUs): (2 × 2) + 1 = 5 base, scaled to 25 for I/O-bound workload
      # Formula: threads.max = maximum-pool-size to prevent connection waits

  jpa:
    open-in-view: false  # P2-24: 명시적 비활성화 - 트랜잭션 경계 외부에서 지연 로딩 방지, N+1 쿼리 감지
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_batch_fetch_size: 100
        jdbc:
          batch_size: 100
        order_inserts: true
        order_updates: true

  # Redis/MongoDB removed in Issue #589, #590

# Discord Alert Configuration
alert:
  discord:
    webhook-url: ${ALERT_DISCORD_WEBHOOK_URL:}

# CORS 설정 (Issue #172: 프로덕션 환경)
# CRITICAL: CORS_ALLOWED_ORIGINS 환경변수 미설정 시 기본값 사용
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://www.maple-ex.my,https://maple-ex.my}
  max-age: 86400  # 24시간 (프로덕션에서는 캐시 시간 늘림)

cube:
  table-mass:
    policy: LENIENT

# PGMQ Worker Configuration (#743)
pgmq:
  worker:
    common:
      sequential-batch-ms: 500  # Buffer 500ms before sequential batch processing
      # Only affects workers with supportsTwoPhase=true (expectation-calc).
      # donation/nexon-fanout have supportsTwoPhase=false → sequential mode ignored.
      # worker-pool-size uses default (availableProcessors*2). Sequential mode works
      # with any pool size — cache locality benefit is highest at 2 threads per CPU.
    donation:
      enabled: true
      polling-interval-ms: 1000
      batch-size: 10
      max-retries: 3
    expectation-calc-high:
      enabled: true
      polling-interval-ms: 100
      batch-size: 10
      max-retries: 3
    expectation-calc-low:
      enabled: true
      polling-interval-ms: 500
      batch-size: 50
      max-retries: 3
    nexon-fanout:
      enabled: true
      polling-interval-ms: 50
      batch-size: 50
      max-retries: 5
    nexon-api:
      enabled: true
      polling-interval-ms: 50
      batch-size: 20
      max-retries: 5
      visibility-timeout-sec: 120

# V5 Stateless Architecture (#271)
# V5 Migration (Issue #589): Redis removed, PostgreSQL-only
app:
  buffer:
    redis:
      enabled: false  # V5 Migration: Redis removed
    postgres:
      enabled: true   # PostgreSQL buffer (PGMQ)

# Issue #284 DoD: Redis 장애 시 1000 RPS fallback 용량
# NOTE: Main Pool(50) + Lock Pool(50) = 100 total (RDS max_connections 고려)
lock:
  datasource:
    pool-size: 50

# Thread Pool 최적화 (P2-25: t3.small 2vCPU 기준)
# 규칙: 모든 executor는 1:2 core:max 비율 준수
executor:
  equipment:
    core-pool-size: 16    # I/O-bound: 2vCPU × 8 (API 호출, DB)
    max-pool-size: 32
    queue-capacity: 500
  preset:
    core-pool-size: 6     # CPU-bound: 2vCPU × 3 (계산 작업)
    max-pool-size: 12
    queue-capacity: 200
  alert:
    core-pool-size: 2     # Background: 최소 설정 (저우선도 알림)
    max-pool-size: 4
    queue-capacity: 200
  expectation:
    core-pool-size: 4     # Compute: I/O-bound × 2 (파싱/계산/외부 호출)
    max-pool-size: 8
    queue-capacity: 200
  async:
    core-pool-size: 4     # @Async methods: 1:2 ratio
    max-pool-size: 8
    queue-capacity: 100
  operational:
    core-pool-size: 16    # Real-time user requests: same as equipment (I/O-bound)
    max-pool-size: 32
    queue-capacity: 500
  backfill:
    core-pool-size: 4     # Batch/background: smaller pool, larger queue
    max-pool-size: 8
    queue-capacity: 500
  item:
    core-pool-size: 16    # Capacity tuning: 3× throughput vs 4/8 (load test verified)
    max-pool-size: 32
    queue-capacity: 500

# Issue #278: Scale-out 환경 실시간 좋아요 동기화 (prod)
like:
  realtime:
    transport: rtopic  # 배포 후 reliable-topic으로 전환 (Blue-Green 배포 필수)

# #275 Auto Warmup: 프로덕션에서 활성화
scheduler:
  warmup:
    enabled: true           # 자동 웜업 활성화
    top-count: 100          # 상위 100개 캐릭터 웜업
    delay-between-ms: 50    # 프로덕션에서는 더 빠르게

# SpringDoc OpenAPI (Swagger UI) - 프로덕션에서 비활성화
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# Global Admission Control (Issue #617) - Production Configuration
admission-control:
  max-in-flight: 100        # Max concurrent cold-path calculations (t3.small: 2vCPU)
  queue-timeout-ms: 5000    # Max wait time in queue
  max-queue-size: 1000      # Maximum pending requests (10x max-in-flight)
  worker-pool-size: 16      # Worker threads for queue consumption (non-blocking HTTP threads)

# Advanced Admission Control Features (Phase 2) - Production
priority-admission:
  enabled: true             # 🔥 ENABLED: Priority queue for hot characters
  levels:
    cache-hit: 100
    hot-character: 80
    normal: 50
    cold-heavy: 10

adaptive-admission:
  enabled: true             # 🔥 ENABLED: CPU-based adaptive control
  cpu-thresholds:
    critical: 7.0
    high: 5.0
    normal: 5.0

degrade-strategy:
  enabled: true             # 🔥 ENABLED: Stale cache fallback on rejection
  levels:
    fresh-cache: true
    stale-cache: true
    fallback: true

cache-prefetch:
  enabled: true             # 🔥 ENABLED: Hot character prefetch
  interval-ms: 60000
  hot-character-count: 100

# ADR-0345: Resilience4j Configuration for Stateless Alert System
resilience4j:
  circuitbreaker:
    instances:
      discordWebhook:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        minimumNumberOfCalls: 5
        registerHealthIndicator: true
  retry:
    instances:
      discordWebhook:
        maxAttempts: 3
        waitDuration: 500ms
        exponentialBackoffMultiplier: 2.0
        retryExceptions:
          - org.springframework.web.reactive.function.client.WebClientRequestException
          - io.netty.channel.ConnectTimeoutException
  timelimiter:
    instances:
      discordWebhook:
        timeoutDuration: 5s

snapshot:
  store:
    local:
      base-path: /data/snapshots