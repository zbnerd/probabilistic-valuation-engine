# application-prod.yml

spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

    hikari:
      maximum-pool-size: 50
      minimum-idle: 50

  jpa:
    open-in-view: false  # P2-24: 명시적 비활성화 - 트랜잭션 경계 외부에서 지연 로딩 방지, N+1 쿼리 감지
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_batch_fetch_size: 100
        jdbc:
          batch_size: 100
        order_inserts: true
        order_updates: true

  # Redis Standalone 설정 (운영 환경)
  data:
    redis:
      host: localhost
      port: 6379
    # P1-10: MongoDB Eventual Consistency Configuration
    # In replica set: secondaryPreferred for read scalability, majority for strong consistency
    mongodb:
      # Read from secondaries when available (reduces primary load)
      read-preference: secondaryPreferred
      # Strong consistency: only read committed data replicated to majority
      read-concern: majority

# Discord Alert Configuration
alert:
  discord:
    webhook-url: ${ALERT_DISCORD_WEBHOOK_URL:}

# CORS 설정 (Issue #172: 프로덕션 환경)
# CRITICAL: CORS_ALLOWED_ORIGINS 환경변수 미설정 시 기본값 사용
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://www.maple-ex.my,https://maple-ex.my}
  max-age: 86400  # 24시간 (프로덕션에서는 캐시 시간 늘림)

cube:
  table-mass:
    policy: LENIENT

# V5 Stateless Architecture (#271)
app:
  buffer:
    redis:
      enabled: true  # Scale-out 모드 활성화

# Issue #284 DoD: Redis 장애 시 1000 RPS fallback 용량
# NOTE: Main Pool(50) + Lock Pool(50) = 100 total (RDS max_connections 고려)
lock:
  datasource:
    pool-size: 50

# Thread Pool 최적화 (P2-25: t3.small 2vCPU 기준)
# 규칙: 모든 executor는 1:2 core:max 비율 준수
executor:
  equipment:
    core-pool-size: 16    # I/O-bound: 2vCPU × 8 (API 호출, DB)
    max-pool-size: 32
    queue-capacity: 500
  preset:
    core-pool-size: 6     # CPU-bound: 2vCPU × 3 (계산 작업)
    max-pool-size: 12
    queue-capacity: 200
  alert:
    core-pool-size: 2     # Background: 최소 설정 (저우선도 알림)
    max-pool-size: 4
    queue-capacity: 200
  expectation:
    core-pool-size: 4     # Compute: I/O-bound × 2 (파싱/계산/외부 호출)
    max-pool-size: 8
    queue-capacity: 200

# Issue #278: Scale-out 환경 실시간 좋아요 동기화 (prod)
like:
  realtime:
    transport: rtopic  # 배포 후 reliable-topic으로 전환 (Blue-Green 배포 필수)

# #275 Auto Warmup: 프로덕션에서 활성화
scheduler:
  warmup:
    enabled: true           # 자동 웜업 활성화
    top-count: 100          # 상위 100개 캐릭터 웜업
    delay-between-ms: 50    # 프로덕션에서는 더 빠르게

# SpringDoc OpenAPI (Swagger UI) - 프로덕션에서 비활성화
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# ADR-0345: Resilience4j Configuration for Stateless Alert System
resilience4j:
  circuitbreaker:
    instances:
      discordWebhook:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        minimumNumberOfCalls: 5
        registerHealthIndicator: true
  retry:
    instances:
      discordWebhook:
        maxAttempts: 3
        waitDuration: 500ms
        exponentialBackoffMultiplier: 2.0
        retryExceptions:
          - org.springframework.web.reactive.function.client.WebClientRequestException
          - io.netty.channel.ConnectTimeoutException
  timelimiter:
    instances:
      discordWebhook:
        timeoutDuration: 5s