spring:
  threads:
    virtual:
      enabled: true
  application:
    name: maple-expectation
  autoconfigure:
    exclude:
      - dev.langchain4j.openai.spring.AutoConfig
  profiles:
    active: local # [Safety Guard] 별도 설정 없으면 무조건 로컬 모드
  lifecycle:
    timeout-per-shutdown-phase: 50s # Graceful Shutdown 시 충분한 시간 확보 (Equipment 대기 20s + PostgreSQL sync + 여유)

  # 공통 드라이버 설정 (PostgreSQL - Issue #591)
  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      register-mbeans: true # JMX를 통해 지표 노출 활성화
      connection-timeout: 3000      # 커넥션 획득 타임아웃 3초 (Red Agent P1 Fix)
      leak-detection-threshold: 60000  # 60초 이상 반납 안되면 누수 의심 로그

  # 공통 JPA 설정
  jpa:
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 100  # P2-24: N+1 쿼리 방지를 위한 배치 페칭 설정
        jdbc:
          batch_size: 1000
        format_sql: false
        show_sql: false
        ddl-auto: update  # 자동 테이블 생성 및 업데이트 (개발/테스트 환경)

  # Spring Batch 설정 (Issue #251 Phase 4, Issue #356 Batch Refresh)
  batch:
    jdbc:
      initialize-schema: always  # 배치 메타데이터 테이블 자동 생성
    job:
      enabled: true  # 스케줄러 사용 시 true

# Batch Job Schedule Configuration (Issue #356)
batch:
  equipment-refresh:
    cron: "0 0 2 * * *"  # 매일 새벽 2시 실행
    chunk-size: 100
    fetch-size: 1000

# Adaptive Micro-Batching Configuration (Issue #588)
adaptive-micro-batch:
  semaphore-permits: 10      # Fast Lane 동시 실행 수 (DB 커넥션 풀 크기 고려)
  batch-max-wait-ms: 10      # 배치 최대 대기 시간 (ms)
  batch-max-size: 50         # 배치 최대 크기
  chunk-size: 100            # IN 쿼리 최대 파라미터 수
  request-timeout-ms: 500    # 요청 타임아웃 (ms)

management:
  endpoints:
    web:
      exposure:
        include: "health,info,metrics,prometheus,loggers"
    enabled-by-default: true

  endpoint:
    health:
      show-details: always # 서킷 브레이커 상태를 상세히 보기 위해 필수
    prometheus:
      enabled: true
    metrics:
      enabled: true
    # Issue #22: 민감한 액추에이터 엔드포인트 비활성화
    env:
      enabled: false
    shutdown:
      enabled: false
    heapdump:
      enabled: false
    threaddump:
      enabled: false
    beans:
      enabled: false
  health:
    circuitbreakers:
      enabled: true
    components:
      hikari:
        enabled: true  # HikariCP 커넥션 풀 상태 노출
  metrics:
    tags:
      application: ${spring.application.name} # 모든 메트릭에 앱 이름 태그 부여
      chaos.test: ${CHAOS_TEST:false}
    export:
      prometheus:
        enabled: true
    distribution:
      percentiles-histogram:
        http.server.requests: [0.5, 0.95, 0.99]
      percentiles:
        http.server.requests: [0.5, 0.95, 0.99]
  # OpenTelemetry tracing 설정 (Context7 Best Practice)
  tracing:
    enabled: ${OTEL_ENABLED:false}  # 기본 비활성화 (prod에서 true)
    sampling:
      probability: 0.05  # [P0-Green] 5% Head Sampling

resilience4j:
  circuitbreaker:
    circuit-breaker-aspect-order: 400
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowSize: 10              # 최근 10번의 호출 기준
        failureRateThreshold: 50           # 실패율 50% 이상 시 Open
        waitDurationInOpenState: 10s       # Open 유지 시간
        permittedNumberOfCallsInHalfOpenState: 3
        ignoreExceptions:
          # 비즈니스 예외(404 등)는 실패로 카운트하지 않음
          - maple.expectation.error.exception.marker.CircuitBreakerIgnoreMarker
        recordExceptions:
          - maple.expectation.error.exception.marker.CircuitBreakerRecordMarker
    instances:
      nexonApi:
        baseConfig: default
        minimumNumberOfCalls: 10        # 최소 10번 호출 후 통계 산출 (Red Agent P1 Fix)
      likeSyncDb:  # Issue #48: Like Sync DB Batch Update 전용 Circuit Breaker
        baseConfig: default
        slidingWindowSize: 5            # 최근 5번의 청크 처리 기준
        failureRateThreshold: 60        # 60% 실패율에서 Open
        waitDurationInOpenState: 30s    # Open 후 30초 대기 (DB 복구 시간 확보)
        minimumNumberOfCalls: 3         # 최소 3번 호출 후 통계 산출
        permittedNumberOfCallsInHalfOpenState: 2
        registerHealthIndicator: true
      postgresLock:  # PostgreSQL 분산 락 전용 Circuit Breaker (Issue #591)
        slidingWindowSize: 20              # 락 작업은 빈번하므로 더 많은 샘플 수집
        failureRateThreshold: 60           # 60% 실패율에서 Open (락 경합은 정상적일 수 있음)
        waitDurationInOpenState: 30s       # Open 후 30초 대기 (DB 복구 시간 확보)
        minimumNumberOfCalls: 5            # 최소 5번 호출 후 통계 산출
        permittedNumberOfCallsInHalfOpenState: 3
        registerHealthIndicator: true
        recordExceptions:                  # 이 예외들이 발생하면 실패로 간주
          - java.util.concurrent.TimeoutException
      openAiApi:  # [P0-Red] Issue #251: OpenAI API Circuit Breaker
        baseConfig: default
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 60s       # LLM 복구 시간 확보
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        registerHealthIndicator: true

  bulkhead:
    instances:
      nexonApi:
        maxConcurrentCalls: 50          # 동시 Nexon API 호출 최대 50개
        maxWaitDuration: 500ms          # 대기 최대 500ms

  retry:
    retry-aspect-order: 399 # Retry가 CircuitBreaker를 감싸도록 설정
    instances:
      nexonApi:
        maxAttempts: 3
        waitDuration: 500ms
        retryExceptions:
          - java.util.concurrent.TimeoutException
          - io.netty.handler.timeout.ReadTimeoutException  # Reactor Netty responseTimeout 발생 시
          - org.springframework.web.reactive.function.client.WebClientRequestException # 네트워크 단절 대응
          - java.net.UnknownHostException
          - maple.expectation.error.exception.ExternalServiceException  # Issue #202: 외부 서비스 장애 시 재시도
      likeSyncRetry:  # P1-2: ResilienceConfig → YAML 이관
        maxAttempts: 3             # 최대 3번 시도 (처음 1번 + 재시도 2번)
        waitDuration: 1s           # 1초부터 시작
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2.0
        randomizationFactor: 0.5   # ✅ Jitter 추가 (Retry Storm 방지 - 09-retry-storm.md 해결)
        retryExceptions:           # P1-9: 명시적 재시도 대상 (LikeSyncCircuitOpenException 제외)
          - org.springframework.dao.DataAccessException
          - org.springframework.jdbc.BadSqlGrammarException
          - java.sql.SQLException
      nexonLockRetry:
        maxAttempts: 5             # 최대 5번 시도 (락 경합이 심할 때를 대비해 조금 넓넉히)
        waitDuration: 200ms        # 0.2초 간격으로 다시 시도
        retryExceptions:           # 이 예외가 발생했을 때만 재시도함
          - maple.expectation.error.exception.DistributedLockException

  timelimiter:
    timelimiter-aspect-order: 398 # TimeLimiter → Retry → CircuitBreaker 순서
    instances:
      nexonApi:
        # 상한 예산: maxAttempts*(connect+response) + (maxAttempts-1)*wait + margin
        # = 3*(3s+5s) + 2*0.5s + 3s = 24 + 1 + 3 = 28s (3회 재시도 최악 시나리오 상한 보장)
        timeoutDuration: 28s        # 전체 작업 타임아웃 (3회 재시도 상한 보장)
        cancelRunningFuture: true   # 타임아웃 시 실행 중인 Future 취소

logging:
  level:
    org.springframework.cache: INFO
    maple.expectation.aop.aspect: INFO
    root: info
    org.hibernate.SQL: info
    org.hibernate.orm.jdbc.batch: ERROR
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%X{requestId}] --- [%thread] %-40.40logger{39} : %m%n"

# Observability 설정 (Issue #143)
observability:
  loki:
    url: ${LOKI_URL:http://localhost:3100}

# 넥손 API 설정
nexon:
  api:
    key: ${NEXON_API_KEY}
    # 타임아웃 설정 (기본값 - 필요 시 환경별로 오버라이드)
    connect-timeout: 3s              # TCP 연결 타임아웃
    response-timeout: 5s             # HTTP 응답 타임아웃
    cache-follower-timeout-seconds: 30  # Issue #225: 32s → 30s (TimeLimiter 28s + 여유 2s, Zombie Request 방지)
    latch-initial-ttl-seconds: 60    # 래치 초기 TTL (리더 크래시 대비)
    latch-finalize-ttl-seconds: 10   # 래치 정리 후 TTL (팔로워 조회 여유)
  retry:
    polling-interval-ms: 10000      # PGMQ 폴링 주기 (10초)
    recover-stalled-interval-ms: 300000  # Stalled 복구 체크 주기 (5분)

server:
  shutdown: graceful
  # Tomcat thread pool configured in profile-specific files (local/prod/ci)
  # Virtual Thread enabled (spring.threads.virtual.enabled=true) but Tomcat threads
  # still needed for platform thread workers that handle I/O-bound requests
  tomcat:
    max-http-post-size: 262144  # 256KB (#266 P1-4: JSON DoS 방어)
    uri-encoding: UTF-8  # 한글 URL 지원

# Rate Limiting (Issue #652)
ratelimit:
  enabled: true

app:
  instance-id: ${HOSTNAME:${random.uuid}}  # Issue #278: Scale-out Pub/Sub Self-skip용
  optimization:
    use-compression: true
  aop:
    trace:
      enabled: true
  shutdown:
    backup-directory: /tmp/maple-shutdown
    archive-directory: /tmp/maple-shutdown/processed
  buffer:
    redis:
      enabled: false  # Redis removed in Issue #589
  cache:
    notify:
      poll-interval-ms: 100
      reconnect-delay-ms: 5000
  queue:
    expectation:
      max-queue-size: 10000
      high-priority-capacity: 1000
  monitoring:
    grafana:
      dashboards-path: ./grafana/dashboards
    prometheus:
      base-url: http://localhost:9090
    interval-seconds: 15
    query-range-seconds: 300
    z-score:
      enabled: true
      window-points: 60
      threshold: 3.0

# AI SRE (LangChain4j) - Issue #251
ai:
  sre:
    enabled: ${AI_SRE_ENABLED:false}

langchain4j:
  glm-4:
    chat-model:
      base-url: ${GLM_4_BASE_URL:https://api.z.ai/api/paas/v4}
      api-key: ${GLM_4_API_KEY:}
      model-name: ${GLM_4_MODEL_NAME:glm-4.7}
      timeout: 60s
      log-requests: false
      log-responses: false
  open-ai:
    chat-model:
      api-key: ${OPENAI_API_KEY:}
      model-name: ${OPENAI_MODEL_NAME:gpt-4o-mini}

# SpringDoc OpenAPI (Swagger UI) - Context7 Best Practice
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true
    persist-authorization: true  # JWT 토큰 유지
  packages-to-scan: maple.expectation.controller
  show-actuator: false
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

# Cache 설정 (P1-2: TTL/Size 외부화, P0-4: lockWaitSeconds, Issue #555: L2 활성화)
cache:
  # Issue #555: L2 캐시 활성화 여부 (false 시 Caffeine-only 모드)
  l2:
    enabled: true  # 기본값: true (기존 동작 호환)
    impl: postgres  # postgres (redis removed in Issue #589)
  specs:
    equipment:
      l1-ttl-minutes: 5
      l1-max-size: 5000
      l2-ttl-minutes: 10
      l2-serializer: json
    cubeTrials:
      l1-ttl-minutes: 10
      l1-max-size: 5000
      l2-ttl-minutes: 20
      l2-serializer: jdk
    flameTrials:
      l1-ttl-minutes: 10
      l1-max-size: 5000
      l2-ttl-minutes: 20
      l2-serializer: jdk
    ocidCache:
      l1-ttl-minutes: 30
      l1-max-size: 5000
      l2-ttl-minutes: 60
      l2-serializer: json
    characterBasic:
      l1-ttl-minutes: 15
      l1-max-size: 5000
      l2-ttl-minutes: 15
      l2-serializer: json
    expectationV4:
      l1-ttl-minutes: 60
      l1-max-size: 5000
      l2-ttl-minutes: 60
      l2-serializer: jdk
    fingerprintOcidsCache:
      l1-ttl-minutes: 30
      l1-max-size: 1000
      l2-ttl-minutes: 60
      l2-serializer: json
  singleflight:
    lock-wait-seconds: 5  # P0-4 Fix: 30초 → 5초 (cold burst 스레드 고갈 방지)
  # Cache Invalidation 설정 (Issue #278: L1 Cache Coherence)
  invalidation:
    pubsub:
      enabled: true  # Scale-out 환경 L1 캐시 무효화 Pub/Sub 활성화

# Like Sync 설정 (Issue #147: PostgreSQL, Issue #48: 청킹)
like:
  sync:
    strategy: postgres  # postgres (redis removed in Issue #589)
    chunk-size: 500  # Issue #48: 청크 크기 (Green Agent 분석: PostgreSQL 최적값)
    recovery:
      enabled: true  # 서버 시작 시 Orphan Key 자동 복구 (@PostConstruct)
    temp-key-ttl-seconds: 3600  # 임시 키 TTL (1시간) - JVM 크래시 대비 안전장치
  # Issue #278: Scale-out 환경 실시간 좋아요 동기화
  realtime:
    enabled: false  # Redis Pub/Sub removed in Issue #589
    transport: pgmq  # pgmq (rtopic removed with Redis)

# BYOK 인증 설정 (Issue #146)
auth:
  jwt:
    secret: ${JWT_SECRET}  # 필수 환경변수 (미설정 시 앱 시작 실패)
    expiration: 900  # 15분 (초) - Issue #279: Access Token 단축
  refresh-token:
    expiration: 604800  # 7일 (초) - Issue #279: Refresh Token 도입
  fingerprint:
    secret: ${FINGERPRINT_SECRET}  # 필수 환경변수 (미설정 시 앱 시작 실패)
  admin:
    allowlist: ${ADMIN_FINGERPRINTS:}  # 쉼표 구분 fingerprint 목록
  session:
    ttl: 1800  # 30분 (초)

# Expectation Buffer 설정 (#266 ADR 정합성)
expectation:
  buffer:
    shutdown-await-timeout-seconds: 30  # Shutdown 시 진행 중인 offer 대기 (초)
    cas-max-retries: 10                  # CAS 연산 최대 재시도 횟수
    max-queue-size: 10000                # 버퍼 최대 크기 (백프레셔 임계값)
  # Batch size configuration (P1 externalization)
  batch:
    like-relation-sync-size: 100         # 좋아요 관계 동기화 배치 크기
    expectation-write-size: 100          # Expectation 배치 DB 동기화 크기
    acl-writer-size: 1000                # ACL Pipeline 배치 크기
    mysql-fallback-sync-size: 100        # Legacy: kept for config compatibility
  # Discord timeout configuration (P1 externalization)
  discord:
    webhook-timeout-seconds: 5           # Discord Webhook 요청 타임아웃 (초)
    retry-after-default-ms: 1000         # Discord 429 응답 시 기본 Retry-After 딜레이 (ms)
  # Monitoring threshold configuration (P1 externalization)
  monitoring-threshold:
    buffer-saturation-count: 5000        # 버퍼 포화도 경고 임계값
    buffer-saturation-double: 5000.0     # 버퍼 포화도 퍼센트 계산 기준값

# 스케줄러 설정
scheduler:
  like-sync:
    enabled: true  # 좋아요 동기화 스케줄러 활성화
    # Like Sync Pipeline Timing (2x Multiplier)
    # - L1 → L2: 3초 (UX 유지)
    # - L2 → L3 Count: 6초 (3s * 2)
    # - L2 → L3 Relation: 12초 (6s * 2)
    local-flush-delay-ms: 3000       # L1 → L2 Flush (unchanged for UX)
    global-count-delay-ms: 6000      # L2 → L3 Count Sync (5s → 6s)
    global-relation-delay-ms: 12000  # L2 → L3 Relation Sync (10s → 12s)
  warmup:
    enabled: false  # #275 Auto Warmup: 인기 캐릭터 자동 웜업 (prod에서 활성화)
    top-count: 50   # 웜업할 상위 캐릭터 수
    delay-between-ms: 100  # 요청 간 지연 (Thundering Herd 방지)
  nexon-data-collection:
    enabled: false  # ACL Pipeline: Nexon API 데이터 수집 (Issue #300)
    rate: 600000     # 10분마다 실행 (밀리초)
    initial-delay: 30000  # 시작 30초 후 첫 실행
  expectation-calculation:
    enabled: false  # V5 CQRS: 전체 유저 기대값 갱신 스케줄러 (v5.enabled=true时 활성화)
    fixed-delay-ms: 3600000  # 이전 실행 완료 후 대기 시간 (밀리초, 기본값 1시간)
    batch-size: 100  # 한 번에 처리할 유저 수 (페이지 단위)

# CORS 설정 (Issue #172: 환경별 분리)
# 주의: 반드시 환경별 프로필(local/prod)에서 allowed-origins 오버라이드 필요
cors:
  allowed-origins:
    - "http://localhost:3000"  # 기본값 (환경별 오버라이드 필수)
  allow-credentials: true
  max-age: 3600  # 1시간
  validation:
    enabled: true  # Issue #21: 런타임 오리진 검증 필터 활성화

# Prometheus Security 설정 (Issue #20, #34)
# Prometheus 메트릭 엔드포인트 다층 보안
prometheus:
  security:
    enabled: true  # Prometheus Security 필터 활성화
    trusted-proxies: "127.0.0.1,::1,localhost"  # 신뢰할 수 있는 프록시 IP (쉼표 구분)
    internal-networks: "172.16.0.0/12,10.0.0.0/8,192.168.0.0/16"  # 내부 네트워크 CIDR

# MySQL Resilience 설정 (Issue #218, #591: PostgreSQL migration - deprecated)
resilience:
  mysql-fallback:
    enabled: false  # Disabled: MySQL removed in #591
    # P1-2: Hash Tag 적용 (Redis Cluster 환경 동일 슬롯 보장)
    state-key: "{mysql}:state"
    ttl-lock-key: "{mysql}:ttl:lock"
    compensation-stream: "{mysql}:compensation:stream"
    compensation-dlq: "{mysql}:compensation:dlq"
    # P0-2: Debounce 설정 (Flapping 방지)
    debounce-seconds: 5
    # P1-N5: 상태 키 TTL (인스턴스 크래시 대비)
    state-ttl-seconds: 300  # 5분
    # P1-4: Sync 재시도 설정 (배치 크기는 expectation.batch.mysql-fallback-sync-size 사용)
    sync-max-retries: 3
    sync-consumer-group: compensation-sync
    # P0-1: 대상 캐시 패턴 (equipment, ocidCache만)
    target-cache-patterns:
      - "equipment:*"
      - "ocidCache:*"
      - "fingerprintOcidsCache:*"
    # P0-N2: SCAN 성능 설정
    scan-count: 1000
    # P1-N3: Stream MAXLEN (메모리 제한)
    stream-max-len: 10000
    # P1-1: 분산 락 설정
    lock-wait-seconds: 5
    lock-lease-seconds: 30
  # Retry Budget 설정 (Issue #276: Retry Storm 방지)
  retry-budget:
    enabled: true
    max-retries-per-minute: 100  # 1분당 최대 100회 재시도
    window-size-seconds: 60      # 예산 윈도우 (초)
    metrics-enabled: true        # Actuator 메트릭 게시

# ========================================
# Issue #251: AI SRE + OpenTelemetry
# ========================================
# (AI SRE and LangChain4j settings moved to top-level configuration above)

# Spring Batch 설정 - spring.batch는 상단 spring: 블록에 병합됨

# OpenTelemetry 설정 - management.tracing은 상단 management: 블록에 병합됨

otel:
  exporter:
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}
      protocol: http/protobuf
  instrumentation:
    jdbc:
      statement-sanitizer: true  # [P0-Purple] SQL 파라미터 마스킹

# Chaos Test Monitoring 설정
chaos:
  monitoring:
    enabled: ${CHAOS_MONITORING:false}
    retry-storm:
      alert-threshold: 50.0  # 재시도 비율 50% 시 알림
      amplification-threshold: 3.0  # 증폭 비율 3x 시 알림
    pool-exhaustion:
      utilization-threshold: 90.0  # 커넥션 풀 활용도 90% 시 알림
      pending-threshold: 5  # 대기 중인 커넥션 5개 시 알림
    latency-injection:
      alert-threshold: 1000  # 1초 이상 지연 시 알림
    metrics:
      interval: 5000  # 5초 간격으로 메트릭 수집

# PostgreSQL 기반 Write-Behind 버퍼 (P1-2: Scale-out 지원)
# Redis removed in Issue #589


# Thread Pool 설정 외부화 (P1-1)
# Lock DataSource Pool Size 외부화 (Issue #284 DoD)
# Issue #310, #591: PostgreSQL Lock (Redis removed, MySQL removed)
lock:
  impl: postgres  # 분산 락 구현체 (postgres, default: postgres)
  datasource:
    pool-size: 30  # 기본값 (prod에서 150으로 오버라이드)
  migration:
    enabled: true  # 마이그레이션 활성화 여부
    dual-run-duration: 7d  # Dual-Run 기간 (Phase 1)
    monitoring-enabled: true  # 마이그레이션 메트릭 활성화

# Thread Pool 표준화 설정 (P2-25)
# CPU 기반 설정 가이드라인:
# - 2 vCPU: equipment=8:16, preset=6:12, alert=2:4, expectation=4:8
# - 4 vCPU: equipment=16:32, preset=12:24, alert=2:4, expectation=4:8
# - 8 vCPU: equipment=32:64, preset=24:48, alert=2:4, expectation=4:8
# 규칙: 모든 executor는 1:2 core:max 비율 준수
executor:
  equipment:
    core-pool-size: 8
    max-pool-size: 16
    queue-capacity: 200
  preset:
    core-pool-size: 12
    max-pool-size: 24
    queue-capacity: 100
  alert:
    core-pool-size: 2
    max-pool-size: 4
    queue-capacity: 200
  expectation:
    core-pool-size: 4
    max-pool-size: 8
    queue-capacity: 200
  async:
    core-pool-size: 4
    max-pool-size: 8
    queue-capacity: 100
  operational:
    core-pool-size: 8
    max-pool-size: 16
    queue-capacity: 200
  backfill:
    core-pool-size: 4
    max-pool-size: 8
    queue-capacity: 500

# Global Admission Control (Issue #617) - PRODUCTION READY
admission-control:
  max-in-flight: 100        # Max concurrent cold-path calculations
  queue-timeout-ms: 5000    # Max wait time in queue
  max-queue-size: 1000      # Maximum pending requests
  worker-pool-size: 16      # Worker threads for queue consumption

# Advanced Admission Control Features (Phase 2)
priority-admission:
  enabled: false            # Priority queue (hot character priority)
  levels:
    cache-hit: 100          # Cache hit expected
    hot-character: 80       # Hot character
    normal: 50              # Normal request
    cold-heavy: 10          # Cold + heavy calculation

adaptive-admission:
  enabled: false            # CPU-based adaptive control
  cpu-thresholds:
    critical: 7.0           # Reduce to 50%
    high: 5.0               # Reduce to 80%
    normal: 5.0             # Full capacity

degrade-strategy:
  enabled: false            # Fast-fail with stale cache fallback
  levels:
    fresh-cache: true       # Try fresh cache first
    stale-cache: true       # Try stale cache second
    fallback: true          # Default response last

cache-prefetch:
  enabled: false            # Hot character prefetch
  interval-ms: 60000        # Prefetch interval (60 seconds)
  hot-character-count: 100  # Number of hot characters to prefetch

# Micro-Batch Writer (Issue #617 US-003)
micro-batch-writer:
  flush-size: 500           # Buffer size threshold for size-triggered flush
  flush-interval-ms: 50     # Time interval for time-triggered flush (ms)

# Graceful Shutdown 설정 (P1-1, P1-2, P1-3, P1-5: 하드코딩 제거 → YAML 외부화)
shutdown:
  equipment-await-timeout: 20s      # Equipment 비동기 저장 대기 타임아웃
  lock-wait-seconds: 3              # DB 동기화 분산 락 대기 시간
  lock-lease-seconds: 10            # DB 동기화 분산 락 점유 시간
  batch-size: 200                   # Shutdown 시 배치 크기
  empty-batch-retry-count: 3        # 빈 배치 재시도 횟수
  empty-batch-wait-ms: 100          # 빈 배치 간 대기 시간 (ms)
  backup-directory: /tmp/maple-shutdown
  archive-directory: /tmp/maple-shutdown/processed
  instance-id: ${app.instance-id}   # Scale-out 인스턴스 식별자

# V5 CQRS Configuration
v5:
  enabled: true
  query-side-enabled: true  # Enable PostgreSQL Sync Worker and Event Publisher

# Stateless Alert System Feature Flags (Issue #345: ADR-0345 Phase 3)
alert:
  discord:
    webhook-url: ${ALERT_DISCORD_WEBHOOK_URL:}  # Discord Webhook URL (empty = disabled)
  stateless:
    enabled: true                   # Master switch for stateless alert system
    fallback-to-file: true          # Enable file fallback when Discord fails
  in-memory:
    capacity: 1000                   # Maximum alerts stored in memory (LRU eviction)
  file:
    path: /var/log/maple-alerts.log  # File-based alert log path

# FanOut Micro-Batch Configuration (Issue #690)
fanout:
  enabled: false                     # Phase 1: false (검증 후 true)
  semaphore-permits: 30              # Batch Lane 동시성 (Bulkhead(50)과 2중 제한, 실제=min(30,50)=30)
  batch-size: 50                     # Batch Lane 최대 크기
  max-retry-count: 5                 # 429 재시도 최대 횟수
  retry-delay-base-ms: 1000          # 429 재시도 기본 지연 (ms)
  jitter-factor: 0.3                 # 429 재시도 jitter (30%)
  polling-interval-ms: 50            # PGMQ Worker 폴링 간격 (ms)
  queue-name: nexon_fanout_queue     # PGMQ 큐 이름
