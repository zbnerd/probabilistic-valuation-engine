# PostgreSQL Testcontainers Test Profile
# Used by IntegrationTestBase and related tests
# Issue #547: PostgreSQL Migration
# Issue #563: Integration Tests with Testcontainers + PGMQ

spring:
  config:
    activate:
      on-profile: pgtest

  datasource:
    # Testcontainers @ServiceConnection will provide all connection details
    # Setting url to empty string prevents H2 fallback from base application.yml
    url: ""
    hikari:
      maximum-pool-size: 5       # 테스트에서는 적게
      minimum-idle: 2
      connection-timeout: 5000
      leak-detection-threshold: 30000

  jpa:
    open-in-view: false          # 운영과 동일하게
    hibernate:
      ddl-auto: create-drop      # 테스트마다 스키마 재생성
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        show_sql: false          # CI에서는 false (로그 폭발 방지)
        default_batch_fetch_size: 20
        jdbc:
          batch_size: 20

  # V5 Migration (Issue #589, #590, #591): PostgreSQL-only mode
  # Redis and MongoDB removed

  # Auth configuration (use test secrets)
  auth:
    jwt:
      secret: test-secret-key-for-jwt-token-generation-minimum-256-bits
      expiration: 900
    refresh-token:
      expiration: 604800
    fingerprint:
      secret: test-fingerprint-secret-key
    admin:
      allowlist: ""
    session:
      ttl: 1800

  # Disable Discord alerts in test
  alert:
    discord:
      webhook-url: ""

# Disable schedulers in test
scheduler:
  nexon-data-collection:
    enabled: false
  like-sync:
    enabled: false
  expectation-sync:
    enabled: false
  popular-character-warmup:
    enabled: false

# Disable AI features in test
langchain4j:
  glm-4:
    chat-model:
      enabled: false
      base-url: "http://localhost:8080"  # Dummy URL for test
  open-ai:
    chat-model:
      enabled: false
      api-key: "test-api-key"  # Dummy API key for test
      base-url: "http://localhost:8080"  # Dummy URL for test

# Disable rate limiting in test
ratelimit:
  enabled: false

# Cache configuration for test
cache:
  l2:
    enabled: false  # Use Caffeine-only cache (no Redis)
  specs:
    equipment:
      l1-ttl-minutes: 5
      l1-max-size: 5000
    cubeTrials:
      l1-ttl-minutes: 10
      l1-max-size: 5000
    flameTrials:
      l1-ttl-minutes: 10
      l1-max-size: 5000
    ocidCache:
      l1-ttl-minutes: 30
      l1-max-size: 5000
    characterBasic:
      l1-ttl-minutes: 15
      l1-max-size: 5000
    expectationV4:
      l1-ttl-minutes: 60
      l1-max-size: 5000

# CORS for test
cors:
  allowed-origins:
    - "http://localhost:3000"

# App configuration for test
app:
  buffer:
    redis:
      enabled: false  # V5 Migration: Redis removed
  event-publisher:
    type: sync        # 테스트에서는 동기 발행
  aop:
    trace:
      enabled: false  # 테스트에서 AOP 비활성화
  v5:
    enabled: false    # 테스트에서 V5 비활성화

# Cube policy for test
cube:
  table-mass:
    policy: LENIENT

# Logging for debugging
logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: TRACE
    org.testcontainers: INFO
    com.github.dockerjava: WARN
