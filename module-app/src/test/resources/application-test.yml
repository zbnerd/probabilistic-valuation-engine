spring:
  config:
    activate:
      on-profile: test

  # DataSource is auto-configured by TestcontainersConfiguration @ServiceConnection
  # No manual datasource URL/username/password needed here

  jpa:
    open-in-view: false  # P2-24: Explicitly disable OSIV for tests
    hibernate:
      ddl-auto: create-drop
      default_batch_fetch_size: 100  # ADR-019: N+1 Query Optimization
    properties:
      hibernate:
        jdbc:
          batch_size: 100
        order_inserts: true
        order_updates: true
    show-sql: false

  # V5 Migration (Issue #589, #590, #591): PostgreSQL-only mode
  # Redis removed - no external cache dependencies

  # 테스트 환경에서 Scheduler 비활성화 (CI Outbox Table not found 에러 방지)
  task:
    scheduling:
      enabled: false
  scheduling:
    enable: false

  # Spring Batch 비활성화 (테스트 환경에서 DB 스키마 자동 생성 방지)
  batch:
    jdbc:
      initialize-schema: never
    job:
      enabled: false

# V5 Migration: Legacy fallback disabled
resilience:
  mysql-fallback:
    enabled: false  # Deprecated - MySQL removed

# Issue #202: Resilience4j 테스트 환경 설정
resilience4j:
  circuitbreaker:
    instances:
      redisLock:
        slidingWindowSize: 20
        failureRateThreshold: 60
        waitDurationInOpenState: 30s
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        registerHealthIndicator: true
      nexonApi:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 1s  # 테스트: 빠른 복구
        minimumNumberOfCalls: 10  # Issue #202: 테스트 간 CircuitBreaker 격리 (3번 retry로 열리지 않도록)
        registerHealthIndicator: true

  # Issue #202: 테스트 환경 Retry 설정 (운영 500ms → 테스트 50ms)
  retry:
    instances:
      nexonApi:
        maxAttempts: 3
        waitDuration: 50ms  # 테스트 환경: 빠른 재시도
        retryExceptions:
          - java.util.concurrent.TimeoutException
          - maple.expectation.error.exception.ExternalServiceException

  # Issue #202: 테스트 환경 TimeLimiter 설정
  timelimiter:
    instances:
      nexonApi:
        timeoutDuration: 5s  # 테스트 환경: 짧은 타임아웃
        cancelRunningFuture: true

logging:
  level:
    root: info
    maple.expectation: debug
    org.springframework.test: info

nexon:
  api:
    key: dummy-test-key # Codex Bot이 지적한 @Value 주입 실패 해결

# DP 엔진 테이블 검증 설정
cube:
  table-mass:
    policy: LENIENT  # 테스트 환경: 확률 테이블 정규화 허용

# Rate Limiting 설정 (Issue #152)
ratelimit:
  enabled: true
  failure-mode: fail-open
  key-prefix: "{ratelimit}"
  ip:
    enabled: true
    capacity: 100
    window: 1m
    refill-tokens: 10
    refill-period: 6s
  user:
    enabled: true
    capacity: 200
    window: 1m
    refill-tokens: 20
    refill-period: 6s

# Auth 설정 (테스트용)
auth:
  jwt:
    secret: test-jwt-secret-key-for-unit-tests-32chars
    expiration: 900  # 15분 (Issue #279)
  refresh-token:
    expiration: 604800  # 7일 (Issue #279)
  fingerprint:
    secret: test-fingerprint-secret-key-32chars123
  admin:
    allowlist:
  session:
    ttl: 1800

# CORS 설정 (테스트용)
cors:
  allowed-origins:
    - "http://localhost:3000"
  allow-credentials: true
  max-age: 3600

# AI SRE (LangChain4j) - 테스트 환경 설정
ai:
  sre:
    enabled: false

# Event Consumer 설정 (테스트용 기본값)
event:
  consumer:
    high:
      max-concurrent: 50
    low:
      max-concurrent: 20

langchain4j:
  glm-4:
    chat-model:
      base-url: https://api.z.ai/api/paas/v4
      api-key: dummy-test-api-key
      model-name: glm-4
      timeout: 60s
      log-requests: false
      log-responses: false
  open-ai:
    chat-model:
      api-key: dummy-test-openai-key
      model-name: gpt-4o-mini
