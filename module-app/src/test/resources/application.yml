spring:
  profiles:
    active: test  # ✅ 모든 테스트에서 test 프로파일 활성화
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
    hikari:
      maximum-pool-size: 5
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false
        show_sql: false

management:
  endpoint:
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true

resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        # 💡 [핵심 추가] 이 마커가 있어야 ExternalServiceException을 실패로 기록함
        recordExceptions:
          - maple.expectation.error.exception.marker.CircuitBreakerRecordMarker
        # 💡 [핵심 추가] 비즈니스 예외(404 등)는 서킷을 오픈시키지 않음
        ignoreExceptions:
          - maple.expectation.error.exception.marker.CircuitBreakerIgnoreMarker
    instances:
      nexonApi:
        baseConfig: default

  retry:
    instances:
      nexonApi:
        maxAttempts: 3
        waitDuration: 0ms
        # 💡 [핵심 추가] Retry도 어떤 예외일 때 재시도할지 명시해야 함
        retryExceptions:
          - maple.expectation.error.exception.ExternalServiceException

logging:
  level:
    root: info
    org.hibernate.SQL: info
    maple.expectation: info

nexon:
  api:
    key: "test_dummy_key"

alert:
  discord:
    webhook-url: "https://discord.com/api/webhooks/dummy/test"

app:
  optimization:
    use-compression: false
  aop:
    trace:
      enabled: false
  buffer:
    redis:
      enabled: false

# BYOK 인증 설정 (테스트용)
auth:
  jwt:
    secret: test-secret-key-must-be-at-least-32-characters-long-for-hs256
    expiration: 1800
  fingerprint:
    secret: test-fingerprint-secret-key-for-hmac-sha256
  admin:
    allowlist: ""
  session:
    ttl: 1800

# SpringDoc 비활성화 (테스트)
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# 🟨 Yellow Agent Fix: 테스트 시 스케줄러 비활성화 (Flaky Test 방지)
scheduler:
  like-sync:
    enabled: false
  expectation-sync:
    enabled: false

# CORS 설정 (테스트 환경)
cors:
  allowed-origins:
    - "http://localhost:3000"
  allow-credentials: true
  max-age: 3600

# Cache 설정 (테스트 환경)
cache:
  specs:
    equipment:
      l1-ttl-minutes: 5
      l1-max-size: 5000
      l2-ttl-minutes: 10
      l2-serializer: json
    cubeTrials:
      l1-ttl-minutes: 10
      l1-max-size: 5000
      l2-ttl-minutes: 20
      l2-serializer: jdk
    flameTrials:
      l1-ttl-minutes: 10
      l1-max-size: 5000
      l2-ttl-minutes: 20
      l2-serializer: jdk
    ocidCache:
      l1-ttl-minutes: 30
      l1-max-size: 5000
      l2-ttl-minutes: 60
      l2-serializer: json
    characterBasic:
      l1-ttl-minutes: 15
      l1-max-size: 5000
      l2-ttl-minutes: 15
      l2-serializer: json
    expectationV4:
      l1-ttl-minutes: 60
      l1-max-size: 5000
      l2-ttl-minutes: 60
      l2-serializer: jdk
  singleflight:
    lock-wait-seconds: 5

# Expectation Buffer 설정 (테스트 환경 - 작은 값으로 테스트 용이성 확보)
expectation:
  buffer:
    shutdown-await-timeout-seconds: 10  # 테스트용 짧은 타임아웃
    cas-max-retries: 10
    max-queue-size: 1000  # 테스트용 작은 큐 크기