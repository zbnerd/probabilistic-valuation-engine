// ========================================
// Module-Calculator: Kafka-driven chunk processing
// SNAPSHOT_CHUNK_READY event consume → calculate → result publish
// ========================================

plugins {
	alias(libs.plugins.kotlin.jvm)
	alias(libs.plugins.kotlin.spring)
	alias(libs.plugins.spring.boot)
}

dependencies {
	implementation project(':module-common')
	implementation project(':module-core')
	implementation project(':module-infra')

	implementation(libs.kotlin.stdlib)
	implementation(libs.kotlin.reflect)
	implementation(libs.kotlin.logging.jvm)
	implementation(libs.kotlinx.coroutines.core)
	implementation(libs.kotlinx.coroutines.jdk8)
	implementation(libs.kotlinx.coroutines.slf4j)
	implementation(libs.kotlinx.coroutines.reactor)

	// Spring
	implementation(libs.spring.boot)
	implementation(libs.spring.boot.starter.web)

	// Kafka
	implementation(libs.spring.kafka)

	// Jackson
	implementation(libs.jackson.databind)
	implementation(libs.jackson.module.kotlin)

	// Cache
	implementation(libs.caffeine)
	implementation(libs.chronicle.map) {
		// affinity:3.23ea1 references unpublished SNAPSHOT parent, unavailable from Maven Central.
		// Chronicle Map uses affinity only for optional thread pinning; can be excluded.
		exclude group: "net.openhft", module: "affinity"
	}

	// Metrics
	implementation(libs.spring.boot.starter.actuator)
	implementation(libs.micrometer.registry.prometheus)

	// Structured JSON logging
	implementation(libs.logstash.logback.encoder)

	// Testing
	testImplementation(libs.spring.boot.starter.test)
	testImplementation(libs.assertj.core)
	testImplementation(libs.mockito.kotlin)
	testImplementation(libs.kotlinx.coroutines.test)
}

bootJar {
	enabled = true
	archiveClassifier = ""
	mainClass.set("maple.calculator.CalculatorApplicationKt")
}

// Cap JVM direct buffer memory at 512MB (issue #1310).
// Bounds Netty PooledByteBufAllocator + Kafka buffer pool off-heap gap.
// Alert threshold 410MB (80%) in docker/prometheus/rules/offheap-alerts.yml.
tasks.named("bootRun") {
	jvmArgs = [
		"-XX:MaxDirectMemorySize=512m",
	]
}

tasks.named("jar") {
	enabled = true
	archiveClassifier = "plain"
}

// Chronicle Map requires reflection access to JDK internals on JDK 17+
// (setAccessible0 on private AccessibleObject). Without these --add-opens,
// ChronicleMapBuilder.<clinit> throws ExceptionInInitializerError.
tasks.named("test") {
	jvmArgs += [
		"--add-opens=java.base/java.lang.reflect=ALL-UNNAMED",
		"--add-opens=java.base/java.lang=ALL-UNNAMED",
		"--add-opens=java.base/java.util=ALL-UNNAMED",
		"--add-opens=java.base/sun.nio.ch=ALL-UNNAMED",
		"--add-opens=jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED",
		"--add-opens=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED",
		"--add-opens=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED",
		"--add-exports=jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED",
		"--add-exports=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED",
	]
}

