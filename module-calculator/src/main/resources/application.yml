server:
  port: 8082

spring:
  lifecycle:
    timeout-per-shutdown-phase: 6m
  application:
    name: calculator
  main:
    banner-mode: off
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: calculator-snapshot-chunk-processor
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: 50            # bound batch size; keeps poll loop responsive
      max-poll-interval-ms: 10800000  # 3h; covers full item-equipment cycle (default 5min too tight)
    listener:
      ack-mode: manual
      concurrency: 4
      missing-topics-fatal: false     # tolerate topic absent at startup

calculator:
  kafka:
    snapshot-chunk-ready-topic: external-api.snapshot.chunk-ready
    result-chunk-ready-topic: calculator.result.chunk-ready
    consumer-group-id: calculator-snapshot-chunk-processor
    urgent-snapshot-chunk-ready-topic: external-api.urgent.snapshot.chunk-ready
    urgent-consumer-group-id: calculator-urgent-chunk-processor
    consumer-max-retries: 3
    consumer-retry-backoff-ms: 500
  external-api:
    base-url: ${CALCULATOR_EXTERNAL_API_BASE_URL:http://localhost:8081}
  run-id-tracker:
    poll-interval-ms: 30000
  store:
    input-base-path: ../data
  cleanup:
    enabled: false                    # enable to activate cleanup scheduler
    dry-run: false                    # true = log candidates without deleting
    interval-ms: 21600000             # 6 hours between cleanup cycles
    max-delete-runs-per-cycle: 10     # max runs deleted per cycle
    max-delete-bytes-per-cycle: 53687091200  # 50GB max deleted per cycle
    max-runtime-seconds: 300          # hard wall-clock limit per cycle
    runs:
      keep-recent: 5                  # always keep the 5 most recent runs
      keep-within-hours: 12           # keep runs newer than 12 hours
  cache:
    backend: caffeine              # caffeine | chronicle; default caffeine (Chronicle stubbed on JDK 21)
    chronicle:
      path: /var/lib/calculator/chronicle-ocid
      max-entries: 100000

  pipeline:
    worker-count: 4
    channel-capacity: 500

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: calculator

logging:
  level:
    maple.calculator: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

storage:
  backend: ${STORAGE_BACKEND:local}
  local:
    base-path: ${STORE_BASE_PATH:../data}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://minio:9000}
    region: ${MINIO_REGION:us-east-1}
    access-key: ${MINIO_ACCESS_KEY:}
    secret-key: ${MINIO_SECRET_KEY:}
    bucket: ${MINIO_BUCKET:maple-expectation}
    path-style-access: true
