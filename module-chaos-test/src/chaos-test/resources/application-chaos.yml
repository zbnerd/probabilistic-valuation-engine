# ========================================
# Chaos Test Profile Configuration
# ========================================
# Purpose: Dedicated configuration for chaos engineering and nightmare tests
# Usage: SPRING_PROFILES_ACTIVE=chaos
# Note: DataSource URLs are overridden by AbstractContainerBaseTest
# V5 Migration (Issue #589, #590, #591): PostgreSQL-only mode
# ========================================

spring:
  application:
    name: maple-expectation-chaos-test

# V5 Features (required for Spring context to load)
app:
  v5:
    enabled: true
  event-publisher:
    type: pgmq

  # DataSource: Testcontainers PostgreSQL (overridden by AbstractContainerBaseTest)
  # The URL, username, password are set dynamically via System.setProperty()
  datasource:
    url: jdbc:postgresql://localhost:5432/testdb  # Placeholder - overridden by Testcontainers
    driver-class-name: org.postgresql.Driver
    username: test  # Placeholder - overridden by Testcontainers
    password: test  # Placeholder - overridden by Testcontainers
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        show_sql: false
    open-in-view: false

# Auth Configuration (for chaos tests)
auth:
  jwt:
    secret: test-jwt-secret-key-for-chaos-tests-32chars
    expiration: 900  # 15분
  refresh-token:
    expiration: 604800  # 7일
  fingerprint:
    secret: test-fingerprint-secret-key-chaos-32chars
  admin:
    allowlist:
  session:
    ttl: 1800

# CORS Configuration
cors:
  allowed-origins:
    - "http://localhost:3000"
  allow-credentials: true
  max-age: 3600

# Nexon API Configuration
nexon:
  api:
    key: dummy-chaos-test-key

# Resilience4j Configuration
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 50
        minimum-number-of-calls: 10
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        wait-duration-in-open-state: 5s
        failure-rate-threshold: 50
        slow-call-rate-threshold: 100
        slow-call-duration-threshold: 3000ms
        record-exceptions:
          - java.lang.NullPointerException
          - java.io.IOException
          - maple.expectation.error.exception.base.ServerBaseException
        ignore-exceptions:
          - maple.expectation.error.exception.DuplicateLikeException
          - maple.expectation.error.exception.SelfLikeNotAllowedException

  timelimiter:
    configs:
      default:
        timeout-duration: 10s

  retry:
    configs:
      default:
        max-attempts: 3
        wait-duration: 500ms
        retry-exceptions:
          - java.io.IOException
        ignore-exceptions:
          - maple.expectation.error.exception.DuplicateLikeException
          - maple.expectation.error.exception.SelfLikeNotAllowedException

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: maple-expectation-chaos-test

# Logging Configuration
logging:
  level:
    root: INFO
    maple.expectation: DEBUG
    org.springframework.test: DEBUG
    org.testcontainers: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# Testcontainers Configuration
testcontainers:
  reuse: false  # Always fresh containers for chaos tests
  ryuk:
    container:
      image: ghcr.io/testcontainers/ryuk:0.11.0

# Chaos Test Specific Configuration
chaos:
  test:
    timeout: 900000  # 15 minutes per test
    parallel: false  # Sequential execution only
    cleanup:
      enabled: true  # Always cleanup after tests
      docker: true   # Cleanup Docker containers

# Rate limiting disabled for chaos tests (no Redis/ProxyManager required)
ratelimit:
  enabled: false
