server:
  port: 8084

spring:
  application:
    name: cleanup
  profiles:
    active: local

cleanup:
  dry-run: false
  runs:
    keep-recent: 5
    keep-within-hours: 6
  max-delete-runs-per-cycle: 2147483647
  max-delete-bytes-per-cycle: 322122547200
  max-runtime-seconds: 86400
  base-path: ../data

cleanup-inbox:
  topic: synchronizer.chunk.consumed
  consumer-group: cleanup-inbox
  base-path: ../data
  max-pending: 10000
  auto-start: true

logging:
  level:
    maple.cleanup: INFO
    maple.expectation.infrastructure: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: cleanup

storage:
  backend: ${STORAGE_BACKEND:local}
  local:
    base-path: ${STORE_BASE_PATH:../data}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://minio:9000}
    region: ${MINIO_REGION:us-east-1}
    access-key: ${MINIO_ACCESS_KEY:}
    # secret-key is read directly from MINIO_SECRET_KEY_FILE by StorageConfig;
    # do not bind via env var to keep the cleartext key out of process env.
    bucket: ${MINIO_BUCKET:maple-expectation}
    path-style-access: true
