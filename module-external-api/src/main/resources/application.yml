server:
  port: 8081

spring:
  lifecycle:
    timeout-per-shutdown-phase: 6m
  application:
    name: external-api-collector
  main:
    banner-mode: off
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    listener:
      ack-mode: manual
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
      properties:
        buffer.memory: ${KAFKA_BUFFER_MEMORY:67108864}  # 64MB, up from default 32MB (issue #1314)

nexon:
  api:
    key: ${NEXON_API_KEY}
  http-client:
    pool-name: ${NEXON_HTTP_POOL_NAME:nexon-pool}
    max-connections: ${NEXON_HTTP_MAX_CONNECTIONS:250}
    pending-acquire-max-count: ${NEXON_HTTP_PENDING_ACQUIRE_MAX_COUNT:1000}
    pending-acquire-timeout-ms: ${NEXON_HTTP_PENDING_ACQUIRE_TIMEOUT_MS:5000}
    connect-timeout-ms: ${NEXON_HTTP_CONNECT_TIMEOUT_MS:3000}
    response-timeout-seconds: ${NEXON_HTTP_RESPONSE_TIMEOUT_SECONDS:5}
    max-in-memory-size-bytes: ${NEXON_HTTP_MAX_IN_MEMORY_SIZE_BYTES:2097152}
    metrics-enabled: ${NEXON_HTTP_METRICS_ENABLED:true}

external-api:
  rate-limit:
    permits-per-second: ${EXTERNAL_API_RATE_LIMIT_PERMITS_PER_SECOND:250}
    ocid-lookup-permits-per-second: 400
  concurrency:
    max-in-flight: ${EXTERNAL_API_CONCURRENCY_MAX_IN_FLIGHT:250}
    urgent-max-concurrent: ${EXTERNAL_API_URGENT_MAX_CONCURRENT:30}
  batch-size: 1000
  store:
    base-path: ../data
  cleanup:
    enabled: true                     # enable to activate cleanup scheduler
    dry-run: false                    # true = log candidates without deleting
    interval-ms: 21600000             # 6 hours between cleanup cycles
    max-delete-runs-per-cycle: 10     # max runs deleted per cycle
    max-delete-bytes-per-cycle: 53687091200  # 50GB max deleted per cycle
    max-runtime-seconds: 300          # hard wall-clock limit per cycle
    runs:
      keep-recent: 2                  # always keep the 2 most recent runs
      keep-within-hours: 3            # keep runs newer than 3 hours
    consumed:
      enabled: true                   # enable consumed-chunk auto-deletion
      interval-ms: 3600000            # 1 hour between batch deletes
      consumer-group-id: external-api-consumed-chunk-cleanup
  schedule:
    daily-cron: "0 0 3 * * *"  # 매일 새벽 3시 — OCID + CHARACTER_BASIC
    enabled: true
    run-on-startup: true
    skip-character-basic: false
  parser:
    streaming:
      enabled: true                # false = fall back to legacy in-memory parser
  loop:
    executor:
      core-pool-size: 4
      max-pool-size: 16
      queue-capacity: 64
      thread-name-prefix: ext-api-loop-
      virtual-threads: true
      await-termination-seconds: 30
  urgent:
    enabled: false                                    # feature flag for urgent pipeline
    request-topic: urgent-character-request
    not-found-topic: urgent-character-not-found
    chunk-ready-topic: external-api.urgent.snapshot.chunk-ready
    consumer-group-id: external-api-urgent-processor
  snapshot:
    chunk:
      character-basic:
        max-records: 2000
        max-uncompressed-bytes: 134217728
      item-equipment:
        max-records: 500
        max-uncompressed-bytes: 134217728
    queue-capacity: 3000
    events:
      enabled: true
      kafka:
        enabled: true
        chunk-ready-topic: external-api.snapshot.chunk-ready
        run-completed-topic: external-api.snapshot.run-completed
        run-failed-topic: external-api.snapshot.run-failed
        ocid-lookup-topic: external-api.ocid.lookup-ready
  kafka:
    chunk-consumed-topic: synchronizer.chunk.consumed
  ranking:
    enabled: true
    max-pages: 3000
    permits-per-second: 50

auth:
  kafka:
    character-fetch-request-topic: auth-character-fetch-request
    character-fetch-response-topic: auth-character-fetch-response
    request-consumer-group-id: module-external-api-auth-consumer

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: external-api

logging:
  level:
    maple.externalapi: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

storage:
  backend: ${STORAGE_BACKEND:local}
  local:
    base-path: ${STORE_BASE_PATH:../data}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://minio:9000}
    region: ${MINIO_REGION:us-east-1}
    access-key: ${MINIO_ACCESS_KEY:}
    # secret-key is read directly from MINIO_SECRET_KEY_FILE by StorageConfig;
    # do not bind via env var to keep the cleartext key out of process env.
    bucket: ${MINIO_BUCKET:maple-expectation}
    path-style-access: true
