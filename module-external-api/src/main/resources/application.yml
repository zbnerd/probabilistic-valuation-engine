server:
  port: 8081

spring:
  application:
    name: external-api-collector
  main:
    banner-mode: off

nexon:
  api:
    key: ${NEXON_API_KEY}

external-api:
  csv:
    path: ../module-app/src/main/resources/data/userIgn_List.csv
  rate-limit:
    permits-per-second: 200
    ocid-lookup-permits-per-second: 400
  batch-size: 1000
  store:
    base-path: ./external-api-data
  schedule:
    daily-cron: "0 0 3 * * *"  # 매일 새벽 3시 — OCID + CHARACTER_BASIC
    enabled: true
    run-on-startup: true

logging:
  level:
    maple.externalapi: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
