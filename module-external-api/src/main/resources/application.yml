server:
  port: 8081

spring:
  application:
    name: external-api-collector
  main:
    banner-mode: off
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3

nexon:
  api:
    key: ${NEXON_API_KEY}

external-api:
  csv:
    path: ../module-app/src/main/resources/data/userIgn_List.csv
  rate-limit:
    permits-per-second: 200
    ocid-lookup-permits-per-second: 400
  batch-size: 1000
  store:
    base-path: ./external-api-data
  cleanup:
    enabled: true                     # enable to activate cleanup scheduler
    dry-run: true                     # true = log candidates without deleting
    interval-ms: 21600000             # 6 hours between cleanup cycles
    max-delete-runs-per-cycle: 10     # max runs deleted per cycle
    max-delete-bytes-per-cycle: 5368709120  # 5GB max deleted per cycle
    max-runtime-seconds: 60           # hard wall-clock limit per cycle
    runs:
      keep-recent: 5                  # always keep the 5 most recent runs
      keep-within-hours: 48           # keep runs newer than 48 hours
  schedule:
    daily-cron: "0 0 3 * * *"  # 매일 새벽 3시 — OCID + CHARACTER_BASIC
    enabled: true
    run-on-startup: true
    skip-character-basic: false
  snapshot:
    chunk:
      character-basic:
        max-records: 2000
        max-uncompressed-bytes: 134217728
      item-equipment:
        max-records: 500
        max-uncompressed-bytes: 134217728
    queue-capacity: 1000
    events:
      enabled: true
      kafka:
        enabled: true
        chunk-ready-topic: external-api.snapshot.chunk-ready
        run-completed-topic: external-api.snapshot.run-completed
        run-failed-topic: external-api.snapshot.run-failed

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: external-api

logging:
  level:
    maple.externalapi: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
