// ========================================
// Module-Infra: JPA, Redis, 외부 API 구현체
// ADR-017: Infrastructure Layer
// ========================================

plugins {
	alias(libs.plugins.kotlin.jvm)
	alias(libs.plugins.kotlin.spring)
	alias(libs.plugins.kotlin.jpa)
}

// Integration Test Source Set Configuration
sourceSets {
	integrationTest {
		java.srcDir file('src/integrationTest/java')
		resources.srcDir file('src/integrationTest/resources')
		compileClasspath += sourceSets.main.output
		runtimeClasspath += sourceSets.main.output + sourceSets.test.output
	}
}

configurations {
	integrationTestImplementation.extendsFrom testImplementation
	integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
	integrationTestAnnotationProcessor.extendsFrom testAnnotationProcessor
}

// IntelliJ IDEA Integration
idea {
	module {
		testSourceDirs += sourceSets.integrationTest.java.srcDirs
		testResourceDirs += sourceSets.integrationTest.resources.srcDirs
	}
}

dependencies {
	implementation project(':module-core')
	implementation project(':module-common')

	// Kotlin stdlib (required for Kotlin + Java mixed compilation)
	implementation(libs.kotlin.stdlib)

	// Lombok
	compileOnly(libs.lombok)
	annotationProcessor(libs.lombok)
	testCompileOnly(libs.lombok)
	testAnnotationProcessor(libs.lombok)
	integrationTestCompileOnly(libs.lombok)
	integrationTestAnnotationProcessor(libs.lombok)

	// Spring Data JPA
	implementation(libs.spring.boot.starter.data.jpa)
	runtimeOnly(libs.mysql.connector.j)
	implementation(libs.postgresql)  // PGMQ: PGobject for JSONB handling
	runtimeOnly(libs.h2)

	// MongoDB
	implementation(libs.spring.boot.starter.data.mongodb)
	implementation(libs.mongodb.driver.sync)

	// Redis
	implementation(libs.redisson.spring.boot.starter)

	// Caffeine Cache
	implementation(libs.caffeine)

	// Spring Boot (minimal)
	implementation(libs.spring.boot)
	implementation(libs.spring.boot.starter.aop)
	implementation(libs.spring.boot.starter.web)
	implementation(libs.spring.boot.starter.webflux)
	implementation(libs.spring.boot.starter.validation)
	implementation(libs.spring.boot.starter.security)
	implementation(libs.spring.boot.starter.actuator)

	// Resilience4j
	implementation(libs.resilience4j.spring.boot3)

	// OpenTelemetry (migrated from module-app for OpenTelemetryConfig)
	implementation(libs.micrometer.tracing.bridge.otel)
	implementation(libs.opentelemetry.exporter.otlp)
	implementation(libs.opentelemetry.samplers)

	// Bucket4j
	implementation(libs.bucket4j.core)
	implementation(libs.bucket4j.redisson)

	// Jackson
	implementation(libs.jackson.databind)
	implementation(libs.jackson.dataformat.csv)

	// Guava
	implementation(libs.guava)

	// LangChain4j (for AI monitoring)
	implementation(libs.langchain4j.spring.boot.starter)
	implementation(libs.langchain4j.open.ai.spring.boot.starter)

	// Spring Batch (for equipment refresh job)
	implementation(libs.spring.boot.starter.batch)

	// JWT
	implementation(libs.jjwt.api)
	runtimeOnly(libs.jjwt.impl)
	runtimeOnly(libs.jjwt.jackson)

	testImplementation(libs.spring.boot.starter.test)
	testImplementation(libs.testcontainers.mysql)
	testImplementation(libs.testcontainers.postgresql)
	testImplementation(libs.testcontainers.mongodb)

	// Integration Test Dependencies
	integrationTestImplementation(libs.spring.boot.starter.test)
	integrationTestImplementation(libs.testcontainers)
	integrationTestImplementation(libs.testcontainers.junit.jupiter)
	integrationTestImplementation(libs.testcontainers.mysql)
	integrationTestImplementation(libs.testcontainers.postgresql)
	integrationTestImplementation(libs.testcontainers.mongodb)
	integrationTestRuntimeOnly(libs.junit.platform.launcher)
}

// Integration Test Task
tasks.register('integrationTest', Test) {
	description = 'Runs integration tests (Testcontainers, DB, Redis).'
	group = 'verification'

	testClassesDirs = sourceSets.integrationTest.output.classesDirs
	classpath = sourceSets.integrationTest.runtimeClasspath
	useJUnitPlatform()

	shouldRunAfter tasks.test

	// JUnit configuration for integration tests
	useJUnitPlatform {
		includeTags 'integration'
	}

	// JVM settings for integration tests
	jvmArgs = [
		'-Xms512m',
		'-Xmx2048m',
		'-XX:+UseG1GC',
		'-XX:MaxMetaspaceSize=512m'
	]

	// Docker socket for Testcontainers - environment variable AND system property
	environment "DOCKER_HOST", "unix:///var/run/docker.sock"
	systemProperty "DOCKER_HOST", "unix:///var/run/docker.sock"

	// Disable Ryuk container for simpler setup (optional, remove if needed)
	environment "TESTCONTAINERS_RYUK_DISABLED", "true"

	// Testcontainers reuse for faster tests
	systemProperty "testcontainers.reuse.enable", "true"

	// Test logging
	testLogging {
		events "passed", "skipped", "failed"
		exceptionFormat "full"
	}

	// Retry flaky tests
	retry {
		maxRetries = 1
		maxFailures = 5
		failOnPassedAfterRetry = false
	}
}

// Fix duplicate resources issue
tasks.withType(ProcessResources).configureEach {
	duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

// Kotlin compilation must run before Java compilation (for mixed Kotlin-Java modules)
tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
	kotlinOptions {
		jvmTarget = "21"
		freeCompilerArgs += ["-Xjsr305=strict"]
	}
}

// Ensure Java compilation depends on Kotlin compilation
tasks.named('compileJava').configure {
	dependsOn(tasks.named('compileKotlin'))
}

// Lombok annotation processor for integration tests
tasks.named('compileIntegrationTestJava') {
	options.annotationProcessorPath = configurations.integrationTestAnnotationProcessor
}

// Enable plain jar for inter-module dependencies
tasks.named("jar") {
	enabled = true
	archiveClassifier = "plain"
}

// allOpen configuration for JPA entities (required for proxy generation)
allOpen {
	annotation('jakarta.persistence.Entity')
	annotation('jakarta.persistence.MappedSuperclass')
	annotation('jakarta.persistence.Embeddable')
}
