# Maple Infrastructure AutoConfiguration - Default Values
# ADR-014: Multi-Module Cross-Cutting Concerns

# Executor Configuration (Always enabled)
maple.infra.executor.enabled=true

# Cache Configuration (Default: enabled)
maple.infra.cache.enabled=true

# Lock Configuration (Default: enabled)
maple.infra.lock.enabled=true
maple.infra.lock.impl=redis

# Rate Limiting (Default: enabled)
maple.infra.ratelimit.enabled=true
maple.infra.ratelimit.key-prefix=rate_limit

# Buffer Configuration (Default: disabled - Worker only)
maple.infra.buffer.enabled=false
maple.infra.buffer.impl=redis

# Shutdown Configuration (Always enabled)
maple.infra.shutdown.enabled=true
maple.infra.shutdown.timeout-seconds=30

# Filter Configuration (Always enabled)
maple.infra.filter.enabled=true

# PGMQ Configuration (ADR-355)
pgmq.default-batch-size=50
pgmq.default-visibility-timeout=120

# PGMQ Circuit Breaker
pgmq.circuit-breaker.failure-rate-threshold=50
pgmq.circuit-breaker.slow-call-rate-threshold=80
pgmq.circuit-breaker.slow-call-duration-threshold-ms=5000
pgmq.circuit-breaker.wait-duration-in-open-state-ms=30000
pgmq.circuit-breaker.permitted-number-of-calls-in-half-open-state=3
pgmq.circuit-breaker.sliding-window-size=10

# PGMQ Worker Common Settings (ADR-355: batch ↑, VT ↑, interval ↓)
pgmq.worker.common.polling-interval-ms=300
pgmq.worker.common.batch-size=50
pgmq.worker.common.max-retries=3
pgmq.worker.common.visibility-timeout-sec=120

# PGMQ Worker - Calculation (disabled by default)
pgmq.worker.calculation.enabled=false
pgmq.worker.calculation.polling-interval-ms=1000
pgmq.worker.calculation.batch-size=5
pgmq.worker.calculation.max-retries=3

# PGMQ Worker - LikeSync (disabled by default)
pgmq.worker.like-sync.enabled=false
pgmq.worker.like-sync.polling-interval-ms=500
pgmq.worker.like-sync.batch-size=20
pgmq.worker.like-sync.max-retries=5

# PGMQ Worker - Donation (disabled by default)
pgmq.worker.donation.enabled=false
pgmq.worker.donation.polling-interval-ms=1000
pgmq.worker.donation.batch-size=10
pgmq.worker.donation.max-retries=3
