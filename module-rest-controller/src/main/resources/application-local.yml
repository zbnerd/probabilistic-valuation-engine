# Local profile overrides

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

auth:
  jwt:
    secret: ${JWT_SECRET}

expectation:
  v6:
    enabled: true
    request-timeout-ms: 5000
    cache-ttl-seconds: 300  # Redis cache TTL for read model entries
