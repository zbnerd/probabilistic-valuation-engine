server:
  port: 8083

spring:
  application:
    name: synchronizer
  main:
    banner-mode: off
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
      - org.springframework.boot.autoconfigure.security.servlet.SecurityFilterAutoConfiguration
      - org.springframework.boot.actuate.autoconfigure.security.servlet.ManagementWebSecurityAutoConfiguration
      - org.springframework.boot.autoconfigure.batch.BatchAutoConfiguration
  datasource:
    url: jdbc:postgresql://localhost:5432/maple_expectation?user=maple&password=${DB_ROOT_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
      connection-timeout: 5000
      keepalive-time: 30000
      max-lifetime: 600000
      connection-test-query: SELECT 1
  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: synchronizer-result-chunk-consumer
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    listener:
      ack-mode: manual_immediate
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

synchronizer:
  kafka:
    result-chunk-ready-topic: calculator.result.chunk-ready
    basic-chunk-ready-topic: external-api.snapshot.chunk-ready
    consumer-group-id: synchronizer-result-chunk-consumer
    basic-consumer-group-id: synchronizer-basic-chunk-consumer
    urgent-basic-chunk-ready-topic: external-api.urgent.snapshot.chunk-ready
    urgent-basic-consumer-group-id: synchronizer-urgent-basic-chunk-consumer
    ocid-lookup-enabled: true
    ocid-lookup-topic: external-api.ocid.lookup-ready
    ocid-lookup-consumer-group-id: synchronizer-ocid-lookup-consumer
    chunk-consumed-topic: synchronizer.chunk.consumed
  events:
    consumed:
      enabled: true
  store:
    base-path: ../data
  chunk:
    max-rows: 100000
  reader:
    missing-field-threshold: 100
  ranking:
    enabled: true
    key-prefix: ranking:equipment:total-cost
    batch-size: 1000
    top-size: 10

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: synchronizer

logging:
  level:
    maple.synchronizer: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
