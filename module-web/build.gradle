// ========================================
// Module-Web: Presentation Layer Shared Components
// ADR-037: Web 계층 공통 컴포넌트 (GlobalExceptionHandler 등)
// Spring Web 의존성을 격리하여 module-common의 순수성 유지
// ========================================

plugins {
	id 'org.jetbrains.kotlin.jvm'
	id 'org.jetbrains.kotlin.plugin.spring'
}

dependencies {
	// ADR-005: Hexagonal Architecture - Port 인터페이스만 의존
	// Controller는 Port 인터페이스만 사용, 런타임에 module-app의 Adapter가 DI됨
	implementation project(':module-core')
	implementation project(':module-common')
	implementation project(':module-infra')

	// Kotlin stdlib (required for Kotlin + Java mixed compilation)
	implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.1.0'

	// Spring Web (Presentation Layer)
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-security'

	// OpenAPI/Swagger
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.3.0'

	// Spring Data (for Page interface)
	implementation 'org.springframework.data:spring-data-commons'

	// Resilience4j (for CircuitBreaker exception handling)
	implementation 'io.github.resilience4j:resilience4j-spring-boot3'

	// Lombok
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	// ArchUnit (Architecture Testing)
	testImplementation 'com.tngtech.archunit:archunit-junit5:1.2.1'
}

// Enable plain jar for inter-module dependencies
tasks.named("jar") {
	enabled = true
	archiveClassifier = "plain"
}
