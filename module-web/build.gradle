// ========================================
// Module-Web: Presentation Layer Shared Components
// ADR-037: Web 계층 공통 컴포넌트 (GlobalExceptionHandler 등)
// Spring Web 의존성을 격리하여 module-common의 순수성 유지
// ========================================

plugins {
	alias(libs.plugins.kotlin.jvm)
	alias(libs.plugins.kotlin.spring)
}

dependencies {
	// ADR-005: Hexagonal Architecture - Port 인터페이스만 의존
	// Controller는 Port 인터페이스만 사용, 런타임에 module-app의 Adapter가 DI됨
	implementation project(':module-core')
	implementation project(':module-common')
	implementation project(':module-infra')

	// Kotlin stdlib (required for Kotlin + Java mixed compilation)
	implementation(libs.kotlin.stdlib)

	// Spring Web (Presentation Layer)
	implementation(libs.spring.boot.starter.web)
	implementation(libs.spring.boot.starter.validation)
	implementation(libs.spring.boot.starter.security)

	// OpenAPI/Swagger
	implementation(libs.springdoc.openapi.starter.webmvc.ui)

	// Spring Data (for Page interface)
	implementation(libs.spring.data.commons)

	// Resilience4j (for CircuitBreaker exception handling)
	implementation(libs.resilience4j.spring.boot3)

	// Lombok
	compileOnly(libs.lombok)
	annotationProcessor(libs.lombok)

	// ArchUnit (Architecture Testing)
	testImplementation(libs.archunit.junit5)
}

// Enable plain jar for inter-module dependencies
tasks.named("jar") {
	enabled = true
	archiveClassifier = "plain"
}
