// #262: JDK 21 자동 다운로드를 위한 Foojay Toolchain Resolver
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.10.0'
}

rootProject.name = 'expectation'

// ADR-014/ADR-017: Multi-module structure
include 'module-core'
include 'module-infra'
include 'module-common'
include 'module-app'

// ADR-025: Chaos test module (separate from PR pipeline)
include 'module-chaos-test'

// ADR-017: Web layer (GlobalExceptionHandler, Filter)
include 'module-web'

// External API data collection module (Nexon API → Local Storage)
include 'module-external-api'

// Calculator module (Kafka-driven chunk processing)
include 'module-calculator'

// Synchronizer module (Calculator result files → DB sync)
include 'module-synchronizer'

// Standalone REST Controller module
include 'module-rest-controller'

// Auth module (login, JWT, session)
include 'module-auth'

// Cleanup module (Airflow-triggered disk GC, hosted as standalone Spring Boot app)
include 'module-cleanup'

// Typed object-storage artifacts, lifecycle, retention, and cleanup inbox
include 'module-pipeline-artifact'
